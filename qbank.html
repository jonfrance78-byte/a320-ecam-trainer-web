a:`<p>Avoid an excessive rotation rate and counter the pitch-up from TOGA (Takeoff/Go-Around) thrust. Full back stick, a nose gear rebound and the thrust increase together caused the tail strike. Wait until the aircraft is safely established in the climb before retracting flaps one step and the gear.</p>`,
src:"Safety First: A Focus on the Landing Flare; FCTM PR-NP-SOP Go-Around"},
/* reset */
{id:"sf-reset-1",s:"sf",t:"reset",q:"In which three cases may the flight crew perform a system reset?",
a:`<ol><li>The reset is a step in an ECAM, OEB (Operations Engineering Bulletin), FCOM or QRH (Quick Reference Handbook) procedure.</li><li>The reset is optional, after the ECAM: the alert or malfunction must be listed in the FCOM/QRH <b>System Reset table</b>, and its conditions applied (number of attempts, ground or flight).</li><li>A320 family, <b>on the ground only</b>, for faults caused by electrical transients. If the system is listed, reset only for the alerts listed. If it is not listed, apply the QRH general guidelines.</li></ol><p>If none of these applies, do not reset.</p>`,
src:"Safety First: System Reset — Use with Caution; QRH System Reset"},
{id:"sf-reset-2",s:"sf",t:"reset",q:"Where in the ECAM sequence does an optional reset belong, and what callout comes before it?",
a:`<p>After the ECAM actions. The PF calls <b>"STOP ECAM"</b>. Before the STATUS review, the crew may consider a reset, but only after confirming it is authorised in the System Reset table. Do it "read and do" and cross-check any guarded control or C/B (Circuit Breaker).</p>`,
src:"Safety First: System Reset — Use with Caution; FCTM Operational Philosophy"},
{id:"sf-reset-3",s:"sf",t:"reset",q:"Why did the A/SKID & N/W STRG resets in the case study burst all four main gear tyres?",
a:`<p>No reset is authorised for AUTO BRK FAULT or A/SKID N/WS FAULT. That reset is listed only for BRAKES SYS 1(2) FAULT and BSCU CH 1(2) FAULT. The in-flight resets stopped the BSCU (Brake and Steering Control Unit) detecting a <b>dual tachometer failure</b>. At touchdown it took the wheel speed as 0 kt. After 15 s it restored braking with a default deceleration, but it could not compute antiskid, so it sent full pressure to the brakes.</p>`,
src:"Safety First: System Reset — Use with Caution"},
{id:"sf-reset-4",s:"sf",t:"reset",q:"What must be recorded after any crew reset, and why does it matter?",
a:`<p>Every reset goes in the tech log, whether it succeeded or not, with the <b>number of attempts</b>. Repeated resets of the same system point to a permanent fault. Unreported resets hide a deteriorating system that can fail later in flight (in the case study, 9 related faults in 2 months were reset without troubleshooting).</p>`,
src:"Safety First: System Reset — Use with Caution"},
/* desc */
{id:"sf-desc-1",s:"sf",t:"desc",q:"How does ground speed mini differ between the A320ceo and the A320neo family, and why?",
a:`<p>GS mini (ground speed mini) adds a fraction of the difference between the current headwind and the tower headwind to the IAS (Indicated Airspeed) target.</p><ul><li><b>A320ceo:</b> factor k = 1, the full difference.</li><li><b>A320neo family:</b> k = 0.33.</li></ul><p>The neo decelerates less well. With a strong ground effect, k = 1 could leave it fast at the flare. With 0.33, for example, a 20 kt headwind at 200 ft that falls to a 5 kt tower value needs only about 5 kt of deceleration instead of 15. The trade-off is slightly more thrust activity in gusts.</p>`,
src:"Safety First: Control your Speed — Descent, Approach and Landing"},
{id:"sf-desc-2",s:"sf",t:"desc",q:"In DES mode on an idle segment with managed speed, what speed range is allowed, and what happens at each limit?",
a:`<p>±20 kt around the managed target (+5/−20 kt with a speed constraint), limited to VMAX − 5 kt.</p><ul><li>Lower limit: A/THR (Autothrust) adds thrust.</li><li>Upper limit: the aircraft leaves the path to hold the limit speed. Extend speedbrakes if the profile is diverging; the ND (Navigation Display) shows the intercept point with half speedbrake. MORE DRAG appears near a constraint.</li></ul>`,
src:"Safety First: Control your Speed — Descent, Approach and Landing"},
{id:"sf-desc-3",s:"sf",t:"desc",q:"In a decelerated approach, when should CONF 2 be selected before the FDP, and what is the good-practice cue on an ILS or FLS?",
a:`<p>When the final approach segment is intercepted below <b>2 000 ft AGL</b> (Above Ground Level) on the A320 family. Also consider it whenever the aircraft decelerates slowly, for example when heavy, at a high elevation airport or with a tailwind. On an ILS (Instrument Landing System), GLS or FLS (FMS Landing System) approach, select FLAPS 2 at about one dot below the glideslope.</p>`,
src:"Safety First: Control your Speed — Descent, Approach and Landing; FCOM PRO-NOR-SOP"},
{id:"sf-desc-4",s:"sf",t:"desc",q:"When must VAPP be at least VLS + 5 kt? Why enter the tower wind even when it is too light to change VAPP?",
a:`<p>VAPP ≥ VLS (Lowest Selectable Speed) + 5 kt for autoland, with A/THR (Autothrust) on, with ice accretion, or with a gusty crosswind above 20 kt.</p><p>GS mini (ground speed mini) uses the tower headwind entered on PERF APPR as its reference. A wrong or missing entry gives a wrong IAS target in the gusts near the ground.</p>`,
src:"Safety First: Control your Speed — Descent, Approach and Landing"},
{id:"sf-desc-5",s:"sf",t:"desc",q:"What does the energy circle show, and when is it displayed?",
a:`<p>It is shown in HDG or TRK lateral mode within 180 NM of destination. It is the minimum distance needed to descend in a straight line from the present position and speed to the airfield at approach speed. It accounts for speed limits, wind, a deceleration level-off and a 3° final segment. If the airfield is inside the circle, you have too much energy: use speedbrakes, extend the track, or adjust speed.</p>`,
src:"Safety First: Control your Speed — Descent, Approach and Landing"},
/* cruise */
{id:"sf-cruise-1",s:"sf",t:"cruise",q:"Explain the first and second regimes, and why Airbus says not to fly below green dot in cruise.",
a:`<p>Above GD (Green Dot) the aircraft is in the first regime and speed is stable: a disturbance corrects itself because drag rises with speed. Below GD it is in the second regime and speed is unstable: slowing down increases drag, which slows the aircraft further.</p><p>Below a further point, not shown on the PFD (Primary Flight Display), there is no thrust margin left, and the only recovery is to descend. Near REC MAX that point is close to GD.</p>`,
src:"Safety First: Control your Speed in Cruise"},
{id:"sf-cruise-2",s:"sf",t:"cruise",q:"What happens to the A320's speedbrake response at high Mach with the AP engaged, and what is the risk?",
a:`<p>Extension and retraction are about <b>twice as slow with the AP (Autopilot) engaged</b> as with it disengaged. If you use speedbrakes to prevent an overspeed, start retracting them early, or the speed can drop below GD (Green Dot). This matters most near REC MAX.</p>`,
src:"Safety First: Control your Speed in Cruise"},
{id:"sf-cruise-3",s:"sf",t:"cruise",q:"At what point does the OVERSPEED warning trigger, and what must follow?",
a:`<p>Above VMO + 4 kt or MMO + 0.006. It stays on until the speed is back below VMO/MMO. Apply OVERSPEED RECOVERY, and report every overspeed. The aircraft may have seen a high load factor, and only flight data analysis can decide whether a structural inspection is needed.</p>`,
src:"Safety First: Control your Speed in Cruise; FCOM PRO-ABN"},
{id:"sf-cruise-4",s:"sf",t:"cruise",q:"Why can Vα PROT and Vα MAX show different values on the two A320 PFDs, and what are they based on?",
a:`<p>They are not computed from weight. Each is a prediction from the current AOA (Angle of Attack) and calibrated airspeed: the speed the aircraft would have at α PROT or α MAX. On the A320 each PFD (Primary Flight Display) uses a different airspeed source, so the values can differ. Filtering adds a small lag, so in a dynamic manoeuvre the protection can engage before the IAS reaches the displayed Vα PROT.</p>`,
src:"Safety First: Control your Speed in Cruise"},
{id:"sf-cruise-5",s:"sf",t:"cruise",q:"What reduces REC MAX in flight, and name two situations that cause a continuous speed decay in cruise.",
a:`<p>REC MAX = the lowest of the service, aerodynamic and certified ceilings. It <b>falls as OAT (Outside Air Temperature) rises</b>, and the thrust margin shrinks as you approach it.</p><ul><li>A large, continuous increase in tailwind (or loss of headwind) with rising OAT.</li><li>A prolonged mountain-wave downdraft of more than 500 ft/min while flying downwind. REC MAX is unchanged, but the thrust margin is used up holding altitude.</li></ul>`,
src:"Safety First: Control your Speed in Cruise"},
/* altn */
{id:"sf-altn-1",s:"sf",t:"altn",q:"Which A320 family aircraft need the manual alternate brake check, and when is it done?",
a:`<p>Aircraft with <b>hydromechanical</b> alternate braking control: A320 family delivered before 2007, apart from those built 2005–2007 that already had electrical control. The check is done in the preliminary cockpit preparation, before the walkaround on the first flight of the day, and after a crew change.</p><p>Aircraft with electrically controlled alternate braking (ABCU, Alternate Braking Control Unit) are checked automatically, so the SOP does not require the manual test. An operator may still require it for commonality.</p>`,
src:"Safety First: Don't Forget to Check the Alternate"},
{id:"sf-altn-2",s:"sf",t:"altn",q:"Run through the alternate brake check and the pass criteria.",
a:`<ol><li>Accumulator pressure in the green band (if not, run the Yellow ELEC PUMP).</li><li>Yellow electric pump OFF.</li><li>Chocks in place.</li><li>PARK BRK OFF.</li><li>Press both pedals fully. Brake pressure must be <b>2 000 (or 2 200) to 2 700 psi on both sides</b> of the triple indicator, and the pedals must keep their artificial feel.</li><li>Release the pedals, then PARK BRK ON.</li></ol>`,
src:"Safety First: Don't Forget to Check the Alternate; FCOM PRO-NOR-SOP Preliminary Cockpit Preparation"},
{id:"sf-altn-3",s:"sf",t:"altn",q:"During the check the pedals feel spongy, or one side shows low pressure. What does it mean, and what do you do?",
a:`<p>Spongy pedals (loss of artificial feel) mean air in the alternate braking low-pressure control circuit. Low pressure means the pedal command is not reaching the dual valve properly. Either way, report it: maintenance action is required before the next flight. In the case study the check showed only 416 psi, the aircraft dispatched anyway, and when the normal brakes were lost later only the parking brake could stop it.</p>`,
src:"Safety First: Don't Forget to Check the Alternate"},
/* park */
{id:"sf-park-1",s:"sf",t:"park",q:"State the parking brake sequence on stand, and the step missed in the A319 airbridge event.",
a:`<p>Engines running, pedals pressed:</p><ol><li>Check ACCU pressure is in the green band.</li><li>PARK BRK ON.</li><li><b>Check left and right brake pressure</b> on the triple indicator.</li><li>Release the pedals and shut down the engines.</li></ol><p>The crew missed step 3. The PBSELV (Parking Brake Selector Valve) was opening slowly, so there was no pressure at the brakes when the pedals were released.</p>`,
src:"Safety First: Safe Aircraft Parking; FCOM PRO-NOR-SOP Parking"},
{id:"sf-park-2",s:"sf",t:"park",q:"Brake pressure is insufficient after setting the PARK BRK. What do you do?",
a:`<p>Keep the brake pedals pressed and ask the ground crew for chocks. Shut down the engines only once the chocks are confirmed in place, then make a tech log entry. If fitted, the PARK BRK FAULT ECAM alert detects a mismatch between the handle and the PBSELV (Parking Brake Selector Valve). It is standard from MSN (Manufacturer Serial Number) 4468.</p>`,
src:"Safety First: Safe Aircraft Parking"},
{id:"sf-park-3",s:"sf",t:"park",q:"The aircraft starts to roll with PARK BRK ON. On an A320, do you need to release the parking brake to use the pedals?",
a:`<p>No. On the A320 family, normal pedal braking has priority over the parking brake, so press the pedals directly. (On the A300 and A310 the handle must be set to OFF first.)</p>`,
src:"Safety First: Safe Aircraft Parking"},
{id:"sf-park-4",s:"sf",t:"park",q:"How long will a charged accumulator hold the parking brake? Why release the PARK BRK with hot brakes once chocked?",
a:`<p>About 12 hours. Pressure can also be lost through leaks or repeated applications without recharging; recharge with the Yellow ELEC PUMP.</p><p>With hot brakes, once the chocks are in, set the PARK BRK OFF. Holding pressure passes heat to the pistons, which degrades the seals and overheats the fluid. A black deposit can then form, reduce piston clearance and cause brake dragging.</p>`,
src:"Safety First: Safe Aircraft Parking"},
/* to */
{id:"sf-to-1",s:"sf",t:"to",q:"Put VMCG, VEF, V1 and VMBE in order and define VMCG and VMBE.",
a:`<p><b>VMCG ≤ VEF ≤ V1 ≤ VMBE.</b></p><ul><li>VMCG (Minimum Control speed on the Ground): the lowest speed at which the aircraft can be controlled with rudder alone after a sudden engine failure on the ground. It depends mainly on thrust and pressure altitude.</li><li>VMBE (Maximum Brake Energy speed): an RTO (Rejected Takeoff) at MTOW (Maximum Takeoff Weight) from this speed reaches the maximum energy the brakes can absorb.</li><li>V1 is about VEF (Engine Failure speed) + 1 s of recognition time.</li></ul>`,
src:"Safety First: Control your Speed at Takeoff"},
{id:"sf-to-2",s:"sf",t:"to",q:"What does VR guarantee, and what are the consequences of rotating early, late or too slowly?",
a:`<p>Rotation at VR at about 3°/s ensures V2 by 35 ft, even with an engine failure at VEF (Engine Failure speed). The limits are V1 ≤ VR, VR ≥ 1.05 VMCA (Minimum Control speed in the Air) and VR ≤ VLOF (liftoff speed).</p><ul><li><b>Early rotation:</b> tail strike.</li><li><b>Late or slow rotation:</b> the aircraft may not reach 35 ft by the end of the runway or clearway when the speeds are runway- or obstacle-limited.</li></ul>`,
src:"Safety First: Control your Speed at Takeoff"},
{id:"sf-to-3",s:"sf",t:"to",q:"What is the classic weight-entry error in takeoff speed computation, and how does it show up on the roll?",
a:`<p>The ZFW (Zero Fuel Weight) is used in place of the takeoff gross weight, typically after a late loadsheet change or under time pressure. The speeds come out far too low.</p><p>On the roll this shows up as a tail strike, a "heavy" aircraft at rotation, or a high-speed RTO (Rejected Takeoff). Defences: an independent PM cross-check, re-inserting speeds after any change, and a takeoff briefing that states speeds, configuration and weight.</p>`,
src:"Safety First: Control your Speed at Takeoff"},
{id:"sf-to-4",s:"sf",t:"to",q:"Name three changes that invalidate computed takeoff speeds, and the risk when they're made during taxi.",
a:`<p>A runway change, an intersection departure, and a wet runway becoming contaminated. Any change to the configuration the speeds were computed for invalidates them.</p><p>If speeds are recomputed during pushback or taxi, the PF's workload is high and the cross-check is weak. Re-insert the speeds per SOP, watch for keystroke errors, and re-brief.</p>`,
src:"Safety First: Control your Speed at Takeoff"},
{id:"sf-to-5",s:"sf",t:"to",q:"Engine failure just after liftoff: what pitch error is common, and why is flying below V2 dangerous?",
a:`<p>The common error is pitching above the FD (Flight Director) bars to climb faster, which takes the aircraft below V2. Drag then rises and climb performance cannot be maintained, and the only way to regain speed may be to descend. Close to VMCA (Minimum Control speed in the Air), lateral control can be lost. Follow SRS (Speed Reference System) and hold V2 to V2 + 15 kt.</p>`,
src:"Safety First: Control your Speed at Takeoff; FCTM PR-AEP-ENG"},
/* clb */
{id:"sf-clb-1",s:"sf",t:"clb",q:"Define F and S speeds in the takeoff phase, and when each is displayed.",
a:`<ul><li><b>F:</b> the minimum speed at which to retract from CONF 2 or 3 to CONF 1+F (about 1.18–1.26 × VS1G in CONF 1+F). Shown with the lever in 2 or 3 during takeoff, initial climb and go-around.</li><li><b>S:</b> the minimum slat retraction speed, i.e. the minimum speed at which to select CLEAN (about 1.21–1.25 × VS1G clean). Shown with the lever in 1.</li></ul><p>Both, like GD (Green Dot), are computed from the ZFW (Zero Fuel Weight) entered in the FMS.</p>`,
src:"Safety First: Control your Speed During Climb"},
{id:"sf-clb-2",s:"sf",t:"clb",q:"What happens if you retract well below F or S, or well above them?",
a:`<ul><li><b>Well below:</b> less margin to the high AOA (Angle of Attack) protection. The speed may fall below VLS (Lowest Selectable Speed) of the new configuration.</li><li><b>Well above:</b> reduced climb performance, which threatens obstacle clearance, especially with one engine inoperative.</li></ul><p>If flaps must stay extended for a turn before acceleration altitude, F or S is a safe speed for that turn.</p>`,
src:"Safety First: Control your Speed During Climb"},
{id:"sf-clb-3",s:"sf",t:"clb",q:"During flap retraction on an A320, the OVERSPEED aural sounds briefly although the speed is clear of the red-and-black strip. Why, and does it matter?",
a:`<p>The PFD (Primary Flight Display) VFE follows the <b>lever position</b> and steps as soon as the lever moves. The aural overspeed threshold follows the <b>actual surface position</b>. While the surfaces are still moving and the aircraft is accelerating, the speed can briefly exceed the real-surface VFE. Airbus states this has no operational or safety consequence and is as designed.</p>`,
src:"Safety First: Control your Speed During Climb"},
{id:"sf-clb-4",s:"sf",t:"clb",q:"After a heavy-weight takeoff, what flap-retraction advice does Airbus give, and why?",
a:`<p>Don't delay selecting flaps 0 beyond S speed. At high weight, S is close to VFE CONF 1+F (for example, an A320 at 76 t has S = 205 kt against flap auto-retraction at 210 kt). A late selection with rapid acceleration can trigger a brief VFE warning.</p>`,
src:"Safety First: Control your Speed During Climb"},
{id:"sf-clb-5",s:"sf",t:"clb",q:"Why avoid flying below green dot in the climb?",
a:`<p>GD (Green Dot) gives the best lift/drag ratio, and therefore the best climb gradient for a given thrust. Below GD drag increases. With climb thrust already set, the only way to recover is to reduce the climb rate or even descend, which defeats the purpose of the climb.</p>`,
src:"Safety First: Control your Speed During Climb"},
/* turb */
{id:"sf-turb-1",s:"sf",t:"turb",q:"State the Airbus thunderstorm avoidance rules of thumb.",
a:`<ul><li>Avoid laterally by 20 NM, preferably upwind (hail risk downwind).</li><li>Do not overfly with less than 5 000 ft separation. Going around is preferred, because turbulence extends above the visible top.</li><li>Do not overfly cells with tops above 25 000 ft.</li></ul><p>Severe turbulence can be met outside the cloud: the case-study aircraft was 4 NM from the cell boundary.</p>`,
src:"Safety First: Managing Severe Turbulence"},
{id:"sf-turb-2",s:"sf",t:"turb",q:"Severe turbulence ahead in cruise. What should you do with AP, A/THR and speed, and what level change should you consider?",
a:`<ul><li>Keep the AP (Autopilot) ON.</li><li>Keep A/THR (Autothrust) ON and fly the QRH turbulence speed VRA/MRA (rough-air speed/Mach). Managed speed is acceptable in light or moderate turbulence.</li><li>If thrust variations become excessive, disconnect A/THR and set the QRH thrust.</li><li>Consider descending to a lower level for more margin to buffet onset.</li><li>Secure the cockpit, lock the harnesses, and brief the cabin with the time available and the expected level and duration.</li></ul>`,
src:"Safety First: Managing Severe Turbulence; QRH"},
{id:"sf-turb-3",s:"sf",t:"turb",q:"The AP trips in severe turbulence. What is the manual flying technique, and what control must you not use?",
a:`<p>Use the fly-by-wire laws: with the stick neutral, the aircraft aims for 1 g and a constant roll attitude. Make only careful, considered corrections for significant deviations, and don't fight the turbulence, because continuous inputs make things worse. <b>Do not use rudder</b>; violent rudder inputs add destabilisation and structural load.</p><p>In the case study, the crew made no sidestick input at the 0 g event and re-engaged the AP.</p>`,
src:"Safety First: Managing Severe Turbulence; FCTM Adverse Weather — Turbulence"},
{id:"sf-turb-4",s:"sf",t:"turb",q:"In severe turbulence at VRA/MRA the speed briefly goes above VMO/MMO. What is the recommended response?",
a:`<p>Don't overreact. VRA/MRA (rough-air speed/Mach) already gives margin to the structural limits. Keep the AP (Autopilot) and A/THR (Autothrust) ON and accept a temporary excursion. Report any severe turbulence (and any OVERSPEED warning) in the tech log.</p>`,
src:"Safety First: Managing Severe Turbulence"},
{id:"sf-turb-5",s:"sf",t:"turb",q:"Which turbulence threat can the weather radar not detect, where is it found, and how do you anticipate it?",
a:`<p>CAT (Clear Air Turbulence). It contains no water droplets, so it gives no radar return. It is generally found above 15 000 ft at the boundary between air masses moving at different speeds. Anticipate it from forecasts, pilot reports, and turbulence-sharing platforms.</p>`,
src:"Safety First: Managing Severe Turbulence"},
/* gaclean */
{id:"sf-ga-1",s:"sf",t:"gaclean",q:"On the A320 family, what three conditions must be met for SRS and GA TRK to engage?",
a:`<ol><li>A thrust lever at TOGA (Takeoff/Go-Around).</li><li>Aircraft airborne, or on the ground for less than 30 s.</li><li><b>Slats or flaps extended.</b></li></ol><p>In CLEAN configuration the go-around modes do not engage, on current standards before the planned modification.</p>`,
src:"Safety First: Non-Engagement of the Go-Around Modes in CLEAN; FCOM DSC-22_30"},
{id:"sf-ga-2",s:"sf",t:"gaclean",q:"You set TOGA on final with the FLAPS lever at 0. What will the FMA and FMS show, and what is the threat?",
a:`<ul><li>The AP/FD (Autopilot/Flight Director) stays in the approach or landing modes (for example G/S and LOC).</li><li>The FMS stays in the APPR phase.</li><li>LVR CLB flashes.</li></ul><p>The threat: TOGA thrust with the aircraft still tracking the approach path means rapid acceleration close to the ground. In the case study the aircraft reached 312 kt at 600 ft with the main gear down. Recognise it on the FMA and act without delay.</p>`,
src:"Safety First: Non-Engagement of the Go-Around Modes in CLEAN; FCTM"},
{id:"sf-ga-3",s:"sf",t:"gaclean",q:"What configuration does the SOP require at the start of the final approach, and for a glideslope interception from above?",
a:`<ul><li>Decelerated approach: <b>at least CONF 1</b> at the start of the final approach.</li><li>Early stabilised approach: landing configuration at the FDP (Final Descent Point).</li><li>Glideslope interception from above: <b>at least CONF 2</b>, so the speed does not increase during the interception.</li></ul>`,
src:"Safety First: Non-Engagement of the Go-Around Modes in CLEAN; FCTM PR-NP-SOP Approach"},
{id:"sf-ga-4",s:"sf",t:"gaclean",q:"What modification has Airbus planned, and under what conditions will the go-around modes then engage in clean configuration?",
a:`<p>An update to the flight guidance logic for the A320 family, A330 and A380, matching the A350 with PRIM P12. At TOGA in clean configuration, SRS and GA TRK will engage <b>if the aircraft is below 2 500 ft AGL (Above Ground Level) and below the FCU (Flight Control Unit) selected altitude</b>. Check which FMGC (Flight Management and Guidance Computer) standard your fleet has before relying on it.</p>`,
src:"Safety First: Non-Engagement of the Go-Around Modes in CLEAN"}
);

/* ---------- questions for additional stops ---------- */
Q.push(
/* mel */
{id:"sf-mel-1",s:"sf",t:"mel",q:"What are the three safety-assessment steps behind each MMEL item, and their objectives?",
a:`<ol><li>The consequence of the failure on its own: no worse than <b>MINOR</b>.</li><li>The failure combined with the next critical failure: no worse than <b>MAJOR</b>.</li><li>A quantitative analysis of every HAZARDOUS or CATASTROPHIC failure case involving the item. This can limit the dispatch time.</li></ol><p>Limitations or (o)/(m) procedures may be added to meet each objective. The result is a GO, GO IF or NO GO status. The operator's MEL (Minimum Equipment List) can never be less restrictive than the MMEL (Master Minimum Equipment List).</p>`,
src:"Safety First: A Recall on the Correct Use of the MEL"},
{id:"sf-mel-2",s:"sf",t:"mel",q:"When does the MEL stop applying, and what governs a failure that appears during taxi under EASA rules?",
a:`<p>The MEL (Minimum Equipment List) applies up to the <b>commencement of the flight</b>: the moment the aircraft first moves under its own power for takeoff (start of taxi). It does not apply in flight.</p><p>For a failure between the start of taxi and the start of the takeoff roll, EASA requires operator guidance. The Captain may continue on good judgement and airmanship, may consult the MEL, and may talk to maintenance control. The decision is the Captain's.</p>`,
src:"Safety First: A Recall on the Correct Use of the MEL"},
{id:"sf-mel-3",s:"sf",t:"mel",q:"Who proposes and who accepts a dispatch under an MEL item, and what must be checked on each later sector?",
a:`<p>Maintenance proposes dispatch once all the conditions are met. <b>The Captain accepts it</b>, also considering operator policy and operational constraints.</p><p>On each later sector, check every open item is still within its repair interval for the whole coming flight, and apply all (o) operational procedures. When a new item is added, recheck all existing items for incompatible conditions.</p>`,
src:"Safety First: A Recall on the Correct Use of the MEL"},
{id:"sf-mel-4",s:"sf",t:"mel",q:"A defect appears in cruise. Does the MEL apply, and what should you record?",
a:`<p>No, the MEL (Minimum Equipment List) is a dispatch document and does not apply in flight. It may help you anticipate the next dispatch. Make a detailed tech log entry (ECAM title, time, SD (System Display) page indication, flight phase) and tell dispatch or maintenance control so they can prepare.</p>`,
src:"Safety First: A Recall on the Correct Use of the MEL"},
/* wb */
{id:"sf-wb-1",s:"sf",t:"wb",q:"Give three consequences of a CG forward of the limit.",
a:`<ul><li><b>Manoeuvrability:</b> elevator and THS (Trimmable Horizontal Stabiliser) authority can run out, making the correct rotation rate impossible. It is worst at low speed.</li><li><b>Performance:</b> takeoff and landing performance is computed at the most forward CG (Centre of Gravity) in the envelope, so a CG further forward gives worse performance than computed.</li><li><b>Structure:</b> at high weight, the nose gear can be overloaded.</li></ul>`,
src:"Safety First: Understanding Weight and Balance"},
{id:"sf-wb-2",s:"sf",t:"wb",q:"Give three consequences of a CG aft of the limit.",
a:`<ul><li><b>Takeoff:</b> a light nose gives poor nosewheel steering early in the roll, especially when wet. The aircraft over-rotates easily or self-rotates, giving a tail strike.</li><li><b>Go-around:</b> the TOGA (Takeoff/Go-Around) pitch-up may not be controllable, and alpha floor may trigger.</li><li><b>Structure:</b> at high weight, the main gear and wing can be overloaded.</li></ul>`,
src:"Safety First: Understanding Weight and Balance"},
{id:"sf-wb-3",s:"sf",t:"wb",q:"How big is the A320's whole CG range in metres, and how far does a 150 kg trolley rolled from the back to the front move the CG?",
a:`<p>The range is about <b>1.34 m</b>, roughly 4% of the 37.57 m length. The trolley moves the CG (Centre of Gravity) by <b>more than 5 cm</b>.</p>`,
src:"Safety First: Understanding Weight and Balance"},
{id:"sf-wb-4",s:"sf",t:"wb",q:"In the single-aisle tail strike, what made the CG out of limits on the second sector, and what is the lesson for a multi-sector day?",
a:`<p>Passengers and bags for the first destination came off. The through passengers were all seated aft and their bags were in the aft hold. The loadsheet had been prepared for the first sector only, so on the second sector the CG (Centre of Gravity) was aft of the limit.</p><p>Lesson: every sector needs a loadsheet that reflects the actual load distribution. Free seating with a cabin under 80% full can put the actual CG 2–3% from the calculated value.</p>`,
src:"Safety First: Understanding Weight and Balance"},
/* tos */
{id:"sf-tos-1",s:"sf",t:"tos",q:"Which TOS1 checks can produce a scratchpad message during cockpit preparation?",
a:`<ul><li><b>ENTRY OUT OF RANGE:</b> ZFW (Zero Fuel Weight) outside the valid range.</li><li><b>TO SPEED TOO LOW:</b> speeds don't meet the margins to VMCG, VMCA or VS1G.</li><li><b>V1/VR/V2 DISAGREE:</b> V1 ≤ VR ≤ V2 not respected.</li><li><b>CHECK TAKE OFF DATA:</b> the runway was changed, so the speeds are invalidated and must be re-entered or confirmed.</li></ul>`,
src:"Safety First: Takeoff Surveillance and Monitoring Functions"},
{id:"sf-tos-2",s:"sf",t:"tos",q:"What does pressing T.O CONFIG check with TOS1 and TOS2 fitted?",
a:`<ul><li>Flaps against the PERF page: F/CTL FLAP/MCDU DISAGREE.</li><li>Trim on the PERF page against actual THS (Trimmable Horizontal Stabiliser) setting and CG-computed trim: F/CTL PITCH TRIM/MCDU/CG DISAGREE.</li><li>Takeoff speeds: T.O SPEEDS TOO LOW, V1/VR/V2 DISAGREE, or NOT INSERTED.</li><li>Lift-off distance against runway available: T.O RWY TOO SHORT (TOS2).</li></ul>`,
src:"Safety First: Takeoff Surveillance and Monitoring Functions"},
{id:"sf-tos-3",s:"sf",t:"tos",q:"Which TOS2 alerts can trigger at takeoff thrust application, and what does Airbus recommend?",
a:`<ul><li><b>NAV ON TAXIWAY</b> (red, or amber on some FWS (Flight Warning System) standards).</li><li><b>NAV NOT ON FMS RUNWAY</b>.</li><li><b>T.O RWY TOO SHORT</b>, based on the actual position, so it catches a wrong intersection or a short runway.</li></ul><p>Airbus recommends <b>rejecting the takeoff</b> for any of them.</p>`,
src:"Safety First: Takeoff Surveillance and Monitoring Functions"},
{id:"sf-tos-4",s:"sf",t:"tos",q:"Why must you insert T.O SHIFT for an intersection departure, and when would you deselect TOS2 with the T.O SURV pushbutton?",
a:`<p>T.O SHIFT tells the FMS (Flight Management System) where the takeoff starts, so the lift-off distance check uses the runway actually remaining.</p><p>Use T.O SURV to switch TOS2 off when the navigation database is out of date for that airport, or a NOTAM (Notice to Air Missions) has changed the runway length. Otherwise you can get spurious alerts, or none when one is needed. TOS is a safety net, not a substitute for the SOP cross-checks.</p>`,
src:"Safety First: Takeoff Surveillance and Monitoring Functions"},
/* thr */
{id:"sf-thr-1",s:"sf",t:"thr",q:"Why is takeoff thrust set in two steps?",
a:`<p>Engine acceleration is non-linear and differs between engines (tolerances, wear, idle differences). Going straight from idle to takeoff thrust can give a large asymmetry at a speed where the rudder has little authority.</p><p>Stabilising both engines at the FCOM value first (for example 1.05 EPR (Engine Pressure Ratio) on IAE, or the N1 value for your engine) means they then accelerate almost identically. This is especially important after using differential thrust to line up.</p>`,
src:"Safety First: Engine Thrust Management — Thrust Setting at Takeoff"},
{id:"sf-thr-2",s:"sf",t:"thr",q:"What is different about thrust setting with a tailwind or significant crosswind, and what extra sidestick input applies?",
a:`<p>After the stabilisation step, increase thrust <b>progressively</b> to takeoff thrust as the aircraft accelerates. The ram air reduces inlet distortion and so the risk of an engine stall and the asymmetry it causes.</p><p>Hold <b>full</b> forward stick (instead of half) up to 80 kt, then release it to neutral by 100 kt, to load the nosewheel.</p>`,
src:"Safety First: Engine Thrust Management — Thrust Setting at Takeoff; FCOM PRO-NOR-SOP Takeoff"},
{id:"sf-thr-3",s:"sf",t:"thr",q:"Asymmetric thrust at low speed makes the aircraft veer and you can't hold the centreline. What is the technique?",
a:`<p>Reject using the FCTM low-speed engine failure technique:</p><ul><li>All thrust levers to IDLE immediately.</li><li>Select all reversers.</li><li>Use the rudder pedals for directional control, plus symmetric or differential braking as needed.</li></ul><p>In the case study, repeated alternating corrections (thrust, rudder, tiller) made the veer worse, and the aircraft left the runway at under 31 kt.</p>`,
src:"Safety First: Engine Thrust Management — Thrust Setting at Takeoff; FCTM PR-AEP-ENG"},
{id:"sf-thr-4",s:"sf",t:"thr",q:"What is the PM's thrust-monitoring role on the roll, and why does seat and pedal adjustment matter?",
a:`<p>The PM monitors N1/EPR (Engine Pressure Ratio) below 80 kt, calls "THRUST SET" when takeoff thrust is reached, and announces any asymmetry immediately. The PM may call a reject if needed.</p><p>At low speed only nosewheel steering and differential braking keep you straight. You must be able to reach full rudder and maximum braking at the same time. Pedals set too far away can even give opposite differential braking.</p>`,
src:"Safety First: Engine Thrust Management — Thrust Setting at Takeoff"},
/* rot */
{id:"sf-rot-1",s:"sf",t:"rot",q:"What rotation rate is required, where does it come from, and what does a 2°/s rotation cost?",
a:`<p><b>3°/s</b>. It is the average rate flown in the certification takeoff tests, so takeoff performance assumes it. A <b>2°/s</b> rotation adds about <b>300 m (1 000 ft)</b> to the takeoff distance. In the A340 case study a 1°/s rotation meant crossing the runway end at 6 ft.</p>`,
src:"Safety First: A Focus on the Takeoff Rotation"},
{id:"sf-rot-2",s:"sf",t:"rot",q:"Why is a correct rotation rate especially critical on a twin after an engine failure?",
a:`<p>Dry takeoff distance = the greater of the one-engine-inoperative distance and 1.15 × the all-engine distance. On a twin, losing half the thrust usually makes the engine-out case the limiting one, so there is <b>no extra margin</b> in that case. A slow rotation directly eats into the runway and obstacle clearance.</p>`,
src:"Safety First: A Focus on the Takeoff Rotation"},
{id:"sf-rot-3",s:"sf",t:"rot",q:"How does the takeoff rotation law differ between the A320ceo and the A320neo?",
a:`<ul><li><b>A320ceo:</b> direct law. The rate for a given stick input varies with weight, CG (Centre of Gravity), flaps and thrust. A pitch-rate limiter reduces excessive rates but is <b>not</b> tail-strike protection.</li><li><b>A320neo:</b> a pitch-rate target law gives a repeatable rotation rate for a given deflection in all conditions, plus tail-strike protection. That protection can be overridden beyond about ¾ back stick.</li></ul>`,
src:"Safety First: A Focus on the Takeoff Rotation"},
{id:"sf-rot-4",s:"sf",t:"rot",q:"Describe the rotation technique and the initial pitch targets on the A320.",
a:`<ol><li>At VR, make a positive back-stick input.</li><li>Use outside visual references to reach and hold about 3°/s. Liftoff typically comes 4–5 s later, at about 10° pitch.</li><li>Once airborne, aim for <b>15°</b>, or <b>12.5° with one engine out</b>.</li><li>Then follow the FD (Flight Director).</li></ol><p>The tail-strike pitch limit indication is shown on landing only; it was removed for takeoff because it led pilots to slow their rotation.</p>`,
src:"Safety First: A Focus on the Takeoff Rotation; FCOM PRO-NOR-SOP Takeoff"},
/* uas */
{id:"sf-uas-1",s:"sf",t:"uas",q:"What was the main cause of unreliable airspeed at takeoff in the 2020–21 data, and does a short transit protect you?",
a:`<p>Pitot obstruction: 44 of 55 events (insects, sand, dust, leaves, and in one case covers left on). No: half the contaminations happened after less than 48 h on the ground, and a significant number during transits under 2 h, when covers are often not fitted.</p>`,
src:"Safety First: Unreliable Airspeed at Takeoff"},
{id:"sf-uas-2",s:"sf",t:"uas",q:"State the PFD airspeed display logic at low speed. What did it show the A330 crew with covers fitted?",
a:`<ul><li>Measured airspeed below 30 kt and ground speed below 50 kt: IAS (Indicated Airspeed) at the bottom of the scale.</li><li>Measured airspeed below 30 kt and ground speed above 50 kt: <b>red SPD flag</b>.</li><li>Above 30 kt: IAS displayed.</li></ul><p>The A330 crew had red SPD flags on both PFDs (Primary Flight Displays) from 50 kt ground speed, but made the 100 kt call from ground speed and took off.</p>`,
src:"Safety First: Unreliable Airspeed at Takeoff"},
{id:"sf-uas-3",s:"sf",t:"uas",q:"In the A320 case with leaves in the Captain's pitot, what two earlier chances to spot the problem were missed before the 100 kt check?",
a:`<ol><li>Before line-up, the Captain's PFD (Primary Flight Display) showed about 45 kt with the aircraft stationary.</li><li>At thrust set, the Captain's IAS (Indicated Airspeed) was 49 kt with almost no speed trend arrow, while the F/O's side accelerated normally.</li></ol><p>The crew did reject correctly at the 100 kt cross-check, where the Captain's side showed 58 kt.</p>`,
src:"Safety First: Unreliable Airspeed at Takeoff"},
{id:"sf-uas-4",s:"sf",t:"uas",q:"What is the PM's airspeed monitoring task on the takeoff roll, and what is the status of the 100 kt cross-check?",
a:`<p>From brake release, the PM watches for disagreement between the PFDs (Primary Flight Displays) and the ISIS (Integrated Standby Instrument System), an abnormal or missing trend arrow, a flag, or no speed at all, and alerts the PF immediately.</p><p>The 100 kt cross-check is the <b>last line of defence</b>. Be ready to reject there, and earlier if the discrepancy is seen earlier, so the reject happens at a lower speed.</p>`,
src:"Safety First: Unreliable Airspeed at Takeoff"},
/* ws */
{id:"sf-ws-1",s:"sf",t:"ws",q:"Describe the three phases of a microburst encounter on approach, and the natural pilot reaction that makes the second worse.",
a:`<ol><li><b>Headwind:</b> speed rises and the aircraft balloons above the path. The natural reaction is to reduce thrust and push, which leaves you low on energy.</li><li><b>Downdraft:</b> the aircraft sinks and AOA (Angle of Attack) rises. Downdrafts can reach about 4 000 ft/min.</li><li><b>Tailwind:</b> lift and airspeed fall sharply and the aircraft goes below the path.</li></ol>`,
src:"Safety First: Windshear — An Invisible Enemy"},
{id:"sf-ws-2",s:"sf",t:"ws",q:"What altitude band does the predictive windshear system cover, and what alerts does it give?",
a:`<p>About <b>50 to 1 000 ft</b>. It gives roughly a minute's warning. First an amber <b>W/S AHEAD</b> caution on the PFD (Primary Flight Display). It becomes a red warning with "WINDSHEAR AHEAD, WINDSHEAR AHEAD" on takeoff, or "GO AROUND, WINDSHEAR AHEAD" on approach. If windshear is predicted, delay the takeoff or approach.</p>`,
src:"Safety First: Windshear — An Invisible Enemy; FCOM PRO-ABN-80"},
{id:"sf-ws-3",s:"sf",t:"ws",q:"Reactive WINDSHEAR warning on approach: give the recovery technique.",
a:`<ul><li>TOGA (Takeoff/Go-Around) thrust.</li><li>Follow SRS (Speed Reference System). Keep the AP (Autopilot) if engaged, but don't engage it.</li><li>Wings level unless a turn is needed for terrain.</li><li>Full back stick if needed; the fly-by-wire protections stop a stall.</li><li><b>Do not change slats, flaps or gear</b> until out of the shear.</li><li>Monitor speed, speed trend and the flight path, then clean up once clear.</li></ul><p>Alpha floor gives TOGA LK even if you are already at TOGA. Disconnect A/THR (Autothrust) once out of alpha floor.</p>`,
src:"Safety First: Windshear — An Invisible Enemy; FCOM PRO-ABN-80"},
{id:"sf-ws-4",s:"sf",t:"ws",q:"Windshear is suspected on arrival. What approach preparation does Airbus recommend?",
a:`<ul><li>Delay the approach or divert if an LLWAS (Low Level Windshear Alert System) alert or pilot reports indicate windshear.</li><li>Choose the best runway and approach path.</li><li>Consider <b>less than full flap</b> to improve the climb gradient.</li><li>Use the AP on an ILS, and add a gust increment (VAPP up to VLS + 15 kt).</li><li>Use managed speed so GS mini (ground speed mini) protects energy.</li><li>Be go-around minded and ready to respond at once to W/S AHEAD.</li></ul>`,
src:"Safety First: Windshear — An Invisible Enemy"},
/* tcas */
{id:"sf-tcas-1",s:"sf",t:"tcas",q:"Why do 'level off' RAs happen, and what does TCAP do about them?",
a:`<p>TCAS (Traffic Collision Avoidance System) predicts from the current vertical rate and doesn't anticipate your level-off. Approaching a cleared level at a high V/S (Vertical Speed) next to traffic on the adjacent level triggers an RA (Resolution Advisory). These made up 65% of RAs in the Eurocontrol study.</p><p>TCAP (TCAS Alert Prevention) starts the ALT* capture earlier with a lower V/S when a TA (Traffic Advisory) occurs, so the RA never triggers. Without TCAP, ICAO advises reducing V/S manually near the level.</p>`,
src:"Safety First: Safe Handling of TCAS Alerts"},
{id:"sf-tcas-2",s:"sf",t:"tcas",q:"What are the TA callouts with and without AP/FD TCAS, and what does the TCAS mode target in an RA?",
a:`<ul><li>TCAS not shown on the FMA: <b>"TCAS, I have control"</b>, and prepare for the standard procedure.</li><li>TCAS armed (blue) on the FMA: <b>"TCAS blue"</b>, and check A/THR (Autothrust) is on.</li></ul><p>In an RA, the TCAS mode targets a V/S (Vertical Speed) <b>200 ft/min inside the green band</b>. When clear of conflict it reverts to V/S ±1000 towards the FCU altitude.</p>`,
src:"Safety First: Safe Handling of TCAS Alerts; FCOM/QRH [MEM] SURV TCAS WARNING"},
{id:"sf-tcas-3",s:"sf",t:"tcas",q:"RA without AP/FD TCAS, or the TCAS mode doesn't engage: what are the actions?",
a:`<p>AP (Autopilot) OFF and <b>both FDs (Flight Directors) OFF</b>. Fly the V/S (Vertical Speed) into the green band on the PFD (Primary Flight Display) with smooth, firm inputs, and never against the RA. When clear of conflict, return to the clearance and re-engage the AP and FDs.</p>`,
src:"Safety First: Safe Handling of TCAS Alerts"},
{id:"sf-tcas-4",s:"sf",t:"tcas",q:"A CLIMB RA occurs on final approach. What does the current procedure require, and how can you tell whether the aircraft has AP/FD TCAS?",
a:`<p>Any "CLIMB" RA (Resolution Advisory) during final approach means <b>GO AROUND</b>. This was standardised in 2022.</p><p>Check the <b>Aircraft Configuration Summary</b> in the QRH (Quick Reference Handbook). In flight, the TCAS mode appears armed on the FMA when a TA (Traffic Advisory) occurs.</p>`,
src:"Safety First: Safe Handling of TCAS Alerts"},
/* radar */
{id:"sf-radar-1",s:"sf",t:"radar",q:"Why can a weak radar echo still be dangerous? What is attenuation?",
a:`<p>The radar sees liquid water. Ice reflects about 5× less, and a CB's (cumulonimbus's) upper part is mostly ice, so a dangerous cell can look weak, especially in dry tropical overland convection.</p><p><b>Attenuation:</b> heavy rain absorbs the beam. A thin band may be the front edge of a large cell, and weather behind it is hidden until you are around it.</p>`,
src:"Safety First: Optimum Use of Weather Radar"},
{id:"sf-radar-2",s:"sf",t:"radar",q:"What is overscanning, and how do you avoid it?",
a:`<p>At altitude the beam can pass over the reflective lower core of a cell and only see its weakly reflective ice top, so the threat is underestimated. Tilt down below the freezing level to find the red core, then scan up vertically. Yellow or green above a red cell suggests severe turbulence. Even with auto-tilt, switch to MAN regularly to check vertical structure.</p>`,
src:"Safety First: Optimum Use of Weather Radar"},
{id:"sf-radar-3",s:"sf",t:"radar",q:"At low level the display is mostly red. How do you use gain to find the real cores?",
a:`<p>Reduce the gain slowly from CAL. Red turns yellow, yellow turns green and green disappears. The areas that stay red longest are the most active cores, and those are what you avoid. At high altitude, increase the gain instead, because ice is less reflective.</p>`,
src:"Safety First: Optimum Use of Weather Radar"},
{id:"sf-radar-4",s:"sf",t:"radar",q:"State the deviation timing and the lateral and vertical avoidance margins, and how PF and PM should split the ND ranges.",
a:`<ul><li>Decide <b>at least 40 NM</b> before the cell. Lateral avoidance is preferred, on the upwind side.</li><li>Clear the threat area by <b>20 NM</b>. Between cells, keep <b>40 NM</b>.</li><li>Never fly under a CB (cumulonimbus). If overflying, keep at least <b>5 000 ft</b> above it.</li><li><b>PM:</b> long range for strategy (about 160 NM in cruise). <b>PF:</b> short range for tactics (80 NM or less). Using both avoids the "blind alley".</li></ul>`,
src:"Safety First: Optimum Use of Weather Radar"},
/* gnss */
{id:"sf-gnss-1",s:"sf",t:"gnss",q:"What is the difference between GNSS jamming and spoofing in their effect on A320 position computation?",
a:`<ul><li><b>Jamming</b> (signal lost): the FMS (Flight Management System) reverts to IRS-DME/DME, then IRS-VOR/DME, then IRS only. There is <b>no map shift</b>, but PBN (Performance-Based Navigation) capability may be lost.</li><li><b>Spoofing</b> (false signal): may <b>not be detected</b>. It gives an erroneous position, an unexpected turn in NAV with the AP (Autopilot) engaged, a map shift on the ND (Navigation Display), and abnormal IR drift on POSITION MONITOR.</li></ul>`,
src:"Safety First: GNSS Interference"},
{id:"sf-gnss-2",s:"sf",t:"gnss",q:"Which surveillance functions can GNSS interference make unavailable or spurious?",
a:`<p><b>Jamming</b> can make these unavailable; <b>spoofing</b> can make them give spurious alerts:</p><ul><li>Predictive TAWS (Terrain Awareness and Warning System).</li><li>ROPS (Runway Overrun Prevention System).</li><li>ALTSM (Altimeter Setting Monitoring).</li><li>TOS2 (Takeoff Surveillance).</li><li>ADS-B out (lost when jammed, false position reports when spoofed).</li></ul><p>With Honeywell EGPWS, some false-altitude cases cause the radio altimeter to be rejected, losing <b>reactive</b> TAWS. A weather radar that uses GNSS data can wrongly filter weather out as ground returns.</p>`,
src:"Safety First: GNSS Interference"},
{id:"sf-gnss-3",s:"sf",t:"gnss",q:"What ground risk does spoofing create before departure, and what should follow a flight through an interference area?",
a:`<p>On the ground, the IRS (Inertial Reference System) can <b>auto-align to an erroneous GNSS position</b>, so the aircraft departs with a wrong inertial position.</p><p>Apply the FCOM PRO-NOR-SUP GPS interference procedure before, inside and after the area. Report the event, and have maintenance run TSM (Trouble Shooting Manual) 34-36-00-810-956-A to clear persistent effects and confirm the cause.</p>`,
src:"Safety First: GNSS Interference; FCOM PRO-NOR-SUP GPS Interference"},
/* fleak */
{id:"sf-fleak-1",s:"sf",t:"fleak",q:"What two cruise checks detect a fuel leak, and how often are they done?",
a:`<p>At each waypoint, or at least every 30 minutes:</p><ol><li>(FOB (Fuel On Board) + FU (Fuel Used)) − block fuel. A significant or growing shortfall is a warning sign.</li><li>FOB against the FMS (Flight Management System) predictions and the flight plan's estimated FOB at each waypoint.</li></ol><p>Your own checks should catch a leak before FUEL F.USED/FOB DISAGREE does.</p>`,
src:"Safety First: Fuel Leak Management in Flight"},
{id:"sf-fleak-2",s:"sf",t:"fleak",q:"What does ENG FUEL LEAK on the A320neo detect that FUEL F.USED/FOB DISAGREE may not?",
a:`<p>ENG FUEL LEAK compares fuel flow or fuel used between the engines, so it detects leaks <b>downstream of the fuel metering valve</b>. FUEL F.USED/FOB DISAGREE compares (FOB + FU) with block fuel and covers leaks upstream of it. After an ENG FUEL LEAK alert, confirm with FOB, FU, FF (Fuel Flow), imbalance and N1. If confirmed, shut the engine down.</p>`,
src:"Safety First: Fuel Leak Management in Flight"},
{id:"sf-fleak-3",s:"sf",t:"fleak",q:"Outline the A320 FUEL LEAK procedure logic.",
a:`<ol><li>Leak confirmed: consider landing at the nearest suitable airport.</li><li><b>Obvious engine or pylon leak</b> (spray, low N1, high FF (Fuel Flow)): shut down that engine and <b>do not restart it</b>.</li><li>Otherwise, stop transfers and isolate the tanks, then compare depletion rates.</li><li><b>One side depleting faster:</b> shut down that engine. If the leak stops, it was the engine. If it continues, it's a wing leak: a restart may be considered, but <b>don't balance the tanks</b>.</li><li><b>No asymmetry:</b> suspect the centre tank or APU (Auxiliary Power Unit) feed. If there is a fuel smell, switch the APU off.</li></ol>`,
src:"Safety First: Fuel Leak Management in Flight; QRH FUEL LEAK"},
{id:"sf-fleak-4",s:"sf",t:"fleak",q:"Why must reversers not be used after a fuel leak, and what was the critical error in the A330 case?",
a:`<p>Reversers would blow leaking fuel towards the engine intakes and hot brakes, giving a fire risk and reduced braking performance.</p><p>In the A330 case the crew identified the leak side but <b>didn't shut down the engine</b> as the procedure required. The engine fed a leak of about 2 t/h onto hot parts until after landing, and 5.7 t was lost. With the tanks left isolated, the CG (Centre of Gravity) also drifted towards the aft limit.</p>`,
src:"Safety First: Fuel Leak Management in Flight"},
/* baro */
{id:"sf-baro-1",s:"sf",t:"baro",q:"How much altitude error does 1 hPa of QNH error cause, and which approach guidance modes are affected?",
a:`<p>About <b>28 ft per hPa</b>.</p><ul><li><b>Affected:</b> every mode that uses baro altitude. FINAL APP and FLS (FMS Landing System) fly a parallel, shifted path while V/DEV or the FLS deviation still look centred. With selected FPA (Flight Path Angle) the descent starts from the wrong height.</li><li><b>Not affected:</b> ILS, GLS and SLS glideslopes (G/S mode).</li></ul>`,
src:"Safety First: Use the Correct BARO Setting for Approach"},
{id:"sf-baro-2",s:"sf",t:"baro",q:"Why didn't the A320 crew's altitude/distance checks or the TAWS catch the 280 ft error?",
a:`<p>Altitude/distance checks use the same wrong altimeter, so they "agree". The path was parallel and close to the published one, so it stayed outside the EGPWS TCF (Terrain Clearance Floor) envelope (or T2CAS PDA (Premature Descent Alert)). There was no TAWS (Terrain Awareness and Warning System) alert. ATC's MSAW (Minimum Safe Altitude Warning) was the only alarm, and the aircraft reached 6 ft RA (Radio Altitude) in the go-around.</p>`,
src:"Safety First: Use the Correct BARO Setting for Approach"},
{id:"sf-baro-3",s:"sf",t:"baro",q:"What are the two opportunities to catch a wrong QNH, and what does ALTSM do?",
a:`<ol><li><b>Descent:</b> compare the first ATC QNH with the ATIS used for the briefing. If they differ significantly, confirm from all sources.</li><li><b>Final:</b> RA (Radio Altitude) callouts arriving earlier than expected while the baro altitude still reads high above the airfield. This depends on the terrain.</li></ol><p><b>ALTSM</b> (Altimeter Setting Monitoring) compares the Captain's baro altitude with GPS altitude and calls "ALTIMETER SETTING". It is fitted on some EGPWS standards. Note that GNSS spoofing can make it give spurious alerts.</p>`,
src:"Safety First: Use the Correct BARO Setting for Approach"},
/* xls */
{id:"sf-xls-1",s:"sf",t:"xls",q:"How does FLS build its beam and compute deviations, and what three things must be right for them to be correct?",
a:`<p>The MMR (Multi-Mode Receiver) builds a virtual beam from the anchor point (usually the threshold), course and slope stored in the FMS navigation database. Lateral deviation comes from the FMS position. <b>Vertical deviation comes from baro altitude.</b></p><p>The three things that must be right:</p><ol><li>The correct QNH or QFE.</li><li>The correct temperature on PERF APPR (for cold compensation).</li><li>Good position accuracy.</li></ol><p>Double diamonds on the PFD (Primary Flight Display) are the reminder that this is not a precision approach.</p>`,
src:"Safety First: Let's Use xLS; FCOM PRO-NOR-SOP Approach using F-LOC F-G/S"},
{id:"sf-xls-2",s:"sf",t:"xls",q:"Give three advantages of FLS over FINAL APP for a straight-in approach.",
a:`<ul><li>An ILS-like interface and procedure.</li><li>Beam capture is independent of flight plan sequencing, so it copes with vectoring. FINAL APP needs a narrow engagement window and correct sequencing.</li><li>Usable <b>below the published minimum temperature</b> for LNAV/VNAV, because FLS compensates the slope for cold. FINAL APP doesn't.</li><li>Managed vertical guidance (F-G/S + LOC) on LOC-only or ILS with the G/S out, instead of selected FPA (Flight Path Angle).</li></ul>`,
src:"Safety First: Let's Use xLS"},
{id:"sf-xls-3",s:"sf",t:"xls",q:"Which xLS function and FMA modes do you get for: an RNP to LNAV/VNAV minima, an RNP to LPV minima, a LOC-only approach, and a GLS?",
a:`<ul><li>RNP LNAV/VNAV: FLS, <b>F-G/S | F-LOC</b>.</li><li>RNP LPV: SLS (SBAS Landing System), <b>G/S | LOC</b>. FLS is the backup to LNAV/VNAV minima.</li><li>LOC-only: <b>F-G/S | LOC</b>.</li><li>GLS (GBAS Landing System): <b>G/S | LOC</b>.</li></ul><p>FINAL APP remains for curved approaches. Check which functions your aircraft has in the Aircraft Configuration Summary.</p>`,
src:"Safety First: Let's Use xLS"},
/* gs */
{id:"sf-gs-1",s:"sf",t:"gs",q:"Where are the secondary glideslopes for a 3° ILS, and what is special about an 'inverted' one?",
a:`<p>At about <b>9°, 15° and 21°</b>, every 6° above the main glideslope. The boundaries between them are around 6°, 12° and 18°. On some antennas, alternate secondary glideslopes (9°, 21°…) are <b>inverted</b>: the deviation shows you above when you are below. You cannot tell which type an airport has. At a boundary, a deviation jump or false zero can trigger G/S* if APPR is armed.</p>`,
src:"Safety First: Lining Up with the Correct Glide Slope"},
{id:"sf-gs-2",s:"sf",t:"gs",q:"Intercepting the glideslope from above: what quick check and technique prevent a false capture?",
a:`<p>Before pressing APPR, check you're below the 6° boundary: <b>height (ft AAL (Above Aerodrome Level)) &lt; 6 × distance (NM) × 100</b>.</p><p>Technique, once established on the localiser: press APPR, set the <b>FCU altitude above the aircraft altitude</b>, then descend in <b>V/S</b> (Vertical Speed). Not OP DES. The FCU altitude above the aircraft stops an ALT* level-off that could drift you into the inverted 9° glideslope.</p>`,
src:"Safety First: Lining Up with the Correct Glide Slope; FCOM Glide Interception from Above"},
{id:"sf-gs-3",s:"sf",t:"gs",q:"ATC stops your descent during a glideslope interception from above. What must you do with the approach mode, and why?",
a:`<p>After "CANCEL APPROACH", <b>press APPR to disarm G/S</b>, per the discontinued approach SOP. If G/S stays armed while level, the aircraft can drift up into the inverted 9° secondary glideslope. G/S* would then engage and the AP (Autopilot) would pitch up.</p>`,
src:"Safety First: Lining Up with the Correct Glide Slope"},
{id:"sf-gs-4",s:"sf",t:"gs",q:"What protection against secondary glideslope capture does the A320neo have that the A320ceo did not at the time of the article?",
a:`<p>A flight path angle limit of between 0° and −6° in both G/S* and G/S modes. This prevents an excessive pitch command if a secondary glideslope is captured. In case 1, the AP (Autopilot) pitched to the −13° disconnect limit.</p>`,
src:"Safety First: Lining Up with the Correct Glide Slope"},
/* unstab */
{id:"sf-unstab-1",s:"sf",t:"unstab",q:"When does Airbus recommend an early stabilised approach rather than a decelerated approach, and how do you set it up?",
a:`<p>With selected guidance (TRK/FPA or LOC/FPA), a steep glidepath, or a low intermediate segment with a close-in FDP (Final Descent Point). Enter <b>VAPP as a speed constraint at the FDP</b> so the FMS computes the deceleration. The decelerated approach is the standard with xLS or FINAL APP.</p>`,
src:"Safety First: Prevention of Unstable Approaches"},
{id:"sf-unstab-2",s:"sf",t:"unstab",q:"Name four tools for detecting a developing high-energy approach well before the gate.",
a:`<ul><li>V/DEV (vertical deviation) on the PROG page and PFD (Primary Flight Display), with the flight plan kept sequenced when vectored.</li><li>The energy circle (HDG/TRK mode, within 180 NM).</li><li>The threshold in the PROG BRG/DIST field for the shortest distance to go, with height to lose (FL) ≈ 3 × distance.</li><li>CDA (Continuous Descent Approach) pseudo-waypoints, if fitted.</li></ul><p>Plus early crew communication about anything you're uncomfortable with.</p>`,
src:"Safety First: Prevention of Unstable Approaches"},
{id:"sf-unstab-3",s:"sf",t:"unstab",q:"Discontinued approach or go-around: which applies when? What concession does the FCOM allow in IMC?",
a:`<p>Interrupting <b>at or above the FCU altitude</b>: consider a discontinued approach. <b>Below it</b>: go-around procedure.</p><p>In IMC (Instrument Meteorological Conditions), if operator policy and regulations allow, speed and thrust may stabilise after 1 000 ft. The aircraft must be decelerating towards VAPP, with no excessive deviations, and stable <b>by 500 ft AAL at the latest</b>.</p>`,
src:"Safety First: Prevention of Unstable Approaches; FCOM PRO-NOR-SOP Stabilization Criteria"},
{id:"sf-unstab-4",s:"sf",t:"unstab",q:"ATC offers a 'direct to' that cuts 20 NM off the arrival. What does the article say you should already have done, and what can you do now?",
a:`<p>You should already have <b>briefed the worst-case direct-to</b> and agreed the strategy and task sharing as part of TEM (Threat and Error Management).</p><p>Now: check the energy circle and V/DEV (vertical deviation), and use speed, descent rate and speedbrakes. Tell ATC if you're unable, or ask for more track miles. Be ready to discontinue or go around rather than chase the gate.</p>`,
src:"Safety First: Prevention of Unstable Approaches"},
/* rev */
{id:"sf-rev-1",s:"sf",t:"rev",q:"What are the two SOP rules for reverse selection on landing?",
a:`<ol><li>Select reverse <b>immediately after main gear touchdown, not before</b>.</li><li>Once reverse is selected, a <b>full-stop landing is mandatory</b>. The PF must not start a go-around after selecting the reversers.</li></ol>`,
src:"Safety First: Thrust Reverser Selection is a Decision to Stop; FCOM PRO-NOR-SOP Landing"},
{id:"sf-rev-2",s:"sf",t:"rev",q:"In the CFM56 event, why did only ENG 1's reverser fail to stow on the go-around?",
a:`<p>Each ECU (Electronic Control Unit) commands stow only if it computes "ground" from its own LGCIU (Landing Gear Control and Interface Unit) side when the lever leaves REV. Slight lever misalignment and side-to-side timing, plus a left main gear bounce, gave ECU 1 "flight" and ECU 2 "ground". ENG 1 stayed deployed and auto-idle held it at idle. The aircraft veered left, crossed the runway edge at 1 ft, and the beta target was flagged.</p>`,
src:"Safety First: Thrust Reverser Selection is a Decision to Stop"},
{id:"sf-rev-3",s:"sf",t:"rev",q:"Does this stow-logic risk apply to your LEAP-1A aircraft? Does that change the rule?",
a:`<p>The study found the stow-logic risk applies only to A320 and A340 aircraft with <b>CFM56</b> engines. But the rule is engine-independent: <b>reverse selected means full stop</b> on every Airbus type (the A220 FCOM prohibits a go-around after reverser deployment). Fleet data showed about one go-around a month after reverse selection.</p>`,
src:"Safety First: Thrust Reverser Selection is a Decision to Stop"},
/* rops */
{id:"sf-rops-1",s:"sf",t:"rops",q:"What do ROW and ROP each monitor, and over what range?",
a:`<ul><li><b>ROW</b> (Runway Overrun Warning): in the air to touchdown. Compares the predicted landing distance with the LDA (Landing Distance Available), or the runway remaining once past the threshold. Alerts from <b>400 ft</b>.</li><li><b>ROP</b> (Runway Overrun Protection): on the ground until <b>30 kt</b>. Compares the stopping distance at current speed and deceleration with the runway remaining.</li></ul>`,
src:"Safety First: Further Preventing Runway Overrun"},
{id:"sf-rops-2",s:"sf",t:"rops",q:"What must the crew do for amber RUNWAY TOO SHORT, red RUNWAY TOO SHORT, and Step 2's amber IF WET: RUNWAY TOO SHORT?",
a:`<ul><li><b>Red RUNWAY TOO SHORT</b> (below 200 ft, with aural): <b>go around immediately</b>.</li><li><b>Amber RUNWAY TOO SHORT</b> (Step 2+ or Step 3, below 400 ft): consider a go-around depending on the situation.</li><li><b>Amber IF WET: RUNWAY TOO SHORT</b> (Step 2): go around unless the runway is dry.</li></ul>`,
src:"Safety First: Further Preventing Runway Overrun"},
{id:"sf-rops-3",s:"sf",t:"rops",q:"Describe the ROP alert sequence on the landing roll, including the 80 kt message.",
a:`<ol><li>Red <b>MAX BRAKING MAX REVERSE</b> on the PFD (Primary Flight Display), with "BRAKE! MAX BRAKING! MAX BRAKING!" until full pedal braking is detected.</li><li>"SET MAX REVERSE!" until max reverse is detected.</li><li>At <b>80 kt</b>, if the risk remains, "KEEP MAX REVERSE", so you don't go to REV IDLE at 70 kt.</li></ol><p>Apply and keep all deceleration means.</p>`,
src:"Safety First: Further Preventing Runway Overrun"},
{id:"sf-rops-4",s:"sf",t:"rops",q:"What runway-condition input does each ROPS standard need, and what extras does Step 3 add?",
a:`<ul><li><b>Step 2:</b> none. It evaluates dry and wet itself.</li><li><b>Step 2+:</b> a DRY/WET selector set in descent preparation and shown on the ND (Navigation Display).</li><li><b>Step 3:</b> the RWYCC (runway condition code) or braking action selected on the MCDU (PERF APPR, RWY COND FOR ROW/ROP).</li></ul><p>Step 3 also adds a pre-ROP "SET MAX REVERSE" reminder on non-dry runways, and automatic downgrading of the runway condition if braking is poorer than expected. Check the QRH (Quick Reference Handbook) Aircraft Configuration Summary for your standard.</p>`,
src:"Safety First: Further Preventing Runway Overrun"},
/* brakes */
{id:"sf-brakes-1",s:"sf",t:"brakes",q:"What does a brake wear pin flush with its reference surface mean, and why does a worn brake matter most in an RTO?",
a:`<p>Flush means the brake is at its wear limit and must be changed. Braking is only guaranteed down to that point. A worn brake has thinner discs, so the pistons may not reach far enough, and it has less heat-sink mass. In a high-energy RTO (Rejected Takeoff) near MTOW (Maximum Takeoff Weight) that raises the overrun and brake fire risk. If only a few millimetres are left on the walkaround, tell maintenance.</p>`,
src:"Safety First: Take Care of Your Brakes"},
{id:"sf-brakes-2",s:"sf",t:"brakes",q:"What is the difference between thermal and catalytic oxidation of carbon brakes, and which discs does each affect most?",
a:`<ul><li><b>Thermal:</b> caused by high brake temperatures after landing and in taxi. It affects the <b>middle discs</b> most, because they get hottest and cool slowest. It is the main cause of degradation and is increasing on the A320 family.</li><li><b>Catalytic:</b> caused by potassium or sodium from de-icing and cleaning fluids. It affects the <b>outer discs and pressure plate</b> and carries on after winter.</li></ul><p>Either can lead to rupture. In the A330 case an oxidised pressure plate let a piston twist out and leak fluid onto a 400 °C brake.</p>`,
src:"Safety First: Take Care of Your Brakes"},
{id:"sf-brakes-3",s:"sf",t:"brakes",q:"What taxi technique reduces brake wear?",
a:`<p>Keep thrust at idle. On long straight taxiways with no constraints, let the aircraft accelerate to <b>30 kt</b>, then make <b>one smooth brake application down to 10 kt</b>, rather than many light ones. Single-engine taxi also helps by reducing idle thrust.</p>`,
src:"Safety First: Take Care of Your Brakes; FCTM Taxi"},
{id:"sf-brakes-4",s:"sf",t:"brakes",q:"Name five landing techniques that reduce brake energy and oxidation.",
a:`<ul><li>CONF FULL, for a lower approach speed.</li><li>Autobrake (LO where suitable). The updated A320 LO uses 2 m/s² after 2 s.</li><li>Timely retard (20 ft, by touchdown at the latest), so A/THR (Autothrust) doesn't add thrust.</li><li>Use reverse thrust.</li><li>Take the next suitable exit instead of braking hard for an early one.</li></ul><p>Plus brake fans, if fitted. CONF 3 with idle reverse to save fuel is linked to rising thermal oxidation reports.</p>`,
src:"Safety First: Take Care of Your Brakes"}
);

/* tailga: Safety First #39 */
Q.push(
{id:"sf-tailga-1",s:"sf",t:"tailga",q:"How were the 49 tailstrikes reported to Airbus between January 2022 and September 2024 split by flight phase?",
a:`<p>Takeoff 5 (10%), landing 23 (47%), and <b>go-around near the ground 21 (43%)</b>.</p><figure class="fig"><svg viewBox="0 0 600 150" role="img" aria-label="Tailstrikes reported to Airbus by phase, January 2022 to September 2024: takeoff 5 (10%), landing 23 (47%), go-around near the ground 21 (43%).">
<text x="0" y="16" fill="#8c9aab" font-size="12">49 TAILSTRIKES · JAN 2022 – SEP 2024</text>
<g font-size="13"><text x="0" y="52" fill="#e8edf3">Takeoff</text><rect x="190" y="38" width="35" height="20" fill="#3fc8f0"/><text x="232" y="53" fill="#e8edf3">5 · 10%</text>
<text x="0" y="90" fill="#e8edf3">Landing</text><rect x="190" y="76" width="322" height="20" fill="#3fc8f0"/><text x="519" y="91" fill="#e8edf3">23 · 47%</text>
<text x="0" y="128" fill="#ffb326">Go-around near ground</text><rect x="190" y="114" width="294" height="20" fill="#ffb326"/><text x="491" y="129" fill="#ffb326">21 · 43%</text></g>
</svg><figcaption>Nearly half of recent tailstrikes happened in a go-around near the ground. Drawn from the figures in Safety First #39.</figcaption></figure>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"},
{id:"sf-tailga-2",s:"sf",t:"tailga",q:"Case study 1 (A320): what made the aircraft bounce on the first touchdown?",
a:`<p>At 80 ft RA the PF applied 1/3 nose-down while the wind changed from a 5 kt headwind to a 3 kt tailwind. The lift loss took V/S to <b>−800 ft/min at 40 ft</b>. The flare reduced it, but it was still <b>−350 ft/min at touchdown</b>.</p><p>The energy returned through the main gear shock absorbers, plus the lift from the high pitch at touchdown (<b>+9°</b>), bounced the aircraft.</p>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"},
{id:"sf-tailga-3",s:"sf",t:"tailga",q:"Case study 1: what turned the bounce into a tailstrike?",
a:`<p>The ground spoilers extended during the bounce, cutting lift, so the aircraft touched down again. The PF had kept a <b>continuous nose-up input</b> after the first touchdown and then applied <b>full nose-up with TOGA</b>. The pitch went from +9° to <b>+12.7°</b> and the tail struck on the second touchdown, at 127 kt (VAPP − 10 kt).</p>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"},
{id:"sf-tailga-4",s:"sf",t:"tailga",q:"A go-around is called during a bounce. What does the PF do with the pitch, and when are the flaps and gear retracted?",
a:`<p><b>Maintain the pitch</b> and allow a potential second touchdown to happen. Do not try to avoid it. Then adjust the pitch. The PM retracts <b>one flap setting</b> and the <b>landing gear</b> only once the aircraft is established on its go-around trajectory.</p>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"},
{id:"sf-tailga-5",s:"sf",t:"tailga",q:"The engines were at idle when the go-around near the ground was called and the energy is low. When should the PF rotate, and why?",
a:`<p>Wait until the speed reaches <b>at least VAPP</b>, then rotate. The engines take a few seconds to spool up from idle, and a high nose-up demand on the ground at low speed was behind many of the tailstrikes.</p>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"},
{id:"sf-tailga-6",s:"sf",t:"tailga",q:"During a go-around near the ground the main gear touches the runway. What should the PF do?",
a:`<p>Accept it: brief gear contact is acceptable. The PF <b>must not increase the pitch</b> to avoid it.</p>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"},
{id:"sf-tailga-7",s:"sf",t:"tailga",q:"Case study 2 (A330): why did the Captain's nose-down input not prevent the tailstrike, and how should the PM take control?",
a:`<p>Sidestick inputs add algebraically. The Captain's brief 1/3 nose-down, without the priority pushbutton, could not cancel the PF's full nose-up, and it triggered "DUAL INPUT". In other events a same-direction dual input made the rotation worse.</p><p>Only one pilot flies. To take over: call <b>"I have control"</b>, then <b>press and hold the sidestick priority pushbutton</b>.</p>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"},
{id:"sf-tailga-8",s:"sf",t:"tailga",q:"Why must a go-around not be started after the reversers have been selected?",
a:`<p>The SOP forbids it: reverse selection means a full-stop landing. In several tailstrikes the go-around came after reverse selection: the speed had already decayed, and the time for the reversers to stow and lock delayed the spool-up to TOGA.</p>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"},
{id:"sf-tailga-9",s:"sf",t:"tailga",q:"Why delay the flap and gear retraction until established in the go-around?",
a:`<p>Retracting the flaps early needs a higher pitch early in the manoeuvre, when the aircraft is still close to the ground. Waiting until established keeps the pitch lower near the runway.</p>`,
src:"Safety First #39 (January 2025): Preventing Tailstrike During Go-around near the Ground"}
);

/* batch 1: preflight, engine start and taxi */
Q.push(
{id:"sf-seat-1",s:"sf",t:"seat",q:"What does the eye reference indicator show when you are correctly seated?",
a:`<p>Its balls line up so the <b>white ball is hidden behind the red one</b>. Your eyes are then on the eye reference point that the windows, displays and controls were designed around.</p>`,
src:"Safety First #25, January 2018: Are You Properly Seated?"},
{id:"sf-seat-2",s:"sf",t:"seat",q:"Name three effects of sitting too low.",
a:`<ul><li>Overhead controls harder to reach.</li><li>Less awareness when taxiing near airbridges, buildings and vehicles.</li><li>A reduced cut-off angle over the glareshield: bigger blind area, shorter visual segment (worse in low visibility), and a misleading view of the flight path angle on final.</li></ul>`,
src:"Safety First #25, January 2018: Are You Properly Seated?"},
{id:"sf-seat-3",s:"sf",t:"seat",q:"What do you lose by sitting too high?",
a:`<p>The glareshield hides the <b>top of the PFD and ND</b>; the flight path angle can look wrong on final; and full rudder pedal travel is harder to reach.</p>`,
src:"Safety First #25, January 2018: Are You Properly Seated?"},
{id:"sf-seat-4",s:"sf",t:"seat",q:"When must the seat be adjusted, and when should you check it again?",
a:`<p>Before the aircraft moves: before pushback or engine start (FCOM SOP). Check again <b>before the approach</b>, because fatigue on a long sector makes you sink.</p>`,
src:"Safety First #25, January 2018: Are You Properly Seated?"},
{id:"sf-seat-5",s:"sf",t:"seat",q:"Why does the armrest setting matter for manual flying?",
a:`<p>Set right, the forearm rests and the wrist is straight, so only the hand and fingers move the sidestick: precise inputs, and a steadied arm in turbulence. Set wrong, pilots are more prone to over-reaction and excessive inputs.</p>`,
src:"Safety First #25, January 2018: Are You Properly Seated?"},
{id:"sf-seat-6",s:"sf",t:"seat",q:"Why check full pedal travel when adjusting the seat?",
a:`<p>Full rudder is needed for an engine failure on take-off or in the initial climb, strong crosswinds, and the flare and roll-out; and full manual braking may be needed after a rejected take-off or on landing.</p>`,
src:"Safety First #25, January 2018: Are You Properly Seated?"},
{id:"sf-iceridge-1",s:"sf",t:"iceridge",q:"Why can ice ridges on the lower nose fuselage cause unreliable airspeed?",
a:`<p>Ridges ahead of the pitot probes disturb the airflow into them, so the ADR airspeed reads <b>lower than the real speed</b>. One large ridge or several thin ones can do it.</p>`,
src:"Safety First #26, July 2018: Look out for Ice Ridges on the Lower Nose Fuselage"},
{id:"sf-iceridge-2",s:"sf",t:"iceridge",q:"In the A320 event, what happened at lift-off and 12 s later?",
a:`<p>At lift-off: Alternate law and AUTO FLT A/THR OFF. 12 s later: FDs, characteristic speeds, TLU and AP lost, with SPD LIM and FD red flags on both PFDs. At 1 500 ft the ECAM showed NAV ADR DISAGREE, F/CTL ALTN LAW and AUTO FLT RUD TRV LIM SYS.</p>`,
src:"Safety First #26, July 2018: Look out for Ice Ridges on the Lower Nose Fuselage"},
{id:"sf-iceridge-3",s:"sf",t:"iceridge",q:"By how much did the airspeeds under-read in that event?",
a:`<p>ADR 3 by up to 40 kt from the start of the take-off roll; ADR 1 by up to 10 kt in the roll and up to 35 kt from rotation.</p>`,
src:"Safety First #26, July 2018: Look out for Ice Ridges on the Lower Nose Fuselage"},
{id:"sf-iceridge-4",s:"sf",t:"iceridge",q:"On an A320 family aircraft, how many affected probes does it take to lose the ADRs, and what is lost?",
a:`<p>One probe: no system loss. <b>Two or three</b>: the flight controls and auto flight may reject all three ADRs: characteristic speeds, AP, FDs, A/THR and the rudder travel limiter are lost, and the law reverts to <b>Alternate</b>.</p>`,
src:"Safety First #26, July 2018: Look out for Ice Ridges on the Lower Nose Fuselage"},
{id:"sf-iceridge-5",s:"sf",t:"iceridge",q:"When are ice ridges most likely, and what is the second known cause?",
a:`<p>After a long cold stay on the ground: most events were on the <b>first flight of the day</b>. Also: snow melting on the heated windshield and refreezing below it.</p>`,
src:"Safety First #26, July 2018: Look out for Ice Ridges on the Lower Nose Fuselage"},
{id:"sf-iceridge-6",s:"sf",t:"iceridge",q:"Walkaround: you find thin ice ridges on the lower nose, but hoarfrost on the top of the fuselage. What is acceptable?",
a:`<p>Thin hoarfrost on the top of the fuselage is allowed. <b>Ice ridges on the lower nose must be removed</b>, even thin ones: ask the de-icing crew.</p><div data-fig="iceridge_view"></div>`,
src:"Safety First #26, July 2018: Look out for Ice Ridges on the Lower Nose Fuselage"},
{id:"sf-pitot-1",s:"sf",t:"pitot",q:"How quickly can a probe be blocked on the ground?",
a:`<p>A mud dauber wasp can build a nest able to block a probe in about <b>20 minutes</b> (CASA). In the A330 event a probe was partly blocked in <b>less than 2 hours</b>.</p>`,
src:"Safety First #22, July 2016: Pitot Probe Performance Covered On the Ground"},
{id:"sf-pitot-2",s:"sf",t:"pitot",q:"When can pitot covers be fitted after engine shutdown, and why the wait?",
a:`<p>About <b>30 minutes</b> after shutdown. Probe heat stops with the engines; the tip takes about 15 minutes to cool to 70 °C and another 15 to reach ambient.</p>`,
src:"Safety First #22, July 2016: Pitot Probe Performance Covered On the Ground"},
{id:"sf-pitot-3",s:"sf",t:"pitot",q:"What made the A330 event worse on the second take-off?",
a:`<p>The aircraft had been dispatched under the MEL with <b>ADIRU 2 inoperative</b>. A wrong Captain airspeed with ADIRU 2 out removed the A/THR and FDs, reverted the law to Alternate and left the AP unavailable.</p>`,
src:"Safety First #22, July 2016: Pitot Probe Performance Covered On the Ground"},
{id:"sf-pitot-4",s:"sf",t:"pitot",q:"What is the main cause of rejected take-offs and turn-backs for airspeed discrepancy below FL250?",
a:`<p>Pitot inlet obstruction by <b>sand, dust, dirt or insects</b>.</p>`,
src:"Safety First #22, July 2016: Pitot Probe Performance Covered On the Ground"},
{id:"sf-pitot-5",s:"sf",t:"pitot",q:"What two SOP barriers does the crew have against a blocked pitot?",
a:`<ul><li><b>Exterior walkaround:</b> look at each probe, every cover removed, no damage.</li><li><b>Take-off:</b> scan the speeds; the PF cross-checks the airspeed at <b>100 kt</b>.</li></ul><div data-fig="pitot_principle"></div>`,
src:"Safety First #22, July 2016: Pitot Probe Performance Covered On the Ground"},
{id:"sf-oeb-1",s:"sf",t:"oeb",q:"What is the difference between a red and a white OEB?",
a:`<p><b>Red:</b> not applying it may significantly affect the <b>safe</b> operation of the aircraft. <b>White:</b> not applying it may significantly affect <b>efficient</b> operation (diversions, delays).</p>`,
src:"Safety First #30, July 2020: Mind the OEBs!"},
{id:"sf-oeb-2",s:"sf",t:"oeb",q:"What are the three things a crew must know about OEBs before a flight?",
a:`<ul><li>Which OEBs apply to this aircraft.</li><li>Their entry conditions (an ECAM alert or a defined event).</li><li>Their cockpit and system effects when applied.</li></ul>`,
src:"Safety First #30, July 2020: Mind the OEBs!"},
{id:"sf-oeb-3",s:"sf",t:"oeb",q:"When does the SOP ask you to review the OEBs, and with what?",
a:`<p>In the <b>preliminary cockpit preparation of every flight, even in transit</b>, using the <b>LEOEB</b> in the QRH: only this aircraft's OEBs, red first, with their ECAM entries.</p>`,
src:"Safety First #30, July 2020: Mind the OEBs!"},
{id:"sf-oeb-4",s:"sf",t:"oeb",q:"What does REFER TO QRH PROC on the ECAM mean?",
a:`<p>It is the <b>OEB reminder</b>: the operator activated it for an alert affected by an OEB. Apply the OEB procedure in the QRH.</p>`,
src:"Safety First #30, July 2020: Mind the OEBs!"},
{id:"sf-oeb-5",s:"sf",t:"oeb",q:"Why is it a risk if an OEB stays in the documents after its fix is installed?",
a:`<p>A crew could apply a procedure that no longer applies to the aircraft. The aircraft configuration and the onboard documentation must stay aligned.</p>`,
src:"Safety First #30, July 2020: Mind the OEBs!"},
{id:"sf-egt-1",s:"sf",t:"egt",q:"In the A321 event, what combination led to the dual EGT overlimit?",
a:`<p>Two degraded engines (dirty, eroded, worn), a 30 °C day (ISA +15) and <b>TOGA with packs ON</b>. Both engines also stalled.</p>`,
src:"Safety First #34, July 2022: Prevention of EGT Overlimit Events"},
{id:"sf-egt-2",s:"sf",t:"egt",q:"EGT overlimit before 100 kt, between 100 kt and V1, and after V1: what does the guidance say?",
a:`<ul><li><b>Before 100 kt:</b> consider rejecting; with vibration it can mean engine damage.</li><li><b>100 kt to V1:</b> continue, establish the climb, ECAM above 400 ft. The Captain may still reject (dual event, mountains).</li><li><b>After V1 or lift-off:</b> continue; above 400 ft, ECAM and gently reduce thrust on the affected engine.</li></ul><div data-fig="egt_zones"></div>`,
src:"Safety First #34, July 2022: Prevention of EGT Overlimit Events"},
{id:"sf-egt-3",s:"sf",t:"egt",q:"Why is an EGT overlimit an amber caution rather than a red warning?",
a:`<p>The redline is not a hard limit: without severe damage the engine still gives thrust above it, at the cost of faster wear. Certification tests showed this.</p>`,
src:"Safety First #34, July 2022: Prevention of EGT Overlimit Events"},
{id:"sf-egt-4",s:"sf",t:"egt",q:"When is the EGT OVER LIMIT alert inhibited?",
