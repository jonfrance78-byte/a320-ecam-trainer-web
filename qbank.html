{id:"fuel",tag:"Fuel",title:"Fuel Monitoring on A320 Family Aircraft",url:"https://safetyfirst.airbus.com/fuel-monitoring-on-a320-family-aircraft/",
summary:"Three engine-failure events in which the gauges said there was fuel and there wasn't. Why the LO LVL alert is the one to trust.",
brief:`<h4>The events</h4>
<ol>
<li><b>Leak after maintenance.</b> In cruise, L TK PUMP 1+2 LO PR came up three times and the left tank emptied faster than the right. The crew opened crossfeed, then closed it when the quantity kept falling. Engine 1 shut down a few minutes later. The aircraft landed on engine 2 with 840 kg in the right tank and none in the left. Cause: an engine 1 HP fuel pump filter cover that was not fitted properly after maintenance. About 4–5 t of fuel leaked.</li>
<li><b>FQI over-read.</b> The FQI (Fuel Quantity Indication) had an intermittent fault that crews didn't record. In flight, FUEL L WING TK LO LVL triggered. The SD (System Display) page looked normal, so the crew treated the alert as spurious. Engine 1 flamed out on approach. The left tank was empty, and the FQI had been over-reading by 1 t.</li>
<li><b>Discrepancies not logged.</b> An intermittent FQIC (FQI Computer) failure produced a 500 kg arrival discrepancy, then about 3 000 kg on the next sector. The crew put the second one down to a direct routing. Nothing went in the tech log. On the third sector LO LVL triggered on one side, then the other. The aircraft landed with about 900 kg.</li>
</ol>
<h4>Key points</h4>
<div data-fig="fuel_sources"></div>
<ul>
<li><b>Three sources of fuel information.</b>
  <ul>
  <li>FQI: capacitance probes measure volume, and the FQIC converts it to mass using the measured density.</li>
  <li>Fuel Used: from the engine fuel flow meters, integrated by the FADEC (Full Authority Digital Engine Control).</li>
  <li>Low-level sensors: three per wing tank, physically independent of the FQI.</li>
  </ul></li>
<li><b>LO LVL logic.</b> The sensors go dry at about 750 kg. The alert triggers when 2 sensors in the same tank stay dry for more than 30 s. It is not shown on the SD page, so do not use the SD page to dismiss it.</li>
<li><b>Sizing.</b> LO LVL is set to cover 30 min at 1 500 ft (about 1 200 kg). Both sides together means about 1 500 kg remaining.</li>
<li><b>Fuel checks.</b>
  <ul>
  <li>Before start: initial FOB (Fuel On Board) + uplift = FOB ± Δ.</li>
  <li>In flight, at each waypoint or every 30 min: FOB + FU (Fuel Used) = initial FOB ± Δ. Also cross-check against the OFP (Operational Flight Plan).</li>
  <li>Post-flight: the same check as in flight.</li>
  </ul></li>
<li><b>Tolerance.</b> On the ground the FQI tolerance is ±(1% of current FOB + 1% of maximum FOB).</li>
<li><b>Water in the tanks</b> causes over-reading and gauge fluctuation.</li>
</ul>
<p class="take">"Should the LO LVL alert trigger, it is to be trusted. It is the independent voice from the tanks themselves."</p>
<div data-cards="fuel"></div>`},

{id:"idg",tag:"Electrics",title:"Preventing Loss of Engine Generators",url:"https://safetyfirst.airbus.com/preventing-loss-of-engine-generators-on-a320-family-a330-and-a340-aircraft/",
summary:"Both IDGs fail in sequence in an idle descent and the aircraft drops into emergency electrical configuration. Why it happens and what to do after the first GEN FAULT.",
brief:`<h4>The event (A319)</h4>
<ol>
<li>The aircraft was descending from FL360 in THR IDLE | OP DES | NAV. Passing 31 500 ft, ELEC GEN 2 FAULT triggered.</li>
<li>5 seconds later: <b>ELEC EMER CONFIG</b>. The RAT (Ram Air Turbine) deployed, AP (Autopilot) and A/THR (Autothrust) disconnected, and the aircraft went to <b>Alternate law</b>. Only the Captain's PFD (Primary Flight Display), the ND (Navigation Display) and the upper ECAM display were left.</li>
<li>GEN 1 was reset successfully at T+2 min 51 s, and GEN 2 at T+4 min 22 s.</li>
<li>Resetting FAC (Flight Augmentation Computer) 1 and 2 brought back Normal law. The AP was re-engaged and the APU (Auxiliary Power Unit) started as a precaution.</li>
</ol>
<h4>Why it happens</h4>
<ul>
<li><b>IDG basics.</b> Each IDG (Integrated Drive Generator) contains a CSD (Constant Speed Drive) that turns variable engine speed into a constant 400 Hz output. The GCU (Generator Control Unit) disconnects the generator if the frequency goes out of tolerance.</li>
<li><b>Root cause.</b> Worn hydraulic blocks inside the CSD cause frequency regulation errors. The GCU then trips the generator.</li>
<li><b>Contributor 1: idle thrust.</b> Near idle, engine speed is close to the CSD's "straight-through" speed, where no correction is needed. The regulation toggles on and off repeatedly, and a worn unit lags.</li>
<li><b>Contributor 2: sudden load.</b> When one generator trips, the other suddenly takes the whole electrical load. That step can push a worn CSD out of regulation.</li>
<li><b>On the ground.</b> Total loss of AC power has occurred during SETWA (Single Engine Taxi Without APU). All displays go black, so no ECAM alert appears.</li>
</ul>
<h4>Crew actions</h4>
<ul>
<li>Apply ELEC GEN 1(2) FAULT and reset the generator. A reset that works may not last: the generator can trip again if the same conditions return.</li>
<li><b>Start the APU</b> to restore two generators, so a second IDG failure does not leave you in emergency electrical configuration.</li>
</ul>`},

{id:"flare",tag:"Landing",title:"A Focus on the Landing Flare",url:"https://safetyfirst.airbus.com/a-focus-on-the-landing-flare/",
summary:"A bounce, a nose gear impact and a tail strike on go-around (A320), and a float ending in a nose-gear-first landing (A321). The recipe for a safe flare.",
brief:`<h4>Case 1: A320, bounce, nose gear impact, tail strike</h4>
<ol>
<li>CONF FULL, AP (Autopilot) off at 370 ft, A/THR (Autothrust) on. From 100 ft, tailwind gradients held the speed below VAPP − 5 kt. It reached VAPP − 20 kt at 5 ft. No SPEED callout was made.</li>
<li>The flare started late, at 14 ft, while the PF pushed the thrust levers <b>above CLB</b>. That inhibited the ground spoilers and the aircraft bounced. PITCH PITCH sounded.</li>
<li>The PF applied <b>full forward stick</b> and retarded to IDLE. The ground spoilers then extended and the aircraft hit the runway nose gear first.</li>
<li>The PF went around with full back stick and TOGA (Takeoff/Go-Around) thrust, and the tail struck the runway. A nosewheel was ingested by engine 1, and the flight controls went to Alternate law.</li>
</ol>
<h4>Case 2: A321, nose gear first</h4>
<ol>
<li>The PF started flaring at <b>110 ft</b> with A/THR still active, so the levers stayed in CL and A/THR held VAPP. The aircraft crossed the threshold at about 40 ft with V/S (Vertical Speed) close to 0 and floated for about 4 s.</li>
<li>Thrust was retarded at about 20 ft. At about 10 ft the PF applied <b>full forward stick</b>.</li>
<li>The nose gear hit 660 m beyond the threshold, both nosewheels separated, and the aircraft stopped resting on the nose gear axle.</li>
</ol>
<h4>Recipe for a safe landing</h4>
<ul>
<li><b>Be stabilised</b>, and the PM (Pilot Monitoring) calls every deviation. SPEED is called at VAPP − 5 kt.</li>
<li><b>Flare height</b> in stabilised conditions: about <b>30 ft</b> RA (Radio Altitude) on the A318/A319/A320, about <b>40 ft</b> on the <b>A321</b>.</li>
<li><b>Flare earlier</b> for a slope steeper than 3°, an upsloping runway or rising terrain before the threshold, a tailwind, or a high airport elevation.</li>
<li><b>Flare technique:</b> progressive, gentle back stick. <b>No forward stick once the flare has started.</b> You may relax the back stick slightly.</li>
<li><b>RETARD</b> at 20 ft is a reminder, not an order. The levers must be at IDLE <b>by touchdown at the latest</b>, or the ground spoilers will not extend. A late retard also lengthens the landing distance, because A/THR keeps targeting VAPP.</li>
<li><b>Light bounce:</b> hold the pitch attitude and continue. <b>High bounce:</b> hold the pitch attitude and go around, countering the pitch-up from thrust. Never push to land it.</li>
<li><b>Floating:</b> go around. A go-around is possible at any time until reverse is selected. After that, you must land.</li>
<li><b>Go-around close to the ground:</b> avoid an excessive rotation rate. Retract flaps one step and the gear only once safely established in the climb.</li>
</ul>`},

{id:"reset",tag:"Systems",title:"System Reset: Use with Caution",url:"https://safetyfirst.airbus.com/system-reset-use-with-caution/",
summary:"Repeated unauthorised A/SKID & N/W STRG resets hid a dual tachometer failure. All four main gear tyres burst on landing.",
brief:`<h4>The event (A320)</h4>
<ol>
<li>BRAKES AUTO BRK FAULT appeared at engine start. The crew cycled A/SKID &amp; N/W STRG (Anti-Skid and Nosewheel Steering) OFF then ON, and the alert cleared.</li>
<li>BRAKES A/SKID N/WS FAULT appeared on the takeoff roll and was cleared the same way once airborne. It appeared again on approach and was cycled again.</li>
<li>At touchdown braking was unusual. All four main gear tyres burst.</li>
<li>The aircraft history showed 7 AUTO BRK FAULT and 2 A/SKID N/WS FAULT alerts in the previous 2 months. Each time, maintenance only reset the system and tested the BSCU (Brake and Steering Control Unit).</li>
</ol>
<h4>What went wrong</h4>
<ul>
<li>Neither alert has a reset in the QRH (Quick Reference Handbook). The A/SKID &amp; N/W STRG reset is authorised <b>only</b> for BRAKES SYS 1(2) FAULT and BRAKES BSCU CH 1(2) FAULT.</li>
<li>The in-flight resets stopped the BSCU detecting a <b>dual tachometer failure</b>. The BSCU took the wheel speed as 0 kt. After 15 s it recovered braking with a default deceleration, but it could not compute antiskid, so it sent full pressure to the brakes and the tyres burst.</li>
</ul>
<h4>When the flight crew may reset</h4>
<div data-fig="reset_tree"></div>
<ol>
<li><b>Case 1:</b> the reset is a step in an ECAM, OEB (Operations Engineering Bulletin), FCOM or QRH procedure.</li>
<li><b>Case 2:</b> the reset is optional, after the ECAM. The PF calls <b>"STOP ECAM"</b> before the STATUS review, then checks the FCOM/QRH <b>System Reset table</b>. If that alert or malfunction is not listed, <b>do not reset</b>. Follow the table's conditions: maximum number of attempts, and ground-only or in-flight.</li>
<li><b>Case 3 (A320 family, ground only):</b> for faults caused by electrical transients (at power-up, APU or engine start, or a power transfer).
  <ul>
  <li>If the system is listed in the table, reset only for the alerts listed there.</li>
  <li>If the system is not listed, apply the general guidelines in the QRH System Reset section.</li>
  </ul></li>
</ol>
<ul>
<li>Do a reset as "read and do", never from memory. Cross-check any guarded control or C/B (Circuit Breaker) before using it.</li>
<li><b>Log every reset</b>, successful or not, with the number of attempts.</li>
<li>A ground-only reset done in flight can trigger tests that move flight control surfaces, or cause a law reversion with loss of protections.</li>
<li>Third-party reset apps are not authorised by Airbus.</li>
</ul>
<div data-cards="reset"></div>`},

{id:"desc",tag:"Energy",title:"Control your Speed: Descent, Approach and Landing",url:"https://safetyfirst.airbus.com/control-your-speed-during-descent-approach-and-landing/",
summary:"Managed-descent speed range, VAPP construction, decelerated and early-stabilised approaches, and why ground speed mini differs on the neo.",
brief:`<h4>Speeds</h4>
<ul>
<li><b>GD (Green Dot)</b> is the engine-out operating speed in clean configuration, and approximates the best lift/drag speed. It is the managed target in CONF 0 once the approach phase is active. It is also the speed to select CONF 1 and to hold clean.</li>
<li><b>S speed</b> is the managed target in CONF 1/1+F and the speed to select CONF 2. <b>F speed</b> is the target in CONF 2/3, and the speed to select the next configuration.</li>
<li><b>VLS</b> (Lowest Selectable Speed) = k × VS1G, with k between 1.23 and 1.28 on the A320 family. VLS is never below VMCL (minimum control speed in the landing configuration). It <b>rises when the speedbrakes are extended</b>.</li>
<li><b>VFE NEXT</b> is displayed below FL200. <b>VLO</b> is not shown on the PFD (Primary Flight Display); it is on the placard only.</li>
</ul>
<h4>VAPP</h4>
<ul>
<li><b>FMS computation:</b> VAPP = VLS + APPR COR, where APPR COR = ⅓ of the headwind, minimum 5 kt and maximum 15 kt. Some older A320s use ⅓ of the headwind + 5 kt, capped at 15 kt.</li>
<li><b>Crew computation:</b> APPR COR = the highest of the following, capped at 15 kt:
  <ul>
  <li>5 kt with A/THR (Autothrust) on.</li>
  <li>5 kt for ice accretion (10 kt in CONF 3 on the A320 family).</li>
  <li>⅓ of the headwind, excluding gusts.</li>
  <li>Any crew increment.</li>
  </ul></li>
<li>VAPP must be at least <b>VLS + 5 kt</b> for autoland, with A/THR on, with ice accretion, or with a gusty crosswind above 20 kt.</li>
</ul>
<h4>Descent</h4>
<ul>
<li><b>DES mode on the idle segment:</b> speed may vary <b>±20 kt</b> around the managed target (+5/−20 kt with a speed constraint), limited to VMAX − 5 kt.
  <ul>
  <li>At the lower limit, A/THR adds thrust.</li>
  <li>At the upper limit, the aircraft leaves the path to hold that speed.</li>
  </ul></li>
<li>Use speedbrakes in DES only when the aircraft is diverging from the profile. The ND (Navigation Display) shows the intercept point with half speedbrake extended. Watch for MORE DRAG.</li>
<li><b>Energy circle:</b> shown in HDG or TRK mode within 180 NM of destination. It is the minimum distance needed to descend and land. If the airfield is inside the circle, you have too much energy.</li>
<li><b>Crossover altitude:</b> in manual flight close to MMO, reduce pitch before reaching the crossover altitude to avoid exceeding VMO.</li>
</ul>
<h4>Approach</h4>
<ul>
<li><b>Decelerated approach</b> is the default for managed vertical guidance (ILS, FLS, FINAL APP). The aircraft normally reaches the FDP (Final Descent Point) in CONF 1 at S speed and is stabilised by 1 000 ft. Select <b>CONF 2 before the FDP</b> if the final segment is intercepted below <b>2 000 ft AGL</b> (Above Ground Level) on the A320 family. A good practice is FLAPS 2 at one dot below the glideslope.</li>
<li><b>Early stabilised approach</b> is recommended for selected FPA (Flight Path Angle) guidance. The aircraft reaches the FDP at VAPP in the landing configuration, which needs a speed constraint at the FDP.</li>
<li><b>GS mini (ground speed mini)</b> keeps IAS at least at VAPP if the headwind drops to the tower value. It only works in managed speed, and the tower wind must be entered even when it is too light to change VAPP.
  <ul>
  <li><b>A320ceo:</b> factor k = 1.</li>
  <li><b>A320neo family:</b> k = 0.33, because of its lower deceleration capability. This lowers the risk of excess speed at the flare.</li>
  </ul></li>
<li><b>Manual flight:</b> in Normal and Alternate law the aircraft holds the flight path. A wind change therefore shows up as a speed change, not as a movement of the aiming point. The PM (Pilot Monitoring) has to watch the speed.</li>
</ul>`},

{id:"cruise",tag:"Energy",title:"Control your Speed in Cruise",url:"https://safetyfirst.airbus.com/control-your-speed-in-cruise/",
summary:"Why you don't fly below green dot at altitude, what limits REC MAX, and the overspeed thresholds and speedbrake behaviour that catch crews out.",
brief:`<h4>Green dot and the second regime</h4>
<ul>
<li><b>Above GD (Green Dot), the first regime:</b> speed is stable. A disturbance corrects itself because drag rises with speed.</li>
<li><b>Below GD, the second regime:</b> speed is unstable. A loss of speed increases drag, which causes further deceleration.</li>
<li>Below a further point, not shown on the PFD (Primary Flight Display), there is no thrust margin left. The only way to recover is to <b>descend</b>.</li>
<li>Near REC MAX, GD and that point are close together. <b>Do not fly below GD in cruise.</b></li>
</ul>
<h4>Limits</h4>
<ul>
<li><b>REC MAX</b> = the lowest of the service ceiling, the aerodynamic ceiling and the certified ceiling. It <b>decreases as OAT (Outside Air Temperature) increases</b>, and the thrust margin shrinks as you approach it.</li>
<li><b>Causes of speed decay in cruise:</b>
  <ul>
  <li>An increasing tailwind or decreasing headwind combined with rising OAT (REC MAX falls).</li>
  <li>A mountain-wave downdraft of more than 500 ft/min (REC MAX is unchanged, but the thrust margin is used up).</li>
  </ul></li>
<li><b>VLS</b> (Lowest Selectable Speed) = 1.23 × VS1G in clean configuration on fly-by-wire aircraft. It is higher with speedbrakes out.</li>
<li><b>VMO/MMO:</b> MD ≈ MMO + 0.07 and VD ≈ VMO + 35 kt.
  <ul>
  <li>At high altitude, a speed decay is the bigger threat.</li>
  <li>At low altitude, an overspeed is the real threat.</li>
  </ul></li>
<li><b>OVERSPEED warning</b> triggers above VMO + 4 kt or MMO + 0.006. Apply OVERSPEED RECOVERY and report every overspeed, because a structural inspection may be needed.</li>
</ul>
<h4>A320-specific</h4>
<ul>
<li>At high Mach or Vc, <b>speedbrakes extend and retract about twice as slowly with the AP (Autopilot) engaged</b>. If you use them to prevent an overspeed, retract them in good time so you don't end up below GD, especially near REC MAX.</li>
<li><b>Vα PROT and Vα MAX</b> are computed from the actual AOA (Angle of Attack) and airspeed, not from weight. On the A320 the two PFDs can show different values, because each uses a different airspeed source.</li>
<li>Stall indications are the STALL aural with cricket, and buffet. Apply STALL RECOVERY immediately. Stall is not a pitch issue: it can occur at any pitch attitude.</li>
</ul>`},

{id:"altn",tag:"Brakes",title:"Don't Forget to Check the Alternate",url:"https://safetyfirst.airbus.com/don-t-forget-to-check-the-alternate/",
summary:"A failed alternate-brake test was ignored. Later the normal brakes were lost and the parking brake had to stop the aircraft. When the check applies to the A320 family.",
brief:`<h4>The event (A330)</h4>
<ol>
<li>At the pre-flight alternate brake check, pressure reached only <b>416 psi</b> (expected 2 200–2 700 psi). The crew dispatched anyway.</li>
<li>After takeoff the Green hydraulic system was lost, and with it normal braking and autobrake.</li>
<li>On landing, alternate braking did not work. The crew applied the LOSS OF BRAKING memory items, then stopped the aircraft with <b>3 parking brake applications</b>. All main gear tyres burst.</li>
<li>Root cause: air in the alternate braking low-pressure control circuit, introduced by incorrect servicing after a master cylinder was replaced. There had been three earlier crew reports of low pressure and a "spongy" pedal.</li>
</ol>
<div data-replay="altn"></div>
<h4>A320 family relevance</h4>
<ul>
<li><b>Hydromechanical alternate braking</b> (pedals drive master cylinders, which open a dual valve on the <b>Yellow</b> system) is fitted to A320 family aircraft delivered <b>before 2007</b>. On these aircraft the SOP calls for a manual check.</li>
<li><b>Electrically controlled alternate braking</b> (pedal position sent to the BSCU and the ABCU (Alternate Braking Control Unit)) was introduced progressively from 2005. On these aircraft the check is done automatically, and the SOP does not ask the crew to do it. An operator may still require it for commonality across a mixed fleet.</li>
</ul>
<h4>The check (hydromechanical aircraft)</h4>
<ul>
<li><b>When:</b> before the exterior walkaround on the first flight of the day, and after a crew change.</li>
<li><b>Before starting:</b> accumulator pressure must be in the green band. If not, run the Yellow ELEC PUMP to recharge it.</li>
<li><b>Steps:</b>
  <ol>
  <li>Yellow electric pump OFF.</li>
  <li>Chocks in place.</li>
  <li>PARK BRK OFF.</li>
  <li>Press both pedals fully.</li>
  <li>Check brake pressure on <b>both sides</b> is between <b>2 000 (or 2 200) and 2 700 psi</b> on the triple indicator.</li>
  <li>Release the pedals, then PARK BRK ON.</li>
  </ol></li>
<li><b>Spongy pedals</b> (loss of artificial feel) mean air in the low-pressure control circuit. Report it, and maintenance action is needed before flight. The same applies if the pressure is out of range.</li>
</ul>`},

{id:"park",tag:"Ground",title:"Safe Aircraft Parking",url:"https://safetyfirst.airbus.com/safe-aircraft-parking/",
summary:"Accumulator pressure was green and the PARK BRK was set, yet the A319 rolled into the airbridge. Why the brake pressure check matters.",
brief:`<h4>The event (A319)</h4>
<ol>
<li>On arrival at the gate, the pilot checked that accumulator pressure was green and set PARK BRK ON.</li>
<li>The pilot did <b>not</b> check the brake pressure, then released the pedals and shut down the engines.</li>
<li>The aircraft rolled forward into the airbridge. The PBSELV (Parking Brake Selector Valve) was opening very slowly, so brake pressure appeared on the indicator only after the collision.</li>
</ol>
<h4>Architecture</h4>
<ul>
<li>With the engines off, the parking brake is held by accumulator pressure. A charged accumulator holds the brake for about <b>12 hours</b>.</li>
<li>On the A320 family, the accumulator is recharged by the Yellow system, or by switching the Yellow ELEC PUMP on.</li>
<li>Pressure is lost over a long stay (more than 12 h), from leaks, or after many park brake applications without recharging.</li>
</ul>
<h4>Parking procedure (engines running, pedals pressed)</h4>
<ol>
<li>Check ACCU pressure is in the green band.</li>
<li>PARK BRK ON.</li>
<li>Check <b>left and right brake pressure</b> on the triple indicator.</li>
<li>Only then release the pedals and shut down the engines.</li>
</ol>
<p>If either pressure is insufficient, <b>keep the pedals pressed</b>, ask for chocks, and shut down only once the chocks are in. Then make a tech log entry.</p>
<h4>Good to know</h4>
<ul>
<li>On the A320 family, <b>normal pedal braking has priority</b> over the parking brake. If the aircraft moves, press the pedals; there is no need to release the PARK BRK first.</li>
<li><b>Hot brakes:</b> once chocks are in, set the PARK BRK OFF. Leaving it on passes heat to the pistons, which degrades the seals and overheats the fluid, and can lead to brake dragging.</li>
<li>A <b>PARK BRK FAULT</b> ECAM alert detects a mismatch between the handle position and the PBSELV. It is fitted from MSN (Manufacturer Serial Number) 4468 (October 2010) and is available by retrofit before that.</li>
<li><b>Chocks at transit:</b> first on one nosewheel when the aircraft stops, then on the main gear outboard wheels once the engines are spooling down.</li>
</ul>`}
,
{id:"to",tag:"Takeoff",title:"Control your Speed at Takeoff",url:"https://safetyfirst.airbus.com/control-your-speed-at-take-off/",
summary:"Where V1, VR and V2 come from, what happens if you don't respect them, and the speed errors that catch crews out before the roll even starts.",
brief:`<h4>The speeds and their boundaries</h4>
<ul>
<li><b>V1</b> is the highest speed at which an RTO (Rejected Takeoff) can be started, and the lowest speed at which the takeoff can be continued after an engine failure. It must satisfy <b>VMCG ≤ VEF ≤ V1 ≤ VMBE</b>:
  <ul>
  <li>VMCG (Minimum Control speed on the Ground): the lowest speed at which the aircraft can be controlled on the ground with rudder alone after a sudden engine failure. It depends mainly on thrust and pressure altitude.</li>
  <li>VEF (Engine Failure speed): the latest point at which the critical engine can fail. V1 adds about 1 s of recognition time.</li>
  <li>VMBE (Maximum Brake Energy speed): an RTO at MTOW (Maximum Takeoff Weight) from this speed reaches the maximum energy the brakes can absorb.</li>
  </ul></li>
<li><b>VR</b> is rotation at about 3°/s, and guarantees V2 by 35 ft even with an engine failure at VEF. It must satisfy V1 ≤ VR, VR ≥ 1.05 VMCA (Minimum Control speed in the Air), and VR ≤ VLOF (liftoff speed).</li>
<li><b>V2</b> is the minimum speed at 35 ft with an engine failed at VEF, held through the second segment. V2 ≥ 1.13 VS1G and ≥ 1.10 VMCA.</li>
</ul>
<h4>If you don't respect them</h4>
<ul>
<li><b>Continuing with an engine failure below V1:</b> lateral excursion, or running out of runway.</li>
<li><b>Rejecting above V1:</b> longitudinal overrun, or brake energy exceeded and a brake fire.</li>
<li><b>Rotating early:</b> tail strike.</li>
<li><b>Rotating late or slowly:</b> you may not reach 35 ft by the end of the runway or clearway.</li>
<li><b>Engine-out below V2:</b> drag rises, and the only way to regain speed may be to descend. Below VMCA there is not enough lateral control.</li>
<li><b>Engine-out above V2:</b> the climb gradient falls, which threatens obstacle clearance.</li>
</ul>
<h4>The errors behind most speed events</h4>
<ul>
<li><b>ZFW entered as gross weight</b> (ZFW: Zero Fuel Weight). Speeds come out far too low, giving a tail strike, a "heavy" feel or a high-speed RTO. This is most likely after a late loadsheet change.</li>
<li><b>Speeds no longer valid</b> after a runway change, an intersection departure, or a wet runway becoming contaminated.</li>
<li><b>Changes made during taxi</b>, when the PF has little capacity left to cross-check.</li>
<li><b>Missed V1 call</b>: the PM, focused on a failure, forgets the call.</li>
<li><b>Engine failure after liftoff:</b> pitching above the FD (Flight Director) bars to "climb faster" takes the aircraft below V2.</li>
</ul>
<h4>PM role</h4>
<ul>
<li>Compute and cross-check V1, VR and V2. Re-insert them after any late change and watch for keystroke errors.</li>
<li>The takeoff briefing covers speeds, configuration and weight.</li>
<li>At low speed, any delay in bringing the good engine to idle after an engine failure leads to rapid loss of directional control. Maximum rudder and maximum differential braking may be needed.</li>
</ul>`},

{id:"clb",tag:"Climb",title:"Control your Speed During Climb",url:"https://safetyfirst.airbus.com/control-your-speed-during-climb/",
summary:"F, S and green dot during clean-up, the VFE warning that can sound when you're not over the limit, and the heavy-weight takeoff trap.",
brief:`<h4>Manoeuvring speeds after takeoff</h4>
<ul>
<li><b>F speed</b> is the minimum speed at which to retract from CONF 2 or 3 to CONF 1+F. It is about 1.18–1.26 × VS1G in CONF 1+F, and is shown only with the lever in 2 or 3 (takeoff, initial climb, go-around).</li>
<li><b>S speed</b> is the minimum slat retraction speed, i.e. the minimum speed at which to select CLEAN. It is about 1.21–1.25 × VS1G clean, and is shown only with the lever in 1.</li>
<li><b>GD (Green Dot)</b> is the engine-out operating speed and approximates the best lift/drag speed. <b>Avoid flying below GD in the climb</b>: with climb thrust already set, the only way back is to reduce the climb rate or even descend.</li>
<li>F, S and GD are all computed from the <b>ZFW (Zero Fuel Weight) entered in the FMS</b>. A wrong entry makes all three wrong.</li>
</ul>
<h4>Retracting at the wrong speed</h4>
<ul>
<li><b>Well below F or S:</b> less margin to the high angle-of-attack protection. The speed can fall below VLS (Lowest Selectable Speed) for the new configuration.</li>
<li><b>Well above F or S:</b> reduced climb performance, which threatens obstacle clearance, especially with one engine inoperative.</li>
<li>If you need to turn before acceleration altitude with flaps still out, F or S is a safe speed for that turn.</li>
</ul>
<h4>VFE and the "false" overspeed warning</h4>
<ul>
<li>With A/THR (Autothrust) active in CLB, OP CLB or SPEED, the aircraft stays below VFE. With manual thrust (for example in a go-around), VFE can be exceeded. Exceeding VFE triggers the overspeed warning and may require a structural inspection.</li>
<li><b>A320 family logic:</b> the VFE shown on the PFD (Primary Flight Display) follows the <b>lever position</b> and moves as soon as the lever is moved. The aural overspeed threshold follows the <b>actual surface position</b>. So during retraction while accelerating, a brief OVERSPEED warning can sound even though the speed is clear of the red-and-black strip. Airbus says this has no operational or safety consequence.</li>
<li><b>Heavy-weight takeoff:</b> S speed is close to VFE CONF 1+F. Example: an A320 at 76 t has S = 205 kt, and flap auto-retraction is at 210 kt. <b>Don't delay selecting flaps 0 beyond S speed</b>, or a rapid acceleration can trigger a brief VFE warning.</li>
</ul>`},

{id:"turb",tag:"Turbulence",title:"Managing Severe Turbulence",url:"https://safetyfirst.airbus.com/managing-severe-turbulence/",
summary:"An A320 hit by an updraft then downdraft 4 NM from a storm, with g close to zero and the AP disconnecting. Avoidance rules, cockpit technique and cabin coordination.",
brief:`<h4>The event (A320, approach)</h4>
<ol>
<li>Working around thunderstorms towards final approach, the aircraft passed about <b>4 NM</b> from a cell boundary.</li>
<li>A strong updraft, then a downdraft, gave a load factor <b>close to 0 g</b>, and the AP (Autopilot) disconnected.</li>
<li>Both pilots were surprised, but <b>neither made a sidestick input</b>. They accepted small altitude deviations, re-engaged the AP and landed.</li>
<li>The cabin was already secured for landing, so there were no injuries.</li>
</ol>
<h4>Avoidance</h4>
<ul>
<li><b>Storms:</b> avoid cells by 20 NM laterally, preferably upwind (hail). Do not overfly with less than 5 000 ft separation, and do not overfly cells with tops above 25 000 ft. Turbulence extends outside the cloud.</li>
<li><b>CAT (Clear Air Turbulence):</b> the weather radar cannot see it. It is generally above 15 000 ft. Rely on forecasts and pilot reports.</li>
<li><b>Mountain waves:</b> felt up to 100 NM downwind of the range and up to cruise levels. Lenticular clouds are a clue.</li>
<li><b>Wake vortex:</b> the signature is a small roll one way, then a larger roll the other way. Keep the separation, and consider an upwind lateral offset.</li>
</ul>
<h4>In the cockpit</h4>
<ul>
<li>Secure loose items and lock the shoulder harnesses.</li>
<li><b>Keep the AP ON.</b> It holds the flight path without over-controlling.</li>
<li><b>Keep A/THR (Autothrust) ON.</b> In <b>severe</b> turbulence fly the QRH turbulence speed (VRA/MRA, rough-air speed/Mach). Managed speed is fine in light or moderate turbulence. If thrust variations become excessive, disconnect A/THR and set the QRH thrust.</li>
<li><b>In cruise</b>, consider a lower level to increase the margin to buffet.</li>
<li><b>Manual flight:</b> with the stick neutral, fly-by-wire aims for 1 g and a constant roll attitude. Make only careful corrections and <b>don't fight the turbulence</b>. <b>No rudder.</b></li>
<li><b>Don't overreact to a temporary overspeed.</b> VRA/MRA protects the structural margin. Keep AP and A/THR on and accept the excursion.</li>
<li><b>On final</b>, use A/THR to benefit from GS mini (ground speed mini).</li>
</ul>
<h4>Cockpit–cabin communication</h4>
<ul>
<li><b>Anticipated turbulence:</b> tell the cabin how long they have to secure the cabin, plus the expected level and duration. Make a PA (Public Address). The cabin reports back when secured.</li>
<li><b>Unexpected turbulence:</b> seat belt signs ON and a PA immediately. Cabin crew take the nearest seat, even a passenger seat.</li>
<li><b>Afterwards:</b> tell the cabin you are clear. The purser reports injuries and damage.</li>
<li>Make a <b>tech log entry</b> for any severe turbulence, so maintenance can inspect.</li>
<li>Of severe turbulence events reported to Airbus (2014–18), injuries occurred on 30% of long-haul and 12% of short-haul flights. On short-haul it was mostly cabin crew.</li>
</ul>`},

{id:"gaclean",tag:"Go-Around",title:"Go-Around Modes in CLEAN Configuration",url:"https://safetyfirst.airbus.com/non-engagement-of-the-go-around-modes-in-clean-flaps-configuration/",
summary:"An A319 went to TOGA while still clean on a high-energy ILS. The go-around modes didn't engage and the aircraft accelerated down the glideslope to 312 kt at 600 ft.",
brief:`<h4>The event (A319)</h4>
<ol>
<li>The aircraft intercepted the ILS glideslope from above, in V/S (Vertical Speed) at 2 000 ft/min, <b>CLEAN</b>, at 225 kt, about 7 NM out.</li>
<li>Speed was still rising, so the gear was extended at about 2 300 ft.</li>
<li>At 1 300 ft, still clean at 240 kt, the PF selected <b>TOGA</b> (Takeoff/Go-Around). <b>LOC and G/S stayed engaged</b>, so the aircraft accelerated down the glideslope.</li>
<li>Gear up was selected at 243 kt, already above the 220 kt VLO for retraction.</li>
<li>At about 800 ft the crew pulled for OP CLB. The nose gear retracted but the main gear stayed down.</li>
<li>VLE (280 kt) was exceeded and the aircraft reached <b>312 kt at 600 ft</b>. The crew took about <b>30 s</b> to disconnect the AP (Autopilot), then climbed to 3 000 ft and landed safely from a second approach.</li>
</ol>
<h4>Why the modes did not engage</h4>
<p>On the A320 family, SRS (Speed Reference System) and GA TRK engage only when <b>all</b> of these are true:</p>
<ul>
<li>A thrust lever is set to TOGA.</li>
<li>The aircraft is airborne, or has been on the ground for less than 30 s.</li>
<li><b>Slats or flaps are extended.</b></li>
</ul>
<p>With the FLAPS lever at 0, TOGA leaves:</p>
<ul>
<li>The AP and FD (Flight Director) in the approach or landing modes (G/S, LOC, LAND, FLARE).</li>
<li>The FMS in the APPR phase, not the go-around phase.</li>
<li>LVR CLB flashing on the FMA.</li>
</ul>
<p>Energy builds rapidly while the aircraft stays on the approach path. You have to recognise it from the FMA and act without delay.</p>
<h4>Prevention</h4>
<ul>
<li>SOP: be <b>at least CONF 1 at the start of the final approach</b> (decelerated approach), or in the landing configuration (early stabilised approach).</li>
<li><b>Glideslope from above: at least CONF 2</b>, so the speed doesn't build during the interception.</li>
<li>Monitor and call out the FMA on every go-around.</li>
<li><b>Planned enhancement</b> (A320, A330, A380): SRS and GA TRK will engage in clean configuration at TOGA when below 2 500 ft AGL (Above Ground Level) and below the FCU (Flight Control Unit) altitude, as on the A350 with PRIM P12. Check your aircraft's FMGC (Flight Management and Guidance Computer) standard.</li>
</ul>`}
];
