{id:"mel",tag:"Dispatch",title:"A Recall on the Correct Use of the MEL",url:"https://safetyfirst.airbus.com/a-recall-on-the-correct-use-of-the-mel/",
summary:"How MMEL items are justified, when the MEL actually applies, and the eight steps from tech log entry to dispatch. It ends with the Captain's acceptance.",
brief:`<h4>MMEL and MEL</h4>
<ul>
<li>The <b>MMEL</b> (Master Minimum Equipment List) is written by Airbus and approved by the certification authority.</li>
<li>The operator's <b>MEL</b> (Minimum Equipment List) is built from the MMEL, <b>can never be less restrictive</b>, and is approved by the national authority.</li>
<li><b>How each MMEL item is justified:</b>
  <ol>
  <li>The failure on its own must be no worse than <b>MINOR</b>.</li>
  <li>The failure combined with the <b>next critical failure</b> must be no worse than <b>MAJOR</b>.</li>
  <li>A quantitative analysis of every HAZARDOUS or CATASTROPHIC failure case that involves the item. This can limit how long you may dispatch with it.</li>
  </ol></li>
<li><b>Each item's status</b> is GO, GO IF (with dispatch conditions) or NO GO.</li>
</ul>
<div data-fig="mel_tree"></div>
<h4>When it applies</h4>
<ul>
<li>The MEL must be applied <b>before departure</b>, and the Captain must accept it. "Departure" means the <b>commencement of the flight: when the aircraft first moves under its own power for takeoff</b>, i.e. the start of taxi.</li>
<li>For a failure between the start of taxi and the start of the takeoff roll, EASA (European Union Aviation Safety Agency) requires operator guidance. The Captain may continue on "good judgement and airmanship" and may consult the MEL and maintenance control.</li>
<li><b>The MEL does not apply in flight.</b> It can still help you anticipate the next dispatch, so log the defect in detail (ECAM title, time, SD (System Display) page, flight phase) and tell maintenance control.</li>
<li><b>Multiple items:</b> check each one for incompatible dispatch conditions. The flight crew decides whether to dispatch.</li>
</ul>
<h4>The eight steps</h4>
<ol>
<li><b>Detect:</b> ECAM alert, flight deck effect, walkaround, or maintenance.</li>
<li><b>Report:</b> make the tech log entry. Cabin log items that affect dispatch must be transferred to the tech log.</li>
<li><b>Identify:</b> use the MEL Entries section (by ECAM title) to find the condition of dispatch. Some entries are NO DISPATCH, some cover several items, and some depend on whether the alert is real or spurious, or on the SD page. Using the wrong item can affect safety.</li>
<li><b>Review:</b> check the dispatch conditions (for example, 36-12-02A or 02B).</li>
<li><b>Decide:</b> maintenance proposes. <b>The Captain accepts</b>, taking into account operator policy and the operational constraints.</li>
<li><b>Log:</b> maintenance logs the item and sets the rectification deadline from the repair interval category.</li>
<li><b>First dispatch:</b> apply every (m) maintenance and (o) operational procedure.</li>
<li><b>Later flights:</b> check every open item is still within its interval for the coming sector. When a new item is added, recheck all the existing items.</li>
</ol>
<div data-cards="mel"></div>`},

{id:"wb",tag:"Loadsheet",title:"Understanding Weight and Balance",url:"https://safetyfirst.airbus.com/understanding-weight-and-balance/",
summary:"A tail strike on the second sector after passengers were left sitting aft. Why forward and aft CG each bite, and how small the A320's CG range really is.",
brief:`<h4>Events</h4>
<ul>
<li><b>Single-aisle tail strike.</b> At a transit stop some passengers left and their bags were offloaded. Everyone continuing was seated aft, with their bags in the aft hold. The loadsheet had been prepared <b>for the first sector only</b>. On the second sector the CG (Centre of Gravity) was aft of the limit and the tail struck on takeoff.</li>
<li><b>Long-haul tail strike and late liftoff.</b> One digit was wrong: the aircraft weighed 362 t, but performance was computed for 262 t.</li>
<li><b>Cargo shift.</b> Cargo moving aft after takeoff caused pitch-ups and, in one case, a stall and crash.</li>
<li>Of weight-and-balance accidents, about 21% involved overweight and 35% a CG outside the certified limits.</li>
</ul>
<div data-slider="wb"></div>
<h4>The physics</h4>
<p>The CG sits ahead of the CP (Centre of Pressure, where lift acts), which creates a nose-down moment. The THS (Trimmable Horizontal Stabiliser) balances it with a downforce, and the wing must carry that extra load as well.</p>
<h4>Forward CG beyond the limit</h4>
<ul>
<li><b>Manoeuvrability:</b> the elevator and THS can run out of authority. You may not be able to reach the correct rotation rate, and it is worst at low speed.</li>
<li><b>Performance:</b> takeoff and landing performance is calculated at the most forward CG in the envelope. Further forward still means actual performance is <b>worse than computed</b>.</li>
<li><b>Structure:</b> at high weight, the nose gear can be overloaded.</li>
</ul>
<h4>Aft CG beyond the limit</h4>
<ul>
<li><b>Go-around:</b> the TOGA (Takeoff/Go-Around) pitch-up may be impossible to counter, and alpha floor may trigger.</li>
<li><b>Takeoff:</b> a light nose means poor nosewheel steering at the start of the roll, especially when wet. The aircraft is easy to over-rotate or may self-rotate, giving a tail strike.</li>
<li><b>Structure:</b> at high weight, the main gear and wing can be overloaded.</li>
</ul>
<h4>A320 numbers</h4>
<ul>
<li>The whole CG range is <b>1.34 m</b>, about 4% of the 37.57 m length.</li>
<li>A <b>150 kg trolley</b> rolled from the back to the front moves the CG by <b>more than 5 cm</b>.</li>
<li><b>Free seating</b> with the cabin less than 80% full can put the actual CG 2–3% from the calculated value. The cabin then needs at least 3 sections in the calculation (the A318/A319 are small enough to be exempt).</li>
<li><b>Last-minute changes</b> alter both weight and CG. Account for the worst case within the safety margins, or recalculate.</li>
<li>The pilot trims using the calculated CG. If the aircraft then feels heavy or light at rotation, the risk is over-reacting.</li>
</ul>`},

{id:"tos",tag:"Line-up",title:"Takeoff Surveillance and Monitoring Functions",url:"https://safetyfirst.airbus.com/takeoff-surveillance-monitoring-functions/",
summary:"The safety nets that catch wrong ZFW, speeds, flaps, trim, runway or intersection from cockpit preparation to brake release. Which alerts mean you reject.",
brief:`<h4>Why it exists</h4>
<p>Events have included takeoffs with the wrong flaps or trim, wrong performance inputs, data not updated after a late runway change, takeoffs from the wrong intersection, from a taxiway or from the opposite runway direction, and residual braking. They happen under stress, high workload, late changes and demanding ATC (Air Traffic Control) requests.</p>
<div data-fig="tos_phases"></div>
<h4>Cockpit preparation</h4>
<ul>
<li><b>TOS1 (Takeoff Surveillance step 1)</b>, on the A320 family since 2009, gives these MCDU (Multipurpose Control and Display Unit) messages:
  <ul>
  <li><b>ENTRY OUT OF RANGE:</b> ZFW (Zero Fuel Weight) outside the valid range.</li>
  <li><b>TO SPEED TOO LOW:</b> margins to VMCG, VMCA or VS1G not met.</li>
  <li><b>V1/VR/V2 DISAGREE:</b> V1 ≤ VR ≤ V2 is not respected.</li>
  <li><b>CHECK TAKE OFF DATA:</b> the runway was changed, so the speeds are invalidated and must be re-entered or confirmed.</li>
  </ul></li>
<li><b>TOS2</b> computes the <b>LOD</b> (Lift-Off Distance) from weight, thrust, flaps, OAT (Outside Air Temperature) and VR/V2, including any T.O SHIFT. If it is longer than the runway available it shows <b>T.O RWY TOO SHORT</b>. It checks again at engine start using the actual fuel quantity.</li>
</ul>
<h4>Taxi: T.O CONFIG pushbutton</h4>
<ul>
<li><b>F/CTL FLAP/MCDU DISAGREE:</b> actual flaps differ from the PERF page.</li>
<li><b>F/CTL PITCH TRIM/MCDU/CG DISAGREE:</b> PERF page trim, actual THS (Trimmable Horizontal Stabiliser) setting and CG-computed trim don't agree.</li>
<li><b>T.O SPEEDS TOO LOW, T.O V1/VR/V2 DISAGREE, T.O SPEEDS NOT INSERTED.</b></li>
<li><b>T.O RWY TOO SHORT</b> (TOS2).</li>
</ul>
<h4>At takeoff thrust (TOS2)</h4>
<ul>
<li><b>NAV ON TAXIWAY:</b> red warning (amber on some FWS (Flight Warning System) standards).</li>
<li><b>NAV NOT ON FMS RUNWAY.</b></li>
<li><b>T.O RWY TOO SHORT:</b> red, computed from the actual position, so it catches a wrong intersection.</li>
<li><b>Airbus recommends rejecting the takeoff</b> for any of these.</li>
<li>The <b>T.O SURV</b> pushbutton switches TOS2 off if the navigation database is out of date for that airport, or a NOTAM (Notice to Air Missions) has changed the runway length.</li>
</ul>
<h4>TOM (Takeoff Monitoring)</h4>
<p>Fitted to the A380 and A350, not the A320. It compares actual with expected acceleration from 30 kt, and triggers <b>T.O ACCELERATION DEGRADED</b> if the shortfall exceeds 15% at 90 kt.</p>
<h4>Good practice</h4>
<ul>
<li>A takeoff briefing that is relevant, concise and in chronological order.</li>
<li>Both pilots compute performance independently and cross-check.</li>
<li>Always insert <b>T.O SHIFT</b> for an intersection departure.</li>
<li>These functions are a <b>safety net, not a replacement for the SOP</b>, and need an up-to-date database.</li>
</ul>
<div data-cards="tos"></div>`},

{id:"thr",tag:"Takeoff thrust",title:"Thrust Setting at Takeoff",url:"https://safetyfirst.airbus.com/engine-thrust-management-thrust-setting-at-takeoff/",
summary:"An A320 left the runway at 31 kt after applying thrust from uneven idle without a proper stabilisation step. Why the two-step thrust setting exists.",
brief:`<h4>The event (A320, IAE engines, night, dry runway, 33 °C)</h4>
<ol>
<li>At line-up the levers were slightly split: ENG 1 at 1.01 EPR (Engine Pressure Ratio) and 61% N2, ENG 2 at 1.03 EPR and 75% N2.</li>
<li>The PF paused near CLB. That gave ENG 1 1.03 EPR and ENG 2 <b>1.24 EPR</b>, so it was not a symmetric stabilisation.</li>
<li>The PF released the brakes and went to FLX. ENG 2 accelerated faster and the aircraft veered left.</li>
<li>The PF responded with rudder, thrust reduction, differential thrust, tiller, asymmetric braking and maximum reverse. The aircraft veered sharply right, then left.</li>
<li>It stopped off the left side of the runway, 300 m from the threshold. Ground speed never exceeded <b>31 kt</b>.</li>
</ol>
<h4>Why engines accelerate unevenly</h4>
<ul>
<li>A high-bypass engine's acceleration is not linear; its control law is shaped to avoid stalls.</li>
<li>Manufacturing tolerances, wear and slightly different idle settings shift each engine's acceleration curve.</li>
<li>Going straight from idle to takeoff thrust can produce a strong asymmetry. At low speed the rudder has little authority, so nosewheel steering alone may not hold it.</li>
</ul>
<h4>The procedure</h4>
<ul>
<li><b>Step 1, stabilise:</b> bring both engines to the FCOM stabilisation value (for example 1.05 EPR on IAE engines, or the N1 value for the engine type). From there the engines accelerate together. This is especially important if you used <b>differential thrust to line up</b>.</li>
<li><b>Step 2:</b> set takeoff thrust. For a static takeoff, release the brakes once the engines are stabilised. For a rolling takeoff the stabilisation step still applies, and you counter any small asymmetry with rudder.</li>
<li><b>Tailwind or significant crosswind:</b> increase thrust <b>progressively</b> from the stabilisation step to takeoff thrust as the aircraft accelerates. The ram air reduces inlet distortion and so the risk of an engine stall.</li>
<li><b>IAE and Rolls-Royce "keep-out zone":</b> on the ground at low speed, steady operation within a band of N1/EPR is prevented. Move both levers <b>continuously and together</b> through it.</li>
</ul>
<h4>If asymmetry develops at low speed</h4>
<ul>
<li>If you cannot hold the centreline with steering, <b>reject</b> using the FCTM low-speed engine failure technique: <b>all levers to IDLE, all reversers, rudder, plus symmetric or differential braking as needed.</b></li>
<li><b>PM:</b> monitors N1/EPR below 80 kt, calls "THRUST SET", and announces any asymmetry at once.</li>
<li><b>Sidestick:</b> half forward stick to 80 kt (<b>full forward with tailwind or significant crosswind</b>), released to neutral by 100 kt, to load the nosewheel.</li>
<li><b>Seat and pedals:</b> adjust so you can reach full rudder and full braking together. Pedals set too far away can even produce opposite differential braking.</li>
</ul>`},

{id:"rot",tag:"Rotation",title:"A Focus on the Takeoff Rotation",url:"https://safetyfirst.airbus.com/a-focus-on-the-takeoff-rotation/",
summary:"An A340 rotated at 1°/s and crossed the runway end at 6 ft. What the 3°/s rate protects, and how the A320neo's rotation law helps.",
brief:`<h4>The event (A340-300, 8 360 ft airport, runway-limited)</h4>
<ol>
<li>The aircraft was at 236.9 t against a 237 t limit, TOGA (Takeoff/Go-Around), CONF 2, on a wet runway with a 4 kt tailwind. Acceleration to VR was normal.</li>
<li>The rotation averaged only <b>1°/s</b>. V2 was reached with the main gear still on the ground.</li>
<li>Liftoff came <b>11 s after rotation began</b>, 140 m from the runway end.</li>
<li>The aircraft crossed the runway end at <b>6 ft RA</b> (Radio Altitude), cleared the LOC antennas by 12 ft, and reached 35 ft 550 m beyond the runway.</li>
</ol>
<h4>Why 3°/s</h4>
<ul>
<li>3°/s is the average rate flown during the certification performance tests, so takeoff performance assumes it.</li>
<li><b>2°/s instead of 3°/s adds about 300 m (1 000 ft) to the takeoff distance.</b></li>
<li><b>Dry takeoff distance</b> = the greater of the one-engine-inoperative distance and 1.15 × the all-engine distance. On a twin it is usually set by the engine-out case, so <b>after an engine failure there is no extra margin</b>. A proper rotation matters most then.</li>
</ul>
<h4>Rotation laws</h4>
<ul>
<li><b>A320ceo:</b> direct law. The rate for a given stick deflection varies with weight, CG (Centre of Gravity), flaps and thrust. A pitch-rate limiter reduces excessive rates but <b>is not tail-strike protection</b>; holding back stick can still strike the tail.</li>
<li><b>A320neo</b> (also A330neo, A350, A380): a <b>pitch-rate target law</b> gives the same rotation rate for a given deflection in all conditions, plus a <b>tail strike protection</b> function. That function can be overridden beyond about ¾ back stick.</li>
<li><b>Tail-strike pitch limit indication:</b> on the A320 and A321 it is shown on <b>landing only</b>. Airbus removed it for takeoff because it led pilots to slow their rotation. The A318 and A319 don't have it.</li>
</ul>
<h4>Technique</h4>
<ol>
<li>At VR, make a <b>positive</b> back-stick input.</li>
<li>Use <b>outside visual references</b> to reach and hold about 3°/s. Liftoff typically comes 4–5 s after rotation starts, at about 10° pitch.</li>
<li>Once airborne, aim for the initial pitch target: <b>15°, or 12.5° with one engine out</b> on the A320.</li>
<li>Then follow the FD (Flight Director).</li>
</ol>`},

{id:"uas",tag:"Takeoff roll",title:"Unreliable Airspeed at Takeoff",url:"https://safetyfirst.airbus.com/unreliable-airspeed-at-takeoff/",
summary:"55 events in 15 months, 44 of them from blocked pitots, including covers left on. How the speed tape shows it, and why the 100 kt check is the last defence.",
brief:`<h4>The data (January 2020 – March 2021)</h4>
<ul>
<li><b>55</b> unreliable airspeed events at takeoff. <b>44</b> were caused by pitot obstruction (insects, sand, dust, leaves). In one, the <b>covers were left on</b>.</li>
<li>Half of the pitot contaminations happened after less than <b>48 h</b> on the ground, and a significant number during transits <b>under 2 h</b>.</li>
<li>In 36 of the 55 the crew rejected the takeoff, often later than they could have.</li>
</ul>
<h4>Case studies</h4>
<ol>
<li><b>A330, all 3 pitot covers left on.</b> Maintenance, the Captain's walkaround and the pushback crew all missed them. <b>SPD red flags</b> appeared on both PFDs (Primary Flight Displays) from 50 kt ground speed. The crew called "100 kt" from <b>ground speed</b>, rotated, used the BUSS (Backup Speed Scale) and made an overweight landing back at departure.</li>
<li><b>A330, dust in the Captain's pitot.</b> At "100 kt" the Captain's side showed about 55 kt. The crew continued and rotated at 133 kt on the F/O side (80 kt on the Captain's). After takeoff came NAV IAS DISCREPANCY, then an overspeed warning in the climb, then a turnback.</li>
<li><b>A320, leaves in the Captain's pitot.</b> The Captain's side read <b>45 kt while stationary</b>. At thrust set it showed 49 kt with almost no trend arrow. At the 100 kt check it showed 58 kt. The crew rejected correctly, but two earlier chances to spot it were missed.</li>
</ol>
<h4>PFD logic</h4>
<ul>
<li>If measured airspeed is below 30 kt and ground speed below 50 kt, the IAS (Indicated Airspeed) sits at the bottom of the scale.</li>
<li>If measured airspeed is below 30 kt and ground speed is above 50 kt, a <b>red SPD flag</b> appears.</li>
<li>Above 30 kt, the IAS is displayed.</li>
</ul>
<h4>What to do</h4>
<ul>
<li>Check the pitots and confirm all covers are removed on every walkaround, including short transits.</li>
<li><b>The PM monitors airspeed from brake release:</b> look for disagreement between PFDs and the ISIS (Integrated Standby Instrument System), an abnormal or missing trend arrow, a flag, or a speed shown when stationary.</li>
<li><b>The 100 kt cross-check is the last line of defence.</b> Be ready to reject there for a discrepancy, and earlier if you see it earlier.</li>
</ul>`},

{id:"ws",tag:"Windshear",title:"Windshear: An Invisible Enemy",url:"https://safetyfirst.airbus.com/wind-shear-an-invisible-enemy-to-pilots/",
summary:"How a microburst hits you three ways in sequence: headwind, downdraft, tailwind. How to spot one coming, and the reactive and predictive escape techniques.",
brief:`<h4>What it is</h4>
<ul>
<li><b>Vertical shear:</b> typically 20–30 kt per 1 000 ft. <b>Horizontal shear:</b> up to 100 kt per NM. It is most dangerous close to the ground.</li>
<li><b>Microburst:</b> less than 2.5 NM across, downdrafts around 40 kt (4 000 ft/min), outflow winds of 45–100 kt, lasting about 15 min. It can be dry or wet and usually sits under or near a CB (cumulonimbus).</li>
<li><b>On approach, in sequence:</b>
  <ol>
  <li>A <b>headwind</b> gust: speed rises and the aircraft balloons, and the natural reaction is to reduce thrust and push.</li>
  <li>The <b>downdraft</b>: the aircraft sinks and AOA (Angle of Attack) rises.</li>
  <li>A <b>tailwind</b>: lift and speed fall sharply.</li>
  </ol></li>
</ul>
<h4>Detecting it</h4>
<ul>
<li><b>LLWAS (Low Level Windshear Alert System):</b> a windshear alert for a loss of 15–29 kt or a gain of more than 15 kt; a <b>microburst alert</b> for a loss of 30 kt or more. It may miss downbursts under 2 NM across. TDWR (Terminal Doppler Weather Radar) gives earlier warning.</li>
<li><b>Visual signs:</b> blowing dust, rings of dust, dust devils, intense rain, or a big difference between the wind on the ND (Navigation Display) and the tower wind.</li>
<li><b>Pilot reports</b> of shear above 20 kt, or up/downdrafts above 500 ft/min below 1 000 ft AGL (Above Ground Level), mean severe conditions. A microburst intensifies for several minutes after it hits the ground.</li>
<li><b>PWS (Predictive Windshear System):</b> active from <b>50 to about 1 000 ft</b>. It gives about a minute's warning, starting with an amber <b>W/S AHEAD</b>, then a red warning with "WINDSHEAR AHEAD" (takeoff) or "GO AROUND, WINDSHEAR AHEAD" (approach).</li>
</ul>
<h4>Preparing for it</h4>
<ul>
<li><b>Takeoff:</b> delay if windshear is suspected or the PWS predicts it. Choose the best runway and departure path, check the radar before rolling, use <b>maximum takeoff thrust</b>, and watch the speed trend.</li>
<li><b>Approach:</b> delay or divert. Consider <b>less than full flap</b> for a better climb gradient, use the AP (Autopilot) on an ILS, and add a gust increment to VAPP (up to VLS + 15 kt). Use managed speed so GS mini (ground speed mini) works, and be go-around minded.</li>
</ul>
<h4>Recognising it</h4>
<p>Watch for: IAS (Indicated Airspeed) changes above 15 kt, ground speed or wind changes, V/S (Vertical Speed) excursions of 500 ft/min, pitch changes of 5°, 1 dot of glideslope deviation, 10° of heading change, or unusual A/THR (Autothrust) activity. The reactive system calls <b>"WINDSHEAR" three times</b>, with a red WINDSHEAR on the PFD (Primary Flight Display).</p>
<h4>Recovering</h4>
<ul>
<li><b>Before V1:</b> reject only if there are unacceptable speed variations (but not exceeding V1) and enough runway left.</li>
<li><b>After V1:</b> TOGA (Takeoff/Go-Around), rotate normally at VR, and follow SRS (Speed Reference System).</li>
<li><b>Initial climb or approach:</b> TOGA and follow SRS. Keep the AP in if it is engaged, but do not engage it. Wings level unless you need to turn for terrain. Use full back stick if needed. <b>Do not change configuration</b> until out of the shear.</li>
<li><b>Energy comes from:</b> extra speed (GS mini), maximum thrust (alpha floor gives TOGA LK automatically, so disconnect A/THR once out of alpha floor), and trading height for speed.</li>
</ul>`},

{id:"tcas",tag:"TCAS",title:"Safe Handling of TCAS Alerts",url:"https://safetyfirst.airbus.com/safe-handling-of-tcas-alerts/",
summary:"RAs are followed correctly only 59% of the time. How TCAP prevents level-off RAs and AP/FD TCAS flies them, plus the step-by-step procedure with and without it.",
brief:`<h4>The problem (Eurocontrol, 2021)</h4>
<ul>
<li>RAs (Resolution Advisories) were followed correctly in <b>58.7%</b> of cases. 29.8% didn't reach the target and 11.5% got no response, an excessive response or the opposite response.</li>
<li>For CLIMB and DESCEND RAs, only <b>33.7%</b> were flown correctly.</li>
<li><b>"Level off" RAs made up 65%</b> of all RAs. TCAS (Traffic Collision Avoidance System) assumes you will continue your current vertical rate, so approaching your cleared level next to traffic on the adjacent level triggers one. ICAO (International Civil Aviation Organization) advises reducing V/S (Vertical Speed) as you approach the level.</li>
</ul>
<h4>TCAP (TCAS Alert Prevention)</h4>
<p>When a TA (Traffic Advisory) occurs near your target level, the ALT* capture engages earlier and uses a lower V/S, which prevents the RA. On the A320 family it has been standard since early 2021 production and is retrofittable. With TCAP you don't need to reduce V/S manually, though a mixed fleet may still require it by policy.</p>
<h4>AP/FD TCAS (Autopilot/Flight Director TCAS mode)</h4>
<ul>
<li>When a TA occurs, <b>TCAS is armed (blue)</b>. When an RA occurs, the TCAS mode engages and targets a V/S <b>200 ft/min inside the green band</b>. When clear, it reverts to <b>V/S ±1000</b> towards the selected altitude.</li>
<li>It responds correctly and promptly, only as much as needed, with a moderate load factor. In 91% of A350/A380 RAs, crews kept the AP on.</li>
<li>Standard on A320 family aircraft since February 2017 production. The QRH (Quick Reference Handbook) <b>Aircraft Configuration Summary</b> tells you whether your aircraft has it.</li>
</ul>
<h4>Procedure, from [MEM] SURV / TCAS WARNING</h4>
<ol>
<li><b>TA:</b>
  <ul>
  <li>If TCAS is not shown on the FMA, the PF calls <b>"TCAS, I have control"</b> and is ready for the standard procedure.</li>
  <li>If TCAS is armed, the PF calls <b>"TCAS blue"</b> and checks A/THR (Autothrust) is engaged.</li>
  </ul></li>
<li><b>RA:</b>
  <ul>
  <li>If the TCAS mode is not available or doesn't engage: <b>AP and both FDs off</b>, and fly the green on the V/S scale.</li>
  <li>If it engages: leave the AP on and monitor the V/S reach the green, or fly the FD manually. The FD bars come back automatically.</li>
  </ul></li>
<li><b>Clear of conflict:</b> return to the clearance. After TCAS mode, select an appropriate vertical mode from the V/S ±1000 reversion.</li>
</ol>
<ul>
<li>Since 2022 the procedure says: <b>any "CLIMB" RA during final approach means GO AROUND.</b></li>
<li>Train both procedures, with and without AP/FD TCAS. EBT (Evidence-Based Training) recommends at least once every three years.</li>
</ul>`},

{id:"radar",tag:"Weather radar",title:"Optimum Use of Weather Radar",url:"https://safetyfirst.airbus.com/optimum-use-of-weather-radar/",
summary:"Radar sees water, not danger. Tilt, gain and range technique, attenuation, overscanning, the blind alley effect, and the 20/40/5 000 avoidance margins.",
brief:`<h4>Principles and limitations</h4>
<ul>
<li>The radar shows <b>reflectivity of liquid water</b>. Water reflects about <b>5×</b> more than ice of the same size. A CB (cumulonimbus) is less reflective higher up, so <b>a weak echo can still be dangerous</b>. Dry tropical overland cells are much more dangerous than they look.</li>
<li><b>Attenuation (shadowing):</b> heavy rain absorbs the beam. A thin band may be the leading edge of a big cell, and anything behind it is hidden.</li>
<li><b>TURB mode</b> (Doppler) needs precipitation and only works within about 40 NM. It cannot see CAT (Clear Air Turbulence).</li>
<li><b>Hail:</b> below FL100 it can be under, in or around the cell (up to 2 NM away). Between FL100 and FL200, about 40% is outside the cloud under the anvil. Above FL200 it is mostly inside. It is most likely <b>downwind</b> of the cell.</li>
</ul>
<h4>Radar types on the A320</h4>
<ul>
<li>Early manual-tilt radars.</li>
<li>Honeywell RDR-4B with Autotilt.</li>
<li><b>Collins WXR-2100 MultiScan:</b> automatic tilt and gain, two beams.</li>
<li><b>Honeywell RDR-4000:</b> 3D buffer, out to 320 NM on the A320. Shows solid colour for ON PATH (within about ±4 000 ft of the flight path) and stripes for OFF PATH.</li>
<li><b>"V2" versions</b> add hail and lightning prediction, REACT (attenuation shown), and more.</li>
</ul>
<h4>Technique</h4>
<ul>
<li><b>Tilt:</b> only cells the beam cuts are displayed. Scan up and down regularly, even in AUTO; switch to MAN to examine a cell's vertical structure.</li>
<li><b>Overscanning:</b> at altitude the beam can pass over the reflective lower part of a cell. Tilt down below the freezing level to find the red core. Yellow or green above red means turbulence.</li>
<li><b>Ground returns</b> change shape and colour quickly when you change tilt; weather echoes don't.</li>
<li><b>Gain:</b> CAL/AUTO by default. At low level, or in very humid air, <b>reduce gain slowly</b>: the last areas to stay red are the strongest cores. At high altitude, increase gain.</li>
<li><b>Range:</b> the PM uses long range for strategy (about 160 NM in cruise). The PF uses short range for tactics (80 NM or less). Using both avoids the <b>blind alley</b> effect, where a gap at short range turns out to be closed at long range.</li>
<li><b>Warning signs on the display:</b> closely packed colour gradients, hook, finger or scalloped shapes, and fast-changing shapes.</li>
</ul>
<h4>Avoidance</h4>
<ul>
<li>Decide on a deviation <b>at least 40 NM</b> before the cell. <b>Lateral avoidance is preferred</b>, on the <b>upwind</b> side.</li>
<li>Clear the threat area by <b>at least 20 NM</b>. Between cells, keep <b>40 NM</b> between threat areas.</li>
<li><b>Never fly underneath</b> a CB. If you must overfly, keep <b>at least 5 000 ft</b> vertical margin.</li>
</ul>`},

{id:"gnss",tag:"Navigation",title:"GNSS Interference",url:"https://safetyfirst.airbus.com/gnss-interference/",
summary:"Jamming takes GPS away. Spoofing feeds you a false GPS position. What each does to A320 navigation, TAWS, ROPS and the radar, and why IRS alignment on the ground can be corrupted.",
brief:`<h4>Jamming and spoofing</h4>
<ul>
<li>The GPS L1 signal (1575.42 MHz) arrives with about the power of a 60 W bulb seen from 20 000 km away, so it is very easy to interfere with.</li>
<li><b>Jamming:</b> the signal is degraded or lost.</li>
<li><b>Spoofing:</b> false GNSS-like signals are tracked instead of, or as well as, the real ones, so the data used by the aircraft is <b>wrong</b>.</li>
<li><b>Sources:</b> military electronic warfare in and around conflict zones (often covered by NOTAM, but not always), counter-drone protection at sensitive sites, personal jammers, and badly installed GNSS repeaters.</li>
</ul>
<h4>Navigation effects (A320 family)</h4>
<ul>
<li><b>Jamming:</b> the FMS (Flight Management System) reverts from GPS/IRS to IRS-DME/DME, then IRS-VOR/DME, then IRS only. There is <b>no map shift</b>, but PBN (Performance-Based Navigation) capability may be lost.</li>
<li><b>Spoofing:</b> the FMS or ADIRU (Air Data Inertial Reference Unit) <b>may not detect it</b>. Symptoms are an <b>unexpected turn in NAV with the AP engaged</b>, a <b>map shift</b> on the ND (Navigation Display), and abnormal IR drift on POSITION MONITOR.</li>
<li><b>On the ground:</b> the IRS can <b>auto-align to a false GNSS position</b>.</li>
</ul>
<h4>Surveillance effects</h4>
<ul>
<li><b>Jamming</b> can make these unavailable:
  <ul>
  <li>Predictive TAWS (Terrain Awareness and Warning System).</li>
  <li>ADS-B out (Automatic Dependent Surveillance–Broadcast).</li>
  <li>ROPS (Runway Overrun Prevention System).</li>
  <li>ALTSM (Altimeter Setting Monitoring).</li>
  <li>TOS2 (Takeoff Surveillance step 2).</li>
  </ul></li>
<li><b>Spoofing</b> can produce <b>spurious</b> TAWS, ROPS, ALTSM or TOS alerts, and false ADS-B position reports.</li>
<li>With Honeywell EGPWS, some false-altitude cases cause the radio altimeter to be rejected, which <b>loses reactive TAWS</b>.</li>
<li><b>Weather radar</b> on radars that use GNSS data (for example WXR-2100, RDR-4000): a false position can make it filter real weather out as ground returns, or show ground as weather. It can also give spurious hazard icons or WEATHER AHEAD messages.</li>
</ul>
<h4>What to do</h4>
<ul>
<li>Apply the <b>FCOM PRO-NOR-SUP "GPS interference"</b> procedure before, inside and after the affected area. Check NOTAMs during flight preparation.</li>
<li>Expect spurious alerts when spoofed, and cross-check position with raw data.</li>
<li>Report it. Maintenance should run TSM (Trouble Shooting Manual) 34-36-00-810-956-A afterwards to clear persistent effects and confirm the cause.</li>
<li>In training, Airbus advises against simulator scenarios that give undue TAWS alerts, to avoid negative training.</li>
</ul>`},

{id:"fleak",tag:"Fuel",title:"Fuel Leak Management in Flight",url:"https://safetyfirst.airbus.com/fuel-leak-management-in-flight/",
summary:"An A330 crew identified a left-side leak but didn't shut the engine down. It fed the leak, and a fire risk, all the way to landing. The A320 FUEL LEAK procedure step by step.",
brief:`<h4>The event (A330)</h4>
<ol>
<li><b>First fuel check:</b> 1 440 kg missing. The Captain put it down to fuel transfer. The imbalance was only 90 kg, because aft transfer was masking it.</li>
<li><b>30 min later:</b> 2 670 kg missing, with a 780 kg imbalance. The crew started FUEL LEAK and isolated the tanks.</li>
<li><b>26 min later:</b> the imbalance had grown by about another tonne. The procedure called for <b>shutting down the left engine</b>. The crew diverted but <b>kept it running</b>.</li>
<li>FUEL F.USED/FOB DISAGREE triggered, and an engineer on board saw fuel streaming from the left engine. Both engines stayed running.</li>
<li>The aircraft landed with 5.2 t missing and no reversers used. The left engine was kept running for the 180° turn on the runway. 5.7 t was lost in total.</li>
</ol>
<p><b>Cause:</b> a misaligned primary fuel hose flange at the pylon, leaking about 2 t/h from the start. Keeping the engine running fed the leak and a <b>fire risk on hot engine parts</b>. With the tanks left isolated, the CG (Centre of Gravity) moved aft to 39.8%, close to the FUEL EXCESS AFT CG threshold.</p>
<h4>Detection</h4>
<ul>
<li><b>Fuel check at each waypoint or every 30 min:</b>
  <ul>
  <li>(FOB (Fuel On Board) + FU (Fuel Used)) − block fuel: a large or growing shortfall is a warning sign.</li>
  <li>FOB against the FMS and flight plan predictions.</li>
  </ul></li>
<li><b>Other cues:</b> one tank falling abnormally, a sudden overflow, high FF (Fuel Flow), low N1, a developing imbalance, a fuel smell, or visible spray. Some imbalance at the start is normal, from the APU (Auxiliary Power Unit) and single-engine taxi.</li>
<li><b>Automatic detection:</b>
  <ul>
  <li><b>FUEL F.USED/FOB DISAGREE</b> (A320 family): leak upstream of the fuel metering valve.</li>
  <li><b>ENG FUEL LEAK</b> (<b>A320neo</b>): compares fuel flow between engines, so it catches leaks downstream of the metering valve.</li>
  <li>These are a safety net. Your own checks should find a leak first.</li>
  </ul></li>
</ul>
<h4>The FUEL LEAK procedure (A320 family)</h4>
<p><b>Leak confirmed: consider landing at the nearest suitable airport.</b></p>
<ol>
<li><b>Obvious engine or pylon leak</b> (spray, low N1, high FF on one side): <b>shut down that engine and do not restart it.</b></li>
<li><b>Not obvious:</b> stop transfers and isolate the tanks, then compare the depletion rate on each side.</li>
<li><b>One side depleting faster:</b> shut down that engine.
  <ul>
  <li>If the leak stops, it was the engine. Keep it shut down.</li>
  <li>If it continues, it's a <b>wing leak</b>. You may consider a restart, and may re-enable transfer on the good side. <b>Do not balance the tanks</b>, even if another procedure asks you to.</li>
  </ul></li>
<li><b>No asymmetry:</b> suspect the centre tank or APU feed. If the APU is running and there is a fuel smell, switch the APU off.</li>
</ol>
<p><b>No reversers on landing</b>: they blow fuel towards the engine intakes and hot brakes.</p>`},

{id:"baro",tag:"Altimetry",title:"Use the Correct BARO Setting for Approach",url:"https://safetyfirst.airbus.com/use-the-correct-baro-setting-for-approach/",
summary:"An A320 read back QNH 1011 instead of 1001, then flew a perfectly centred FINAL APP approach 280 ft low. It reached 6 ft RA in the go-around.",
brief:`<h4>The event (A320, RNP approach to LNAV/VNAV minima)</h4>
<ol>
<li>The ATIS gave QNH <b>1001</b>. ATC cleared the aircraft down with QNH <b>1011</b>, and the crew read back 1011 twice.</li>
<li>The aircraft levelled at 5 000 ft on 1011, about <b>280 ft below</b> the real 5 000 ft.</li>
<li>It flew FINAL APP with AP (Autopilot) and A/THR (Autothrust), in IMC (Instrument Meteorological Conditions) and rain. The <b>V/DEV (vertical deviation) indication was centred</b>, altitude/distance checks were "correct", and there was no TAWS (Terrain Awareness and Warning System) alert.</li>
<li>ATC got an MSAW (Minimum Safe Altitude Warning) at 1.5 NM. The go-around started 6 s after the DA (Decision Altitude) and the aircraft <b>reached 6 ft RA</b> (Radio Altitude).</li>
<li>The second approach used the same wrong QNH and gave another MSAW. The approach lights were on this time, so the crew corrected visually on the PAPI and landed.</li>
</ol>
<h4>Effects of a wrong QNH or QFE</h4>
<ul>
<li><b>1 hPa ≈ 28 ft</b> of barometric altitude error.</li>
<li><b>Managed vertical guidance</b> (FINAL APP, the FLS (FMS Landing System) beam built from the database) flies a path <b>parallel to the published one, shifted up or down</b>, while the V/DEV or FLS deviation indications still look centred.</li>
<li><b>Selected FPA (Flight Path Angle):</b> the descent starts from the wrong height.</li>
<li><b>Altitude/distance checks</b> use the same wrong altimeter, so they "agree".</li>
<li><b>EGPWS TCF (Terrain Clearance Floor) / T2CAS PDA (Premature Descent Alert)</b> may not trigger, because the path stays close to the published one.</li>
<li><b>Not affected:</b> ILS, GLS and SLS glideslopes (G/S mode), because they use the beam or augmented GPS. Only the intermediate segment shifts.</li>
</ul>
<h4>How to catch it</h4>
<ol>
<li><b>In descent:</b> compare the first ATC QNH with the ATIS used for briefing. If they differ significantly, confirm from all sources.</li>
<li><b>On final:</b> RA callouts arriving too early while the baro altitude still reads high above the airfield are a clue, unless the terrain before the threshold is low.</li>
</ol>
<ul>
<li><b>ALTSM</b> (Altimeter Setting Monitoring, on some Honeywell EGPWS standards) compares the Captain's baro altitude with GPS altitude and calls <b>"ALTIMETER SETTING"</b>. A later version adds a flashing QNH on the PFD and protects QFE.</li>
</ul>`},

{id:"xls",tag:"xLS / FLS",title:"Let's Use xLS",url:"https://safetyfirst.airbus.com/lets-use-xls/",
summary:"Fly every straight-in approach like an ILS. How FLS, SLS and GLS build their virtual beams, what FLS depends on, and why it beats FINAL APP for straight-ins.",
brief:`<h4>Why</h4>
<p>Non-precision approaches are a small share of approaches, but account for <b>50%</b> of approach CFIT (Controlled Flight Into Terrain) and runway-undershoot accidents. The usual factors are lost situational awareness, difficulty managing the vertical path, and high workload. xLS gives every <b>straight-in</b> approach the same ILS-like interface, guidance and procedure.</p>
<h4>The four functions</h4>
<ul>
<li><b>ILS</b>: the real beam.</li>
<li><b>GLS</b> (GBAS Landing System, ground-based augmentation): CAT I, and CAT II on the A320 family, with autoland. The beam comes from the ground station by VHF and can be tuned manually on the RMP (Radio Management Panel).</li>
<li><b>SLS</b> (SBAS Landing System, satellite-based augmentation): RNP to <b>LPV</b> minima down to 200 ft. Uses G/S and LOC modes, with FLS as the backup to LNAV/VNAV minima.</li>
<li><b>FLS</b> (FMS Landing System): for VOR, NDB, LOC, LOC B/C (back course) and RNP to LNAV or LNAV/VNAV minima.</li>
<li>FINAL APP remains for <b>curved</b> approaches.</li>
</ul>
<h4>How FLS works</h4>
<ul>
<li>The MMR (Multi-Mode Receiver) builds a <b>virtual beam</b> from an <b>anchor point</b> (usually the threshold), the course and the slope, all from the FMS navigation database.</li>
<li><b>Lateral deviation</b> uses the FMS position (GPS/IRS, IRS/radio aids or IRS only). <b>Vertical deviation uses baro altitude</b>.</li>
<li><b>Cold temperature:</b> FLS compensates the slope using the temperature entered on PERF APPR when OAT (Outside Air Temperature) is below ISA.</li>
<li>Modes are <b>F-LOC and F-G/S</b>, which engage and disengage like LOC and G/S. The PFD shows <b>double diamonds</b> as a reminder that this is not precision performance.</li>
<li><b>Correct deviations depend on:</b> the correct QNH or QFE, the correct temperature on PERF APPR, and good position accuracy.</li>
</ul>
<h4>FLS advantages over FINAL APP for straight-ins</h4>
<ul>
<li>ILS-like interface and procedure.</li>
<li>Capture doesn't depend on flight plan sequencing, so it handles <b>vectoring</b>.</li>
<li>Usable <b>below the published minimum temperature</b> for LNAV/VNAV, because of the cold-temperature compensation. FINAL APP isn't compensated.</li>
<li>Managed vertical guidance with <b>F-G/S + LOC</b> for LOC-only and ILS approaches with the G/S out, instead of FPA (Flight Path Angle) + LOC.</li>
</ul>
<h4>How to fly it</h4>
<ol>
<li>Select the approach on the FMS ARRIVAL page; the function selects automatically. Check it on PERF APPR.</li>
<li>Press <b>LS</b> to show the deviations on the PFD (Primary Flight Display) and ND (Navigation Display).</li>
<li>Once cleared and on an intercept heading with LOC deviation available, press <b>APPR</b>:
  <ul>
  <li>F-G/S | F-LOC for VOR, NDB and RNP LNAV or LNAV/VNAV.</li>
  <li>F-G/S | LOC for LOC-only or ILS with the G/S out.</li>
  <li>G/S | LOC for GLS and SLS.</li>
  </ul></li>
<li>Check the <b>Aircraft Configuration Summary</b> in the FCOM/QRH for which xLS functions your aircraft has. FLS is standard on A320 family aircraft built from 2022.</li>
</ol>`},

{id:"gs",tag:"ILS capture",title:"Lining Up with the Correct Glide Slope",url:"https://safetyfirst.airbus.com/lining-up-with-the-correct-glide-slope/",
summary:"Secondary ILS glideslopes at 9°, 15° and 21°, some of them inverted, can make the AP pitch 13° nose down or pitch up. Three real scenarios and how the SOP prevents each.",
brief:`<h4>Secondary glideslopes</h4>
<ul>
<li>The ILS antenna design inevitably creates <b>secondary glideslopes above the main one</b>. For a 3° glideslope they are at about <b>9°, 15° and 21°</b>, every 6°.</li>
<li>With some antennas, alternate ones (9°, 21°…) are <b>inverted</b>: the PFD shows you above the glideslope when you are below it, and vice versa. You cannot tell which type an airport has.</li>
<li>At the <b>boundaries</b> between glideslopes (about 6°, 12°, 18°), the deviation can jump or briefly read zero. With APPR armed, that can trigger a false <b>G/S*</b> capture.</li>
<li>The ICAO-protected capture area is within <b>10 NM</b> of the threshold, <b>±8°</b> of the centreline, and <b>0.3θ to 1.75θ</b> vertically (θ = glidepath angle).</li>
</ul>
<h4>Case 1: pitch down</h4>
<ol>
<li>Intercepting from above in <b>OP DES</b>, the crew pressed APPR while well above the main glideslope, in the 9° zone. The PFD showed the glideslope below, as expected.</li>
<li>Crossing the 6° boundary, a false zero engaged G/S*. The AP (Autopilot) pitched down to the <b>−13° limit and disconnected</b>, and the crew went around.</li>
</ol>
<p><b>Prevention:</b> before pressing APPR from above, check you are below the 6° boundary: <b>height (ft AAL) &lt; 6 × distance (NM) × 100</b>. Use the FCOM glide-interception-from-above technique: <b>APPR, FCU altitude set above the aircraft, then V/S</b> (Vertical Speed), not OP DES.</p>
<h4>Case 2: pitch up</h4>
<ol>
<li>APPR was pressed, but the <b>FCU altitude was not set above the aircraft</b>. The aircraft levelled off before capturing.</li>
<li>It drifted up into the inverted 9° glideslope. G/S* engaged there and the AP <b>pitched up</b>. The crew went around.</li>
</ol>
<p><b>Prevention:</b> after APPR, set the FCU altitude above the aircraft.</p>
<h4>Case 3: discontinued approach</h4>
<ol>
<li>ATC stopped the descent. The crew levelled off with V/S but <b>left G/S armed</b>.</li>
<li>Same result as case 2: capture of the inverted 9° glideslope and a pitch-up.</li>
</ol>
<p><b>Prevention:</b> after "CANCEL APPROACH", press <b>APPR to disarm</b>, per the discontinued approach SOP.</p>
<h4>Checks and protections</h4>
<ul>
<li><b>From below:</b> check you're on the right glideslope with <b>height ≈ 3 × distance × 100</b>.</li>
<li><b>A320neo family:</b> a flight path angle protection (limited to between 0° and −6°) in both G/S* and G/S modes.</li>
<li><b>A320ceo:</b> not yet protected at the time of the article.</li>
</ul>`},

{id:"unstab",tag:"Stabilisation",title:"Prevention of Unstable Approaches",url:"https://safetyfirst.airbus.com/prevention-of-unstable-approaches/",
summary:"Short-cuts, quiet airspace and late changes still drive unstable approaches. How to see one coming early, the FCOM stabilisation criteria, and staying go-around minded.",
brief:`<h4>Threats</h4>
<ul>
<li>In quiet airspace, <b>ATC may give fewer speed and heading instructions and more direct routings</b>, so the track miles disappear.</li>
<li>Late changes and a "direct to" from ATC.</li>
<li>Low recency and distraction.</li>
</ul>
<h4>Preparation</h4>
<ul>
<li>Manage energy from the TOD (Top of Descent) using the FMS (Flight Management System) profile in managed modes.</li>
<li><b>Brief the worst case</b>: a late direct to that cuts track miles sharply. Agree the strategy and task sharing, as part of TEM (Threat and Error Management).</li>
<li><b>Work with ATC:</b> say "unable" when you are, and ask for more track miles.</li>
<li><b>Approach speed technique:</b>
  <ul>
  <li><b>Decelerated approach</b> is standard with xLS or FINAL APP.</li>
  <li><b>Early stabilised approach</b> is recommended with selected guidance (TRK/FPA or LOC/FPA), a steep glidepath, or a low intermediate segment and close-in FDP (Final Descent Point). Enter <b>VAPP as a speed constraint at the FDP</b>.</li>
  </ul></li>
</ul>
<h4>Detect it early</h4>
<ul>
<li><b>V/DEV</b> (vertical deviation) on the PROG page and PFD (Primary Flight Display) is useful even when vectored near the route.</li>
<li><b>Sequence the flight plan</b> when vectored, so predictions stay meaningful and you can return to managed modes.</li>
<li><b>Energy circle</b> in HDG/TRK within 180 NM. If the airfield is inside it, you have too much energy.</li>
<li>Put the <b>threshold in the PROG BRG/DIST field</b> for the shortest possible distance to go. Rule of thumb: height to lose (FL) ≈ 3 × distance.</li>
<li><b>CDA</b> (Continuous Descent Approach) pseudo-waypoints, if fitted, show the latest point to configure.</li>
<li><b>Speak up early</b>: either pilot raises any concern before the gate.</li>
</ul>
<h4>Interrupting the approach</h4>
<ul>
<li>At or above the FCU altitude, consider a <b>discontinued approach</b>. Below it, <b>go around</b>.</li>
<li><b>Soft go-around</b> (if fitted) limits acceleration when light.</li>
</ul>
<h4>The stabilisation gate</h4>
<ul>
<li><b>FCOM criteria:</b> on the lateral and vertical path, in the landing configuration, at VAPP with thrust stabilised, and no excessive deviation.</li>
<li><b>Height:</b> typically 1 000 ft AAL (Above Aerodrome Level) in IMC (Instrument Meteorological Conditions) and 500 ft in VMC (Visual Meteorological Conditions), per operator policy.</li>
<li><b>In IMC</b>, speed and thrust may stabilise later if policy allows, provided the aircraft is decelerating towards VAPP and is stable <b>by 500 ft</b>.</li>
<li>Not met: go around, unless only small corrections are needed. Operators should have a <b>non-punitive go-around policy</b>.</li>
<li><b>Late destabilisation:</b> the PM calls out deviations, and the PF corrects promptly or goes around.</li>
</ul>`},

{id:"rev",tag:"Reversers",title:"Thrust Reverser Selection is a Decision to Stop",url:"https://safetyfirst.airbus.com/thrust-reverser-selection-is-a-decision-to-stop/",
summary:"An A320 (CFM56) went around after selecting reverse. One reverser stayed deployed, the aircraft veered 20° and crossed the runway edge at 1 ft. It happens about once a month across the fleet.",
brief:`<h4>The event (A320, CFM56)</h4>
<ol>
<li>ILS in CONF 3, with a 25 kt gusting crosswind. Flare at 30 ft, decrab at 24 ft, idle at 11 ft.</li>
<li>The left main gear touched briefly and the PF selected <b>MAX REV</b> before both gears were compressed. The reversers started to deploy once both main gears were down.</li>
<li>The crew decided to <b>go around</b>, selecting TOGA (Takeoff/Go-Around) and CONF 2.</li>
<li>ENG 2 spooled up. <b>ENG 1 stayed at idle with REV still displayed</b>. The aircraft veered left, and ENG 1 REVERSE UNLOCKED appeared.</li>
<li>The <b>beta target was flagged</b>. The aircraft crossed the <b>left runway edge at 1 ft</b> and climbed out about 20° off the runway heading, only reaching 1 000 ft/min once the gear was up and the pitch at 12.5°.</li>
<li>ENG 1 was shut down at 1 260 ft. A single-engine landing followed. At the gate, three of the four blocker doors were still deployed.</li>
</ol>
<h4>Why it happened (CFM56 logic)</h4>
<ul>
<li>When the levers leave the REV sector, each engine's ECU (Electronic Control Unit) decides "ground" or "flight" from its own LGCIU (Landing Gear Control and Interface Unit) side. It only commands <b>stow</b> if the status is "ground".</li>
<li>A slight lever misalignment and the timing between sides, plus a <b>left main gear bounce</b>, gave ECU 1 "flight" and ECU 2 "ground".</li>
<li>So ENG 1 never stowed, and the auto-idle protection held it at idle.</li>
<li>The beta target logic flags it when the reversers are not stowed and auto-idle is active. It returned once ENG 1 was shut down.</li>
<li>Only aircraft with <b>CFM56 engines</b> (A320, A340) are affected. Other engine types, including the LEAP, are not. The SOP applies to everyone regardless.</li>
<li>Fleet data from 3.4 million flights showed <b>about one go-around a month after reverse selection</b>.</li>
</ul>
<h4>The rules</h4>
<ul>
<li><b>Select reverse immediately after touchdown, not before.</b></li>
<li><b>Once reverse is selected, a full-stop landing is mandatory.</b> The FCTM says the PF must not start a go-around after selecting the reversers.</li>
<li><b>Fixes:</b> a CFM56-5B ECU update with improved stow logic (2025), an EIS (Electronic Instrument System) change to keep the beta target with the doors unlocked, and the full-stop rule moved into the main FCOM SOP text.</li>
</ul>`},

{id:"rops",tag:"Overrun",title:"Further Preventing Runway Overrun (ROPS)",url:"https://safetyfirst.airbus.com/further-preventing-runway-overrun/",
summary:"Runway excursion is the leading cause of hull losses. How ROW and ROP work, the Step 2, 2+ and 3 alerts, and exactly what each one requires you to do.",
brief:`<h4>Why</h4>
<p>59% of accidents in the last 20 years happened during landing. Runway excursion is the <b>top cause of hull losses</b>. A ROAAS (Runway Overrun Awareness and Alerting System) is mandatory on aircraft registered from 2026 (EASA: from July 2026). ROPS (Runway Overrun Prevention System) Step 2+ and Step 3 comply.</p>
<h4>The two functions</h4>
<ul>
<li><b>ROW (Runway Overrun Warning)</b> works in the air down to touchdown. It continuously compares the predicted landing distance with the LDA (Landing Distance Available), or the runway remaining once past the threshold. Alerts start <b>below 400 ft</b>.</li>
<li><b>ROP (Runway Overrun Protection)</b> works on the ground. It compares the stopping distance needed at the current deceleration with the runway remaining, down to <b>30 kt</b>.</li>
</ul>
<h4>The standards</h4>
<ul>
<li><b>Step 2:</b> works with autobrake or manual braking, for dry and wet runways.
  <ul>
  <li>Amber <b>IF WET: RUNWAY TOO SHORT</b> if the wet distance exceeds the LDA.</li>
  <li><b>RUNWAY TOO SHORT</b> between 400 and 200 ft if the dry distance exceeds it, plus the aural <b>"RUNWAY TOO SHORT!"</b> below 200 ft.</li>
  </ul></li>
<li><b>Step 2+:</b> adds a <b>DRY/WET selector</b> (set in descent preparation, shown on the ND (Navigation Display)), so only the relevant alert appears: amber below 400 ft, red with aural below 200 ft. Also adds a ROW/ROP pushbutton to switch it off.</li>
<li><b>Step 3:</b> covers <b>all runway conditions</b>. Select the RWYCC (runway condition code) or braking action on the MCDU (Multipurpose Control and Display Unit) PERF APPR page, under RWY COND FOR ROW/ROP. It adds a <b>pre-ROP "SET MAX REVERSE"</b> reminder on a non-dry runway, and automatic downgrading of the runway condition if braking is poorer than expected. On the A320 family it is switched off via MCDU SURV CONTROLS.</li>
</ul>
<h4>ROP alerts on the ground</h4>
<ul>
<li>Red <b>MAX BRAKING MAX REVERSE</b> with <b>"BRAKE! MAX BRAKING! MAX BRAKING!"</b> until full pedal braking is applied.</li>
<li>Then <b>"SET MAX REVERSE!"</b> until max reverse is set.</li>
<li>At <b>80 kt</b>, <b>"KEEP MAX REVERSE"</b>, so you don't go to REV IDLE at 70 kt.</li>
</ul>
<h4>Crew actions</h4>
<ul>
<li><b>Preparation:</b> check the QRH (Quick Reference Handbook) Aircraft Configuration Summary to see whether ROPS is fitted, then set DRY/WET (Step 2+) or the runway condition (Step 3).</li>
<li><b>Amber IF WET: RUNWAY TOO SHORT</b> (Step 2): go around unless the runway is dry.</li>
<li><b>Amber RUNWAY TOO SHORT</b> (Step 2+ or 3): consider a go-around.</li>
<li><b>Red RUNWAY TOO SHORT: go around immediately.</b></li>
<li><b>On the ground:</b> apply and keep maximum braking and maximum reverse.</li>
</ul>`},

{id:"brakes",tag:"Taxi-in",title:"Take Care of Your Brakes",url:"https://safetyfirst.airbus.com/take-care-of-your-brakes/",
summary:"An oxidised pressure plate ruptured, a piston twisted out and hydraulic fluid smoked on a 400 °C brake. How wear and oxidation degrade braking, and how your taxi and landing technique affects them.",
brief:`<h4>The event (A330)</h4>
<p>During taxi-in there was a loud noise. On stand there was smoke from the left main gear and wheel 6 was at <b>400 °C</b>. A brake piston had <b>twisted out of its housing</b> and was leaking hydraulic fluid onto hot parts. The cause was a heavily <b>oxidised pressure plate</b> that ruptured under brake pressure.</p>
<h4>Wear and oxidation</h4>
<ul>
<li><b>Wear</b> is the loss of disc thickness through friction. Braking is guaranteed only down to the point where the <b>wear pin is flush with the reference surface</b>. Below that, the pistons can't reach far enough and there is less heat-sink mass, which raises the overrun and brake fire risk in a high-energy RTO (Rejected Takeoff). Typical wear is about 1 mm per 20 cycles.</li>
<li><b>Thermal oxidation</b> is the main cause of degradation. It comes from high brake temperatures after landing and in taxi, and the middle discs suffer most. Worn brakes run hotter, which makes it worse.</li>
<li><b>Catalytic oxidation</b> comes from potassium or sodium in de-icing and cleaning fluids. It mostly affects the outer discs and pressure plate, and carries on long after winter.</li>
<li>Thermal oxidation reports are <b>increasing on the A320 family</b>, linked to CONF 3 landings with reverse at idle to save fuel.</li>
</ul>
<h4>Flight crew good practice</h4>
<ul>
<li><b>Walkaround:</b> check the wear pins. If only a few millimetres are left, tell maintenance.</li>
<li><b>Taxi:</b> keep thrust at idle. On long straights with no constraints, let the speed build to <b>30 kt</b>, then make <b>one smooth application down to 10 kt</b>. Single-engine taxi also reduces brake use.</li>
<li><b>Landing:</b>
  <ul>
  <li><b>CONF FULL</b> for a lower approach speed and less energy.</li>
  <li><b>Autobrake</b> (LO where suitable) for a single, optimised brake application. The updated A320 LO mode (since 2018) uses 2 m/s² after 2 s, instead of 1.7 m/s² after 4 s.</li>
  <li><b>Retard on time</b> (20 ft, and by touchdown at the latest) so A/THR (Autothrust) isn't adding thrust after the flare.</li>
  <li><b>Use reverse</b>: it takes energy off the brakes, especially on short runways.</li>
  <li><b>Take the next exit</b> rather than braking hard for an early one.</li>
  </ul></li>
<li><b>Use the brake fans</b> (if fitted) to reduce time at high temperature.</li>
</ul>`}
);

{id:"tailga",tag:"Go-around",title:"Preventing Tailstrike During Go-around near the Ground",url:"https://safetyfirst.airbus.com/preventing-tailstrike-during-go-around-near-the-ground/",
summary:"Two go-arounds started at or after touchdown (A320 bounce, A330 hard landing) ended in tailstrikes. How to go around near the ground without striking the tail.",
brief:`<h4>Case study 1: A320, bounce, go-around, tailstrike</h4>
<p>RNAV approach, good weather, 10 kt headwind, CONF FULL, VAPP 137 kt. The F/O (PF) disconnected the AP at 930 ft RA, A/THR on, stabilised at 500 ft. Step through it, and answer at the two decision points.</p>
<div class="replay" data-replay="tailga1"></div>
<p><b>Why it bounced:</b> the 1/3 nose-down input and the wind change at 80 ft cost lift, so V/S reached −800 ft/min at 40 ft. The flare cut it to −350 ft/min, but the energy returned through the shock absorbers plus the lift from +9° pitch bounced the aircraft.</p>
<p><b>Why the tail struck:</b> the ground spoilers extended during the bounce, so it touched down again. The PF's continuous nose-up after the first touchdown, then full nose-up with TOGA, took the pitch from +9° to +12.7°.</p>
<h4>Case study 2: A330, hard landing, dual input</h4>
<ul>
<li>Gusty ILS, VAPP 139 kt. From 90 ft the PF alternated nose-down and nose-up: pitch fell from +5.5° to +2.5° and V/S grew from −550 to −850 ft/min. A late flare at 30 ft gave a hard landing at +7°.</li>
<li>The PF held ½ nose-up for 2 s, then TOGA with <b>full nose-up</b> while the speed was still falling. The Captain briefly pushed 1/3 nose-down without the priority pushbutton: "DUAL INPUT".</li>
<li>Tailstrike at +10.9° and 116 kt (VAPP − 23 kt).</li>
</ul>
<h4>The numbers</h4><figure class="fig"><svg viewBox="0 0 600 150" role="img" aria-label="Tailstrikes reported to Airbus by phase, January 2022 to September 2024: takeoff 5 (10%), landing 23 (47%), go-around near the ground 21 (43%).">
<text x="0" y="16" fill="#8c9aab" font-size="12">49 TAILSTRIKES · JAN 2022 – SEP 2024</text>
<g font-size="13"><text x="0" y="52" fill="#e8edf3">Takeoff</text><rect x="190" y="38" width="35" height="20" fill="#3fc8f0"/><text x="232" y="53" fill="#e8edf3">5 · 10%</text>
<text x="0" y="90" fill="#e8edf3">Landing</text><rect x="190" y="76" width="322" height="20" fill="#3fc8f0"/><text x="519" y="91" fill="#e8edf3">23 · 47%</text>
<text x="0" y="128" fill="#ffb326">Go-around near ground</text><rect x="190" y="114" width="294" height="20" fill="#ffb326"/><text x="491" y="129" fill="#ffb326">21 · 43%</text></g>
</svg><figcaption>Nearly half of recent tailstrikes happened in a go-around near the ground. Drawn from the figures in Safety First #39.</figcaption></figure>
<h4>Safe go-around near the ground</h4><figure class="fig"><svg viewBox="0 90 640 150" role="img" aria-label="Go-around near the ground in four steps: flare, TOGA with no excessive nose-up, gear contact accepted and pitch held until VAPP, then rotate and clean up once established.">
<line x1="10" y1="200" x2="630" y2="200" stroke="#33435a" stroke-width="2"/>
<path d="M14 120 C 120 150 170 188 230 196 C 290 202 330 200 370 198 C 450 186 520 130 626 70" fill="none" stroke="#3ee08a" stroke-width="3"/>
<g fill="#e8edf3" font-size="12">
<circle cx="120" cy="150" r="5" fill="#3fc8f0"/><text x="104" y="226" fill="#3fc8f0">1</text>
<circle cx="230" cy="196" r="5" fill="#3fc8f0"/><text x="225" y="226" fill="#3fc8f0">2</text>
<circle cx="330" cy="200" r="5" fill="#ffb326"/><text x="325" y="226" fill="#ffb326">3</text>
<circle cx="520" cy="130" r="5" fill="#3fc8f0"/><text x="515" y="226" fill="#3fc8f0">4</text>
</g>
</svg><ol class="fig-steps">
<li><b class="c-c">Flare</b>Go-around called late in the flare.</li>
<li><b class="c-c">TOGA</b>No excessive nose-up. PF and PM monitor the pitch (PM: "PITCH").</li>
<li><b class="c-a">Gear contact</b>Acceptable: do not pull to avoid it. Idle and low energy: hold the pitch until VAPP.</li>
<li><b class="c-c">Established</b>Then rotate and the PF adjusts the pitch. PM: one flap step, then gear up.</li>
</ol><figcaption>Our own diagram of the technique in Safety First #39. During a bounce: keep the pitch and let a second touchdown happen.</figcaption></figure>
<ul>
<li><b>Monitor the pitch, both pilots.</b> The PM calls "PITCH" at the SOP value. Avoid full back stick: a high rotation rate was common to many of these events.</li>
<li><b>Gear contact may happen.</b> Do not try to avoid it by pitching up more.</li>
<li><b>Manage energy.</b> If the engines were at idle and the energy is low, wait for <b>at least VAPP</b> before rotating: the engines need a few seconds to spool up.</li>
<li><b>Go-around during a bounce:</b> keep the pitch and allow a second touchdown. Then adjust the pitch.</li>
<li><b>Clean up only when established:</b> then one flap step and the gear. Earlier retraction needs more pitch close to the ground.</li>
<li><b>One pilot flies.</b> To take over: "I have control", then press and hold the sidestick priority pushbutton. Inputs add algebraically otherwise, and a same-direction dual input can make the rotation worse.</li>
<li><b>Reversers selected means full stop.</b> The SOP forbids a go-around after reverse selection: the speed has decayed, and stowing delays the spool-up.</li>
<li><b>Once a go-around is started, complete it.</b></li>
</ul>
<p class="take">Near the ground: no big pull, accept the gear contact, wait for VAPP, then fly away and clean up.</p>`}
);

{id:"seat",tag:"Cockpit prep",title:"Are You Properly Seated?",url:"https://safetyfirst.airbus.com/are-you-properly-seated/",
summary:"The cockpit is built around one eye position. Sit off it and you lose part of the view outside, part of the panel, or full control travel.",
brief:`<h4>The eye reference point</h4>
<p>Certification (CS/FAR 25.773 and 25.777) requires a cockpit that pilots from 1.58 m to 1.91 m can use, with a means of finding the best eye position. The windows, controls, displays and instruments are all placed around that <b>eye reference point</b>. The <b>eye reference indicator</b> on the centre windshield post shows it: the white ball must be hidden behind the red one.</p>
<div data-slider="seat"></div>
<h4>Too low or too high</h4>
<ul>
<li><b>Too low:</b> overhead controls are harder to reach; on the ground, less awareness near airbridges and vehicles; on final, the flight path angle can look wrong; the glareshield cuts the view ahead, so the <b>cut-off angle</b> and the <b>visual segment</b> shrink. In low visibility that makes a go-around more likely.</li>
<li><b>Too high:</b> the glareshield hides the top of the <b>PFD and ND</b>, the flight path angle can look wrong, and full rudder travel is harder to reach.</li>
<li>Late in a long flight, fatigue makes you sink. <b>Re-adjust before the approach.</b> In cruise you may sit off the point for comfort, but keep every control in reach and the panel in view.</li>
</ul>
<h4>Adjust before the aircraft moves (before pushback or start)</h4>
<ol><li><b>Seat:</b> fore/aft and height to the eye reference indicator; check the top of the PFD and ND is not hidden.</li>
<li><b>Armrest:</b> the hand grips the sidestick with a straight wrist and the forearm resting; only the hand and fingers move. A poor armrest gives over-reaction and excessive inputs, and steadies the arm in turbulence.</li>
<li><b>Pedals:</b> full rudder travel and full manual braking (engine failure, crosswind, rejected take-off). Note the armrest and pedal indicator positions for next time.</li></ol>
<p class="take">Eyes on the reference point, wrist straight, full pedal travel: before the aircraft moves, and again before the approach.</p>`},
{id:"iceridge",tag:"Walkaround",title:"Look out for Ice Ridges on the Lower Nose Fuselage",url:"https://safetyfirst.airbus.com/look-out-for-ice-ridges-on-the-lower-nose-fuselage/",
summary:"A de-iced A320 with an iced lower nose lost Normal law, the A/THR, FDs and AP at lift-off. Thin ice ridges ahead of the pitot probes made the speeds read low.",
brief:`<h4>The event</h4>
<div data-replay="iceridge"></div>
<div data-fig="iceridge_bars"></div>
<h4>The phenomenon</h4>
<div data-fig="iceridge_view"></div>
<ul>
<li>Ridges form during a <b>long stay on the ground in the cold</b>: most events were on the first flight of the day. Snow melting on the heated windshield and refreezing below it is another source.</li>
<li>One large ridge, or several thin ones, disturbs the airflow into the probes and the ADR airspeed reads <b>lower than the real speed</b>. They can stay on for the whole flight.</li>
<li>A320 family: one probe affected, no system loss. <b>Two or three</b> affected and the flight controls and auto flight may reject all three ADRs: no characteristic speeds, AP, FD, A/THR or rudder travel limiter, and <b>Alternate law</b>.</li>
</ul>
<h4>Prevent it</h4>
<ul>
<li>Walkaround in cold weather: check the <b>lower nose fuselage ahead of the air data probes</b>. It is hard to see on a white fuselage at night.</li>
<li>Ridges, even thin ones: ask the de-icing crew to remove them. Thin hoarfrost on the top of the fuselage is allowed; ridges on the lower nose are not.</li>
<li>De-icing fluid is sprayed from rear to front, never straight onto the static ports or AOA probes.</li>
<li>Any airspeed discrepancy: apply <b>UNRELIABLE SPEED INDICATION</b>.</li>
</ul>`},
{id:"pitot",tag:"Walkaround",title:"Pitot Probe Performance Covered On the Ground",url:"https://safetyfirst.airbus.com/pitot-probe-performance-covered-on-the-ground/",
summary:"Wasps partly blocked an A330 pitot in under two hours on the ground. Why covers matter even on short turnarounds, and what the crew can catch.",
brief:`<h4>The event</h4>
<div data-replay="pitot"></div>
<h4>How fast a probe can block</h4>
<div data-fig="pitot_time"></div>
<p>Sand, dust, dirt and insects are the main cause of rejected take-offs and turn-backs for airspeed discrepancy below FL250.</p>
<div data-fig="pitot_principle"></div>
<h4>What helps</h4>
<ul>
<li><b>Approved Airbus covers</b> (other manufacturers' covers may not fit). They are in the flight kit; fit them about <b>30 minutes</b> after engine shutdown.</li>
<li>Operators assess each airport (wildlife plans, wasp NOTAMs) and may require covers there <b>whatever the turnaround time</b>.</li>
<li><b>Walkaround:</b> look carefully at each pitot probe, check every cover is off and the probe is undamaged.</li>
<li><b>Take-off:</b> scan the speeds; the PF cross-checks the airspeed at <b>100 kt</b>. A blocked probe gives a low, fluctuating or flagged speed on one side.</li>
<li>Report every obstruction to the airport and Airbus.</li>
</ul>
<div data-cards="pitot"></div>`},
{id:"oeb",tag:"Briefing",title:"Mind the OEBs!",url:"https://safetyfirst.airbus.com/mind-the-oebs/",
summary:"An OEB is a temporary procedure for specific conditions. Applying one that does not apply to your aircraft, or without its entry conditions, is a hazard too.",
brief:`<h4>What an OEB is</h4>
<p>An Operations Engineering Bulletin is a <b>temporary</b> procedure, applied only in specific conditions, until a permanent fix is installed. On the A320 family they are in the QRH.</p>
<div data-fig="oeb_types"></div>
<h4>What the crew must know before each flight</h4>
<ul>
<li><b>Which OEBs apply to this aircraft.</b> Crews flying mixed fleets have applied OEBs that did not apply to the aircraft they were flying. Review them in the <b>preliminary cockpit preparation of every flight</b>, even in transit, with the <b>LEOEB</b> (List of Effective OEBs) in the QRH: only this aircraft's OEBs, red first, with their ECAM entries.</li>
<li><b>The entry conditions:</b> an ECAM alert or a defined event. Apply an OEB only when they are confirmed.</li>
<li><b>The effects</b> on the cockpit and systems, from the explanation attached to each OEB.</li>
<li><b>OEB reminder:</b> the ECAM shows <b>REFER TO QRH PROC</b> in place of a procedure affected by an OEB.</li>
</ul>
<h4>An OEB's life</h4>
<div data-fig="oeb_life"></div>
<div data-cards="oeb"></div>`},
{id:"egt",tag:"Engine start",title:"Prevention of EGT Overlimit Events",url:"https://safetyfirst.airbus.com/prevention-of-egt-overlimit-events/",
summary:"An A321 had both EGTs over the limit at 90 ft on a hot day. What raises EGT, how crews can gain margin, and what to do when it happens.",
brief:`<h4>The event</h4>
<div data-replay="egt"></div>
<h4>What raises the EGT</h4>
<ul>
<li><b>OAT and altitude:</b> each extra 1 °C of OAT costs about 3 °C of EGT for the same take-off thrust.</li>
<li><b>Bleed demand:</b> packs and anti-ice. <b>Contamination:</b> dirt, pollution. <b>A cold engine:</b> EGT about equal to OAT before start gives a higher peak at take-off.</li>
<li><b>Wear:</b> eroded blades and worn seals. The EGT margin shrinks over time, which is why operators ask for regular TOGA take-offs to measure it.</li>
<li>The redline is <b>not a hard limit</b>: above it the engine still gives thrust, at the cost of wear. Hence an amber caution, not a red warning.</li>
</ul>
<h4>What the crew can do</h4>
<ul><li>Extend the <b>warm-up</b> (2 to 5 minutes usual; 10 minutes can save about 10 °C).</li>
<li>Use <b>reduced thrust</b> (FLEX or derate). Or take off with <b>packs OFF</b>, or with <b>APU BLEED ON</b> when it is too hot for packs off.</li></ul>
<h4>If it happens at take-off</h4>
<div data-fig="egt_zones"></div>
<p>Report every overlimit and make a logbook entry.</p>
<div data-cards="egt"></div>`},
{id:"turn180",tag:"Backtrack",title:"180° Turns on Runway",url:"https://safetyfirst.airbus.com/180-turns-on-runway/",
summary:"More than 20 runway excursions in U-turns in ten years, on dry runways and with experienced crews. The technique that keeps the wheels on the pavement.",
brief:`<h4>Not just for the inexperienced</h4>
<div data-fig="turn180_stats"></div>
<p>A worn or freshly painted surface can be as slippery as contamination: painted threshold marks fill the texture or hold water after the rest has dried.</p>
<h4>The technique, step by step</h4>
<div data-replay="turn180"></div>
<h4>Divergence angle (A330-300 example)</h4>
<div class="tblw"><table class="tbl"><thead><tr><th>Divergence</th><th>Width needed, 95% steering</th><th>Width needed, 80% steering</th></tr></thead>
<tbody><tr><td>10°</td><td>56.2 m</td><td>65.6 m</td></tr><tr><td>20° (FCOM)</td><td>56.4 m</td><td>65.7 m</td></tr><tr><td>40°</td><td>58.1 m</td><td>67.4 m</td></tr></tbody></table></div>
<p>Too little divergence and the main gear can leave the runway as the turn starts; too much widens the turn. Using less steering costs far more width than the angle does.</p>
<p><b>A320 family:</b> the braked pivot turn is commonly used without adverse effect on the gear (unlike the larger types).</p>
<p class="take">Check the width, steady at 5 to 10 kt, start over the edge, progressive full tiller, release it before you stop, and if in doubt, stop and call a tug.</p>`}
);

const FILES_BY_ID = Object.fromEntries(FILES.map(f=>[f.id,f]));

/* Safety First issue for each stop, from the magazines in jonfrance78-byte/a320-references.
   altn, wb and ws are older than #20 and keep their website link only. */
const ISSUES = {fuel:"#20, July 2015",clb:"#20, July 2015",radar:"#22, July 2016",desc:"#24, July 2017",

  mel:"#25, January 2018",thr:"#27, January 2019",gnss:"#29, January 2020",tos:"#29, January 2020",turb:"#29, January 2020",park:"#29, January 2020",
  flare:"#31, January 2021",unstab:"#31, January 2021",rot:"#31, January 2021",uas:"#32, July 2021",reset:"#32, July 2021",
  tcas:"#33, January 2022",gs:"#33, January 2022",brakes:"#35, January 2023",baro:"#35, January 2023",gaclean:"#36, July 2023",rev:"#36, July 2023",
  tailga:"#39, January 2025",seat:"#25, January 2018",iceridge:"#26, July 2018",pitot:"#22, July 2016",oeb:"#30, July 2020",egt:"#34, July 2022",turn180:"#22, July 2016",idg:"#40, July 2025",xls:"#40, July 2025",fleak:"#41, January 2026",rops:"#41, January 2026"};
Object.keys(ISSUES).forEach(id=>{ FILES_BY_ID[id].issue = ISSUES[id]; });

/* Gate-to-gate order: each Safety First file is a stop on one flight */

  {id:"egt",    phase:"Engine start & taxi",step:"Engine start and warm-up"},
  {id:"reset",  phase:"Engine start & taxi",step:"Faults at engine start and taxi"},
  {id:"turn180",phase:"Engine start & taxi",step:"Backtrack and U-turn"},
  {id:"tos",    phase:"Engine start & taxi",step:"Takeoff data checks and line-up"},
  {id:"thr",    phase:"Takeoff",            step:"Setting takeoff thrust"},

  {id:"tcas",   phase:"Climb",              step:"Traffic in the climb"},

  {id:"fleak",  phase:"Cruise",             step:"En-route fuel checks"},

  {id:"baro",   phase:"Descent",            step:"Descent clearance and QNH"},
  {id:"desc",   phase:"Descent",            step:"Descent and approach energy"},

Q.push(
/* fuel */
{id:"sf-fuel-1",s:"sf",t:"fuel",q:"What are the three sources of fuel quantity information on the A320 family, and which one is fully independent of the FQI?",
a:`<ul><li><b>FQI</b> (Fuel Quantity Indication): capacitance probes measure fuel volume, and the FQIC (FQI Computer) converts it to mass using measured density.</li><li><b>Fuel Used</b>: from the engine fuel flow meters, integrated by the FADEC (Full Authority Digital Engine Control).</li><li><b>Low-level sensors</b>: three per wing tank. They are fully independent of the FQI and give a physical wet/dry signal rather than a calculated quantity.</li></ul>`,
src:"Safety First: Fuel Monitoring on A320 Family Aircraft"},
{id:"sf-fuel-2",s:"sf",t:"fuel",q:"How does a wing tank LO LVL alert trigger, what quantity does it represent, and what is left if both sides trigger?",
a:`<p>Each sensor goes dry at about 750 kg in that wing tank. The alert triggers when 2 sensors in the same tank stay dry for more than 30 s. The threshold is sized to cover 30 min at 1 500 ft (about 1 200 kg). If both sides trigger, about 1 500 kg remains in total.</p><p>The low-level sensing is not shown on the SD (System Display) page, so a normal-looking FUEL page does not make the alert spurious.</p>`,
src:"Safety First: Fuel Monitoring on A320 Family Aircraft; FCOM DSC-28"},
{id:"sf-fuel-3",s:"sf",t:"fuel",q:"State the before-start and in-flight fuel check equations, and how often the in-flight check is done.",
a:`<ul><li>Before start: initial FOB (Fuel On Board) + fuel uplifted = FOB ± Δ. Convert the uplift from volume to mass using its density.</li><li>In flight, at each waypoint or every 30 min: FOB + FU (Fuel Used) = initial FOB ± Δ. Also cross-check against the flight plan figures.</li><li>Post-flight: the same as in flight.</li></ul><p>The in-flight check detects a leak or unexpected drag that would make the FMS (Flight Management System) predictions optimistic.</p>`,
src:"Safety First: Fuel Monitoring on A320 Family Aircraft"},
{id:"sf-fuel-4",s:"sf",t:"fuel",q:"What is the ground FQI tolerance formula? Work it for an A320 with 5 000 kg on board and a 20 000 kg maximum FOB.",
a:`<p>±(1% of current FOB + 1% of maximum FOB) = ±(50 + 200) = <b>±250 kg</b>. A discrepancy larger than this is abnormal and must be logged for maintenance. The FQI is more accurate at low quantities.</p>`,
src:"Safety First: Fuel Monitoring on A320 Family Aircraft"},
{id:"sf-fuel-5",s:"sf",t:"fuel",q:"In event 3, the arrival discrepancy was about 3 000 kg on one sector. What was the error in the crew's reasoning, and what is the lesson?",
a:`<p>The crew explained the discrepancy away as the result of a direct routing, an early arrival and fuel tankering, and nothing went in the tech log. The refueller then added little fuel because the gauges were over-reading. The next flight departed with much less fuel than indicated and received LO LVL on both sides.</p><p>Lesson: log any discrepancy beyond tolerance, and never skip a fuel check. An intermittent fault may not be visible at the next check.</p>`,
src:"Safety First: Fuel Monitoring on A320 Family Aircraft"},
/* idg */
{id:"sf-idg-1",s:"sf",t:"idg",q:"How can a single ELEC GEN FAULT in an idle descent turn into ELEC EMER CONFIG within seconds?",
a:`<p>When one IDG (Integrated Drive Generator) trips, the other suddenly takes the whole electrical load. If its CSD (Constant Speed Drive) hydraulic blocks are worn, it cannot hold 400 Hz. Its GCU (Generator Control Unit) then disconnects it as well. With both AC buses lost, the RAT (Ram Air Turbine) deploys and the aircraft is in emergency electrical configuration and Alternate law.</p>`,
src:"Safety First: Preventing Loss of Engine Generators"},
{id:"sf-idg-2",s:"sf",t:"idg",q:"What is the IDG \"straight-through\" speed, and why does idle thrust contribute to these failures?",
a:`<p>It is the input speed at which the CSD (Constant Speed Drive) needs no correction to produce 400 Hz. Near idle, engine speed is close to this value, so the regulation keeps switching on and off. A worn CSD responds late and the frequency fluctuates outside limits. That is why most events happened in descent.</p>`,
src:"Safety First: Preventing Loss of Engine Generators"},
{id:"sf-idg-3",s:"sf",t:"idg",q:"After a single GEN FAULT, what should the crew do beyond the ECAM reset, and why?",
a:`<p><b>Start the APU</b> (Auxiliary Power Unit) and connect its generator. This restores two-generator redundancy, so if the second IDG also fails you do not drop into emergency electrical configuration.</p><p>Also bear in mind that a successful reset may not last. The generator can trip again if the same conditions (idle thrust, a step in load) return.</p>`,
src:"Safety First: Preventing Loss of Engine Generators"},
{id:"sf-idg-4",s:"sf",t:"idg",q:"What is the specific risk during single-engine taxi without the APU, and how would it present?",
a:`<p>Total loss of normal AC power has occurred on the ground during SETWA (Single Engine Taxi Without APU). All cockpit displays go black and <b>no ECAM alert</b> is shown. This is worth considering with SETO (Single Engine Taxi Out). Airbus added a TSM (Trouble Shooting Manual) task, "Loss of Normal 115 V AC", for maintenance.</p>`,
src:"Safety First: Preventing Loss of Engine Generators"},
{id:"sf-idg-5",s:"sf",t:"idg",q:"In the A319 event, after both generators had been reset, what further resets brought back Normal law?",
a:`<p>The crew reset <b>FAC 1 and FAC 2</b> (Flight Augmentation Computers). Normal law came back after FAC 1, and FAC 2 followed 8 s later. The crew then re-engaged the AP (Autopilot) and started the APU (Auxiliary Power Unit) as a precaution.</p>`,
src:"Safety First: Preventing Loss of Engine Generators"},
/* flare */
{id:"sf-flare-1",s:"sf",t:"flare",q:"At what height should the flare start on an A320 and on an A321, and what factors call for an earlier flare?",
a:`<p>In stabilised conditions: about <b>30 ft RA</b> (Radio Altitude) on the A318, A319 and A320, and about <b>40 ft RA</b> on the A321.</p><p>Flare earlier for:</p><ul><li>An approach slope steeper than 3°.</li><li>An upsloping runway, or rising terrain before the threshold.</li><li>A tailwind (higher ground speed means a higher sink rate).</li><li>A high airport elevation.</li></ul>`,
src:"Safety First: A Focus on the Landing Flare; FCTM PR-NP-SOP Landing"},
{id:"sf-flare-2",s:"sf",t:"flare",q:"What is the status of the 20 ft RETARD callout, and what are the two consequences of a late retard?",
a:`<p>RETARD is a reminder, not an order. The PF may retard earlier or later to suit the conditions, but the thrust levers must be at IDLE <b>by touchdown at the latest</b>.</p><ul><li>Otherwise the ground spoilers do not extend, which can cause a bounce (as in case 1, where the levers were pushed above CLB).</li><li>A/THR (Autothrust) keeps targeting VAPP until the levers reach IDLE, which causes a float and a longer landing distance (as in case 2).</li></ul>`,
src:"Safety First: A Focus on the Landing Flare"},
{id:"sf-flare-3",s:"sf",t:"flare",q:"Describe the technique for a light bounce and for a high bounce. What turned the case 1 bounce into a nose gear impact?",
a:`<ul><li>Light bounce: hold the pitch attitude and continue. The second touchdown will be softer.</li><li>High bounce: hold the pitch attitude and go around, countering the pitch-up from the thrust increase. Never push to force it onto the runway.</li></ul><p>In case 1, the PF retarded to IDLE during the bounce, which deployed the ground spoilers, and applied full forward stick at the same time. The result was a heavy nose gear impact.</p>`,
src:"Safety First: A Focus on the Landing Flare; FCTM PR-NP-SOP Landing"},
{id:"sf-flare-4",s:"sf",t:"flare",q:"Once the flare has started, what sidestick input is prohibited? What should you do if the aircraft floats?",
a:`<p>No forward (nose-down) stick once the flare has started. You may relax the back stick slightly if needed. If the aircraft floats, or the normal touchdown point cannot be reached, go around. A go-around is possible at any time until the reversers are selected. Once they are selected, the landing must be completed.</p>`,
src:"Safety First: A Focus on the Landing Flare"},
{id:"sf-flare-5",s:"sf",t:"flare",q:"Case 1 ended in a tail strike on the go-around. What technique prevents this in a go-around close to the ground?",
