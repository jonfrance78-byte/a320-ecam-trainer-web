a:`<p>From <b>80 kt to lift-off</b> on take-off (to avoid a high-energy reject) and from touchdown to 80 kt on landing (to keep the reversers in use). Watch for the red EGT on the engine display.</p>`,
src:"Safety First #34, July 2022: Prevention of EGT Overlimit Events"},
{id:"sf-egt-5",s:"sf",t:"egt",q:"Name four ways the crew can lower the take-off EGT.",
a:`<ul><li>Longer warm-up (10 minutes can save about 10 °C).</li><li>Reduced thrust (FLEX or derate).</li><li>Packs OFF.</li><li>APU BLEED ON when it is too hot for packs off.</li></ul>`,
src:"Safety First #34, July 2022: Prevention of EGT Overlimit Events"},
{id:"sf-turn180-1",s:"sf",t:"turn180",q:"Who should fly a right U-turn on the runway, and why?",
a:`<p>The <b>left seat</b>: the pilot on the side opposite the turn has the better view. For a left turn, the right seat.</p>`,
src:"Safety First #22, July 2016: 180° Turns on Runway"},
{id:"sf-turn180-2",s:"sf",t:"turn180",q:"What divergence angle and ground speed does the technique use?",
a:`<p>About <b>15 to 25°</b> from the runway axis (type dependent) and a steady <b>5 to 10 kt</b>, towards 5 kt on a degraded surface.</p>`,
src:"Safety First #22, July 2016: 180° Turns on Runway"},
{id:"sf-turn180-3",s:"sf",t:"turn180",q:"When do you start the turn, and how do you use the tiller?",
a:`<p>When you are physically <b>over the runway edge</b> (on most Airbus types). Then bring the tiller <b>progressively</b> to full. An aggressive full tiller makes the nosewheels skid.</p>`,
src:"Safety First #22, July 2016: 180° Turns on Runway"},
{id:"sf-turn180-4",s:"sf",t:"turn180",q:"What assumptions lie behind the FCOM minimum runway width for a 180\u00b0 turn?",
a:`<p>A <b>dry</b> runway, a <b>good surface</b> and the <b>recommended technique</b> with full steering throughout. Add margin for contamination or a worn or painted surface.</p>`,
src:"Safety First #22, July 2016: 180° Turns on Runway"},
{id:"sf-turn180-5",s:"sf",t:"turn180",q:"A wheel left the pavement during the turn but you got back on. What now?",
a:`<p>Report it, and have the aircraft <b>inspected before flight</b>. One crew realigned and took off; gear damage was found on arrival.</p>`,
src:"Safety First #22, July 2016: 180° Turns on Runway"},
{id:"sf-turn180-6",s:"sf",t:"turn180",q:"How do you keep the speed steady during the turn?",
a:`<p>Small asymmetric thrust, <b>idle on the inside engine</b>. The PM watches the ground speed and heading and calls deviations; the PF looks outside.</p><div data-fig="turn180_stats"></div>`,
src:"Safety First #22, July 2016: 180° Turns on Runway"}
);

const SECTIONS = {
  proc:{key:"proc",hash:"procedures",title:"Procedures",cls:"proc",desc:"Normal procedures: takeoff, climb and cruise, descent and approach, landing, go-around. FCOM PRO-NOR and FCTM PR-NP."},
  abn:{key:"abn",hash:"abnormal",title:"Abnormal Procedures",cls:"abn",desc:"Memory items, RTO and engine failure, ECAM and systems failures, emergencies. FCOM PRO-ABN, QRH and FCTM PR-AEP."},
  tech:{key:"tech",hash:"technical",title:"A320 Technical Knowledge",cls:"tech",desc:"Systems at captain oral depth: hydraulics, electrics, flight controls, gear and brakes, fuel, APU, ice protection, LEAP-1A. FCOM DSC."},
  sf:{key:"sf",hash:"safety",title:"Safety First Flight",cls:"sf",desc:"Walk through one flight, gate to gate. Each stop is an Airbus Safety First case for that phase: read the briefing, then answer the questions."}
};
const BY_HASH = Object.fromEntries(Object.values(SECTIONS).map(s=>[s.hash,s]));

/* ---------- state (per-viewer, browser only) ---------- */
const LS = "a320qb.v1";
let store = {marks:{}, prefs:{}};
try{ const raw = localStorage.getItem(LS); if(raw) store = Object.assign(store, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }
const mark = id => store.marks[id] || "new";

let ui = {topic:"All", mode:"drill", onlyDue:false, idx:0, shown:false, deck:[], confirmReset:false};

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function stats(key){ return statsOf(Q.filter(q=>q.s===key)); }
function statsOf(qs){
  const k = qs.filter(q=>mark(q.id)==="known").length;
  const r = qs.filter(q=>mark(q.id)==="review").length;
  return {n:qs.length,k,r};
}
function bar(st){
  const pk = st.n? st.k/st.n*100:0, pr = st.n? st.r/st.n*100:0;
  return `<div class="bar" role="img" aria-label="${st.k} known, ${st.r} to review, ${st.n-st.k-st.r} not seen"><i class="k" style="width:${pk}%"></i><i class="r" style="width:${pr}%"></i></div>`;
}

/* ---------- home ---------- */
function renderHome(){
  const all = Q.length, known = Q.filter(q=>mark(q.id)==="known").length;
  app.innerHTML = `
  <header class="top">
    <a class="back" href="index.html">◀ ECAM Trainer</a>
    <div class="eyebrow">A320 family · LEAP-1A · Captain oral standard</div>
    <h1>A320 Question Bank</h1>
    <p>Study by section. Reveal each answer, then mark it <span class="c-g">known</span> or <span class="c-a">review</span>. Questions marked for review come round first.</p>
    <div class="fma" aria-label="Overall progress"><span class="c-w">${all} Q</span><span class="c-g">${known} KNOWN</span><span class="c-a">${Q.filter(q=>mark(q.id)==="review").length} REVIEW</span><span class="c-c">${all-known-Q.filter(q=>mark(q.id)==="review").length} NEW</span></div>
  </header>
  <nav class="sections" aria-label="Sections">
    ${Object.values(SECTIONS).map(s=>{const st=stats(s.key);return `
    <a class="sec ${s.cls}" href="#${s.hash}">
      <h2>${s.title}</h2>
      <p class="desc">${s.desc}</p>
      <div class="count">${st.n}<small>${st.k} known</small></div>
      ${bar(st)}
    </a>`}).join("")}
  </nav>
  <div class="legend"><span><b style="background:var(--green)"></b>Known</span><span><b style="background:var(--amber)"></b>Review</span><span><b style="background:var(--panel-2);outline:1px solid var(--rule-2)"></b>Not seen</span></div>
  <footer class="foot">
    <p>Sources: FCOM (DSC, PRO-NOR, PRO-ABN, LIM), FCTM and Airbus Safety First only. Each answer cites its reference. Where Jet2 SOP or the current QRH differs, the operator document applies. Progress is saved in this browser only.</p>
    ${ui.confirmReset ? `<div class="confirm"><span>Clear all known/review marks in this browser?</span><div class="row"><button class="btn warn" id="doReset">Clear progress</button><button class="btn ghost" id="noReset">Keep</button></div></div>`
      : `<div class="row"><button class="btn ghost" id="askReset">Reset progress</button></div>`}
  </footer>`;
  const a=document.getElementById("askReset"); if(a) a.onclick=()=>{ui.confirmReset=true;renderHome();};
  const d=document.getElementById("doReset"); if(d) d.onclick=()=>{store.marks={};save();ui.confirmReset=false;renderHome();};
  const n=document.getElementById("noReset"); if(n) n.onclick=()=>{ui.confirmReset=false;renderHome();};
}

/* ---------- section ---------- */
function buildDeck(sec){
  let qs = Q.filter(q=>q.s===sec.key && (ui.topic==="All"||q.t===ui.topic));
  if(ui.onlyDue) qs = qs.filter(q=>mark(q.id)!=="known");
  const rank = {review:0,new:1,known:2};
  if(ui.mode==="drill") qs = qs.slice().sort((a,b)=>rank[mark(a.id)]-rank[mark(b.id)]);
  ui.deck = qs;
  if(ui.idx>=qs.length) ui.idx=0;
}

function answerBlock(q){
  return `<div class="ans">${q.a}</div><div class="src"><b>REF</b> ${esc(q.src)}</div>`;
}
function stateTag(id){const m=mark(id);return `<span class="state ${m}">${m==="new"?"not seen":m}</span>`;}

const topicLabel = t => FILES_BY_ID[t] ? FILES_BY_ID[t].tag : t;

/* ---------- safety first: file index and briefing ---------- */
const pad2 = n => String(n).padStart(2,"0");
const fileQs = id => Q.filter(q=>q.t===id);
const stopDone = f => fileQs(f.id).every(q=>mark(q.id)!=="new");
const nextStop = f => FLIGHT[f.n] || null;
const prevStop = f => FLIGHT[f.n-2] || null;

function stopNav(f){
  const p = prevStop(f), n = nextStop(f);
  return `<nav class="stopnav" aria-label="Flight stops">
    ${p?`<a href="#safety-${p.id}"><small>◀ Previous stop</small>${esc(p.step)}</a>`:`<a href="#safety"><small>◀ Route</small>Back to the flight plan</a>`}
    ${n?`<a class="nx" href="#safety-${n.id}"><small>Next stop ▶</small>${esc(n.step)}</a>`:`<a class="nx" href="#safety"><small>Flight complete ▶</small>Back to the flight plan</a>`}
  </nav>`;
}

function renderSafetyIndex(sec){
  const st = stats("sf");
  const resume = FLIGHT.find(f=>!stopDone(f));
  app.innerHTML = `
  <div class="view sf" style="display:flex;flex-direction:column;gap:20px">
    <a class="back" href="#home">◀ All sections</a>
    <header class="shead">
      <div class="eyebrow">${FLIGHT.length} stops · ${st.n} questions · ${st.k} known · ${st.r} review</div>
      <h2>${sec.title}</h2>
      <p class="lede">One sector, gate to gate: ${FLIGHT.length} Airbus Safety First cases in the order you meet them, from preliminary cockpit preparation to parking on stand. At each stop, read the briefing, answer the questions, then move to the next stop.</p>
      ${bar(st)}
      <div class="row">${resume
        ? `<a class="reveal" href="#safety-${resume.id}">${resume.n===1?"Start the flight":"Resume at stop "+pad2(resume.n)} ▶</a>`
        : `<span class="c-g fmeta">ON STAND. Every stop is complete. Review any amber stops below.</span>`}</div>
    </header>
    <ol class="route">
      ${FLIGHT.map((f,i)=>{const s=statsOf(fileQs(f.id)); const done=stopDone(f);
        const newPhase = i===0 || FLIGHT[i-1].phase!==f.phase;
        return `${newPhase?`<li class="phase"><span>${esc(f.phase)}</span></li>`:""}
      <li class="stop ${done?"done":""} ${s.r?"has-r":""}">
        <a href="#safety-${f.id}">
          <span class="num">${pad2(f.n)}</span>
          <span class="body">
            <span class="tag">${esc(f.step)}</span>
            <h3>${esc(f.title)}</h3>
            <span class="fmeta">${s.n} questions · ${s.k} known${s.r?` · <span class="c-a">${s.r} review</span>`:""}${done?` · <span class="c-g">complete</span>`:""}</span>
            ${bar(s)}
          </span>
        </a>
      </li>`}).join("")}
    </ol>
  </div>`;
}

  const win = ()=>{let o="";for(let x=-82;x<=84;x+=5.6){ if(x>-12&&x<6) continue; o+=`<rect x="${x.toFixed(1)}" y="-35.5" width="2.6" height="3.6" rx="1.2" fill="#22303f"/>`;} return o;};
  const side = `<g class="dw-side">

   <path d="M-140 -36 C-136 -36 -128 -33 -120 -27 L-50 -15 L92 -15 C106 -15 118 -18 124 -24 C128 -28 127 -33 121 -37 C113 -42 102 -44 92 -44 L-60 -44 C-90 -44 -112 -43 -128 -41 C-135 -40 -140 -38.5 -140 -36 Z" fill="url(#dw-fus)" stroke="#5a6878" stroke-width=".9"/>

   <path d="M108 -37.5 L116 -37.5 L120.5 -33.5 L111 -33.5 Z M117.4 -37.4 L120 -37.4 L123.4 -34 L121.4 -34 Z" fill="#22303f"/>

   <path d="M30 -19 C18 -22 -6 -22.5 -34 -27 L-37 -25.5 C-10 -20 14 -16.5 30 -17 Z" fill="url(#dw-wing)" stroke="#5a6878" stroke-width=".6"/>
   <path d="M-2 -19.5 l-6 3 h-3 l2 -3.6 Z M-16 -21.5 l-6 3 h-3 l2 -3.6 Z" fill="#8a97a5"/>

    for(let d=-20; d<=30; d+=2.5){ if(d===0) continue; const y = cy - (d - p)*k, w = d%10===0?36:d%5===0?22:10;
      lad += `<line x1="${cx-w/2}" y1="${y}" x2="${cx+w/2}" y2="${y}" stroke="#fff" stroke-width="1"/>` + (d%10===0?`<text x="${cx-w/2-3}" y="${y+3}" fill="#fff" font-size="8" text-anchor="end">${Math.abs(d)}</text>`:"");
    }
    const hy = cy + p*k;
    const spd = o.spd, tape = v=>{ if(v==null) return ""; let t=""; for(let s=Math.ceil((v-30)/10)*10; s<=v+30; s+=10){ const y=cy-(s-v)*1.9; t+=`<line x1="40" y1="${y}" x2="46" y2="${y}" stroke="#fff"/>`+(s%20===0?`<text x="36" y="${y+3}" fill="#fff" font-size="9" text-anchor="end">${s}</text>`:""); } return t; };

    ${o.warn?`<text x="${cx}" y="34" fill="#ff5a52" font-size="12" font-weight="600" text-anchor="middle">${esc(o.warn)}</text>`:""}
    </svg>`;

})();

/* ================= REPLAYS =================
   A drawn scene stepped through an event, with decision points. Data from the
   named Safety First article. Scene "side" shows the aircraft over the runway
   (it pivots on the main gear and the tail meets the runway at TAIL_DEG) and,
   when a step has pfd values, the PFD beside it. Other scenes are functions in
   SCENES that draw the whole picture for a step. */
const TAIL_DEG = 12.7;
const SCENES = {};

function sideSvg(r){
  const tick = ft=>{const y=230-ft*1.5; return `<line x1="34" y1="${y}" x2="42" y2="${y}" stroke="#33435a"/><text x="30" y="${y+4}" fill="#8c9aab" font-size="11" text-anchor="end">${ft}</text>`;};
  return `<svg viewBox="0 -40 640 310" role="img" aria-label="${esc(r.title)}: side view of the aircraft over the runway">${DRAW.defs}
  <text x="4" y="90" fill="#8c9aab" font-size="11">RA ft</text>${[0,40,80].map(tick).join("")}
  <rect x="44" y="230" width="596" height="18" fill="#161e28"/><line x1="44" y1="230" x2="640" y2="230" stroke="#4a5a70" stroke-width="2"/>
  ${[0,1,2,3,4,5,6].map(i=>`<rect x="${60+i*90}" y="238" width="44" height="3" fill="#e8edf3" opacity=".55"/>`).join("")}
  <g class="ac">${DRAW.side}<circle class="ac-hit" cx="-120" cy="-27" r="10" fill="#ff5a52" opacity="0"/></g>
  <text class="ac-strike" x="200" y="266" fill="#ff5a52" font-size="14" font-weight="600" opacity="0">TAILSTRIKE</text>
  <g transform="translate(606 96)"><text x="0" y="-8" fill="#8c9aab" font-size="10" text-anchor="middle">STICK</text>
   <rect x="-6" y="0" width="12" height="96" rx="6" fill="#161e28" stroke="#33435a"/><line x1="-10" y1="48" x2="10" y2="48" stroke="#33435a"/>
   <text x="12" y="10" fill="#8c9aab" font-size="9">ND</text><text x="12" y="94" fill="#8c9aab" font-size="9">NU</text>
   <circle class="ac-stick" cx="0" cy="48" r="7" fill="#3fc8f0" style="transition:cy .5s"/></g>
  </svg>`;
}

function mountReplays(root){
  root.querySelectorAll("[data-replay]").forEach(el=>{
    const r = REPLAYS[el.dataset.replay]; if(!r) return;
    el.classList.add("replay");
    const scene = r.scene||"side", withPfd = scene==="side" && r.steps.some(s=>s.pfd);
    let i = 0; const answered = {};
    el.innerHTML = `<figure class="fig"><figcaption style="margin:0 0 6px">${esc(r.title)}</figcaption>
      <div class="rp-scene${withPfd?" two":""}"><div class="rp-main">${scene==="side"?sideSvg(r):""}</div>${withPfd?`<div class="rp-pfd"></div>`:""}</div>
      <div class="rp-read" aria-live="polite"></div><p class="rp-note"></p><div class="rp-q"></div>
      <div class="rp-ctl"><button class="rp-prev">◀ Back</button><button class="rp-next">Next ▶</button><span class="rp-n"></span></div>
      <figcaption>${esc(r.credit||"")}</figcaption></figure>`;
    const $ = sel=>el.querySelector(sel);
    function show(){
      const st = r.steps[i], ask = st.ask, open = ask && answered[i]==null;
      if(scene==="side"){
        const ra = Math.max(0, st.ra||0);
        $(".ac").style.transform = `translate(360px, ${230 - ra*1.5}px) rotate(${-st.pitch}deg) scale(1.45)`;
        const strike = ra === 0 && st.pitch >= TAIL_DEG;
        $(".ac-hit").setAttribute("opacity", strike ? .9 : 0); $(".ac-strike").setAttribute("opacity", strike ? 1 : 0);
        $(".ac-stick").setAttribute("cy", 48 + (st.stick||0)*44);
        if(withPfd) $(".rp-pfd").innerHTML = st.pfd ? DRAW.pfd(Object.assign({pitch:st.pitch}, st.pfd)) : "";
      } else $(".rp-main").innerHTML = SCENES[scene](st, i, r);
      const read = st.read || (scene==="side" ? [["RA",st.raT],["Pitch",st.pitchT||((st.pitch>0?"+":"")+st.pitch+"°")],["Speed kt",st.kt],["V/S ft/min",st.vs],["Thrust",st.thr],
        ["Stick",!st.stick?"neutral":(Math.abs(st.stick)===1?"full ":Math.round(Math.abs(st.stick)*3)+"/3 ")+(st.stick>0?"nose-up":"nose-down")]] : []);
      $(".rp-read").innerHTML = read.map(x=>`<div><small>${esc(x[0])}</small>${esc(String(x[1]))}</div>`).join("");
      $(".rp-read").hidden = !read.length;
      $(".rp-note").textContent = st.note;
      $(".rp-q").innerHTML = ask ? `<div class="rp-ask"><p>Decision point: ${esc(ask.q)}</p>${ask.opts.map((o,k)=>
        `<button data-k="${k}" class="${answered[i]==null?"":o[1]?"ok":k===answered[i]?"no":""}" ${answered[i]==null?"":"disabled"}>${esc(o[0])}</button>`).join("")}
        ${answered[i]!=null?`<p class="rp-fb ${ask.opts[answered[i]][1]?"c-g":"c-a"}">${esc(ask.opts[answered[i]][2])}</p>`:""}</div>` : "";
      $(".rp-q").querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{answered[i]=+b.dataset.k; show();});
      $(".rp-prev").disabled = i===0; $(".rp-next").disabled = i===r.steps.length-1 || open;
      $(".rp-n").textContent = `Step ${i+1} of ${r.steps.length}${open?" · answer to continue":""}`;
    }
    $(".rp-prev").onclick=()=>{ if(i>0){i--;show();} };
    $(".rp-next").onclick=()=>{ if(i<r.steps.length-1){i++;show();} };
    show();
  });
}

const REPLAYS = {};

/* ================= LEARNING WIDGETS =================
   Mounted in briefings beside the replays:
   data-cards  decision cards: one scenario at a time, three answers, feedback, score
   data-slider one control that redraws a figure and its readouts
   data-hots   a drawing with numbered spots to tap for an explanation
   SCENES.timeline draws a replay as a track of events, the current one lit. */
const CARDS = {}, SLIDERS = {}, HOTS = {}, FIGS = {};

SCENES.timeline = (st, i, r)=>{
  const ev = r.track, n = ev.length, x = k=>30 + k*(580/(n-1)), at = st.at;
  return `<svg viewBox="0 0 640 ${r.tall?190:150}" role="img" aria-label="${esc(r.title)}: event ${at+1} of ${n}">
   <line x1="30" y1="60" x2="610" y2="60" stroke="#33435a" stroke-width="3"/>
   <line x1="30" y1="60" x2="${x(at)}" y2="60" stroke="${st.c||"#3fc8f0"}" stroke-width="3"/>

const C = {bg:"#05080c",panel:"#10161e",rule:"#33435a",fg:"#e8edf3",mut:"#8c9aab",cy:"#3fc8f0",g:"#3ee08a",a:"#ffb326",r:"#ff5a52",m:"#e36bdc"};

const wrapT = (x,y,str,o={})=>{ const w=o.w||28, words=String(str).split(" "), L=[]; let l=""; words.forEach(t=>{ if((l+" "+t).trim().length>w){L.push(l.trim());l=t;} else l+=" "+t; }); if(l.trim())L.push(l.trim());
  return L.map((t,k)=>T(x,y+k*(o.lh||14),t,o)).join(""); };
const fig = (svg,cap)=>`<figure class="fig">${svg}${cap?`<figcaption>${esc(cap)}</figcaption>`:""}</figure>`;
const bars = (title,rows,max,cap)=>{ const h=26*rows.length+30;

/* ---- 180° turn on the runway ---- */
const UT_PATH = (()=>{ // [x, y, heading°] samples: straight, divergence, right turn, align
  const pts=[], push=(x,y,h)=>pts.push([x,y,h]);
  for(let x=60;x<=170;x+=10) push(x,165,0);
  const d=-20*Math.PI/180; for(let k=0;k<=18;k++) push(170+k*16*Math.cos(d),165+k*16*Math.sin(d),-20);
  const P=pts[pts.length-1], R=44, h0=-20*Math.PI/180, cx=P[0]-R*Math.sin(h0), cy=P[1]+R*Math.cos(h0);
  for(let k=1;k<=24;k++){ const h=h0+k*(200/24)*Math.PI/180; push(cx+R*Math.sin(h), cy-R*Math.cos(h), h*180/Math.PI); }
  const E=pts[pts.length-1]; for(let k=1;k<=10;k++){ const x=E[0]-k*12, y=E[1]+(130-E[1])*Math.min(1,k/8); push(x,y,180); }
  return pts; })();
SCENES.uturn = (st)=>{
  const k=Math.round(st.f*(UT_PATH.length-1)), p=UT_PATH[k];
  const trail=UT_PATH.slice(0,k+1).map(q=>q.join(",").split(",").slice(0,2).join(",")).join(" ");
  return `<svg viewBox="0 0 640 260" role="img" aria-label="Runway seen from above: ${esc(st.note)}">${DRAW.defs}
   <rect x="0" y="40" width="640" height="180" fill="#1b232d"/><line x1="0" y1="40" x2="640" y2="40" stroke="#e8edf3" stroke-width="2"/><line x1="0" y1="220" x2="640" y2="220" stroke="#e8edf3" stroke-width="2"/>

   ${[0,1,2,3,4,5].map(i=>`<rect x="600" y="${52+i*28}" width="30" height="12" fill="#e8edf3" opacity=".55"/>`).join("")}${T(596,238,"painted marks: slippery",{c:C.a,s:10,a:"end"})}
   <polyline points="${trail}" fill="none" stroke="${C.cy}" stroke-width="2.4" stroke-dasharray="6 4"/>
   <g transform="translate(${p[0]} ${p[1]}) rotate(${p[2]+90}) scale(.2)">${DRAW.top}</g>
   ${T(10,30,"RUNWAY FROM ABOVE",{c:C.mut,s:10.5})}${st.edge?`<line x1="${p[0]-30}" y1="40" x2="${p[0]+30}" y2="40" stroke="${C.a}" stroke-width="4"/>`:""}

SCENES.triple = (st)=>{
  const gauge=(cx,cy,R,lbl,v,max,band)=>{ const a0=-200,span=220, ang=a0+v/max*span, rad=x=>x*Math.PI/180, p=(an,r)=>[cx+r*Math.cos(rad(an)),cy+r*Math.sin(rad(an))];
    const arc=(f,t,col,w)=>{const s=p(f,R),e=p(t,R);return `<path d="M${s[0]} ${s[1]} A${R} ${R} 0 ${t-f>180?1:0} 1 ${e[0]} ${e[1]}" fill="none" stroke="${col}" stroke-width="${w}"/>`;};
    const ticks=[0,1,2,3].map(n=>{const q=p(a0+n/max*span,R-10);return T(q[0],q[1]+4,n,{a:"middle",c:C.fg,s:11});}).join("");
    const tip=p(ang,R-4);
    return `${arc(a0,a0+span,"#e8edf3",2)}${band?arc(a0+band[0]/max*span,a0+band[1]/max*span,C.g,6):""}${ticks}<line x1="${cx}" y1="${cy}" x2="${tip[0]}" y2="${tip[1]}" stroke="#f2f4f5" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4" fill="#f2f4f5"/>${T(cx,cy+R+18,lbl,{a:"middle",c:C.mut,s:11})}`; };
  return `<svg viewBox="0 0 640 230" role="img" aria-label="Brake triple indicator: accumulator and left and right brake pressures">
   <rect x="160" y="10" width="320" height="210" rx="16" fill="#0b0f14" stroke="${C.rule}" stroke-width="2"/>
   ${gauge(320,70,46,"ACCU PRESS",st.acc,4,[2.6,3.6])}

   ${T(320,212,"psi × 1000",{a:"middle",c:C.mut,s:10})}
   ${st.flag?T(560,120,st.flag,{a:"middle",c:C.r,s:16,w:700}):""}
  </svg>`; };

function mountWidgets(root){
  root.querySelectorAll("[data-fig]").forEach(el=>{ const f = FIGS[el.dataset.fig]; if(f) el.outerHTML = typeof f==="function" ? f() : f; });
  mountReplays(root);
  root.querySelectorAll("[data-cards]").forEach(el=>{
    const c = CARDS[el.dataset.cards]; if(!c) return;
    let i = 0, ans = {};
    const draw = ()=>{
      const it = c.items[i], a = ans[i], done = Object.keys(ans).length, right = Object.keys(ans).filter(k=>c.items[k].opts[ans[k]][1]).length;
      el.innerHTML = `<figure class="fig cards"><figcaption style="margin:0 0 8px">${esc(c.title)} · card ${i+1} of ${c.items.length}${done?` · ${right}/${done} right`:""}</figcaption>
        ${it.fig||""}<p class="cd-q">${esc(it.q)}</p>
        ${it.opts.map((o,k)=>`<button class="cd-o ${a==null?"":o[1]?"ok":k===a?"no":""}" data-k="${k}" ${a==null?"":"disabled"}>${esc(o[0])}</button>`).join("")}
        ${a!=null?`<p class="rp-fb ${it.opts[a][1]?"c-g":"c-a"}">${esc(it.opts[a][2])}</p>`:""}
        <div class="rp-ctl"><button class="cd-prev" ${i?"":"disabled"}>◀ Back</button><button class="cd-next" ${i<c.items.length-1&&a!=null?"":"disabled"}>Next card ▶</button></div>
        ${c.credit?`<figcaption>${esc(c.credit)}</figcaption>`:""}</figure>`;
      el.querySelectorAll(".cd-o").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;draw();});
      el.querySelector(".cd-prev").onclick=()=>{i--;draw();};
      el.querySelector(".cd-next").onclick=()=>{i++;draw();};
    };
    draw();
  });
  root.querySelectorAll("[data-slider]").forEach(el=>{
    const s = SLIDERS[el.dataset.slider]; if(!s) return;
    const id = "sl-"+el.dataset.slider;
    el.innerHTML = `<figure class="fig"><figcaption style="margin:0 0 6px">${esc(s.title)}</figcaption><div class="sl-fig"></div>
      <label class="sl-row" for="${id}"><span>${esc(s.label)}</span><input id="${id}" type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.value}"><output></output></label>
      <div class="rp-read"></div><p class="rp-note"></p>${s.credit?`<figcaption>${esc(s.credit)}</figcaption>`:""}</figure>`;
    const inp = el.querySelector("input");
    const upd = ()=>{ const v = +inp.value;
      el.querySelector(".sl-fig").innerHTML = s.draw(v);
      el.querySelector("output").textContent = s.fmt ? s.fmt(v) : v;
      const rd = s.read ? s.read(v) : []; el.querySelector(".rp-read").innerHTML = rd.map(x=>`<div><small>${esc(x[0])}</small>${esc(String(x[1]))}</div>`).join(""); el.querySelector(".rp-read").hidden = !rd.length;
      el.querySelector(".rp-note").textContent = s.note ? s.note(v) : ""; };
    inp.oninput = upd; upd();
  });
  root.querySelectorAll("[data-hots]").forEach(el=>{
    const h = HOTS[el.dataset.hots]; if(!h) return;
    let sel = -1;
    const draw = ()=>{
      const spots = h.spots.map((p,k)=>`<g class="hs${k===sel?" on":""}" data-k="${k}" tabindex="0" role="button" aria-label="${esc(p.t)}">
        <circle cx="${p.x}" cy="${p.y}" r="${p.r||13}" fill="${k===sel?"#3fc8f0":"#05080c"}" fill-opacity="${k===sel?.9:.75}" stroke="#3fc8f0" stroke-width="2"/>
        <text x="${p.x}" y="${p.y+4.5}" fill="${k===sel?"#05080c":"#3fc8f0"}" font-size="13" font-weight="700" text-anchor="middle">${k+1}</text></g>`).join("");
      el.innerHTML = `<figure class="fig"><figcaption style="margin:0 0 6px">${esc(h.title)} · tap a number</figcaption>
        ${h.svg.replace("</svg>", spots+"</svg>")}
        <div class="hs-info" aria-live="polite">${sel<0?`<p class="small">${h.spots.length} points to explore.</p>`:`<p><b>${sel+1}. ${esc(h.spots[sel].t)}.</b> ${esc(h.spots[sel].i)}</p>`}</div>
        ${h.credit?`<figcaption>${esc(h.credit)}</figcaption>`:""}</figure>`;
      el.querySelectorAll(".hs").forEach(g=>{ const go=()=>{sel=+g.dataset.k;draw();}; g.onclick=go; g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}}; });
    };
    draw();
  });
}

function renderBrief(sec,f){
  const s = statsOf(fileQs(f.id));
  app.innerHTML = `
  <div class="view sf" style="display:flex;flex-direction:column;gap:20px">
    <a class="back" href="#safety">◀ Flight plan</a>
    <header class="shead">
      <div class="eyebrow">Stop ${pad2(f.n)} of ${FLIGHT.length} · ${esc(f.phase)} · ${esc(f.step)}</div>
      <h2>${esc(f.title)}</h2>
      <p class="lede">${esc(f.summary)}</p>
      <div class="progress" aria-hidden="true">${FLIGHT.map(x=>`<i class="${x.n<f.n?"past":x.n===f.n?"here":""}"></i>`).join("")}</div>
    </header>
    <article class="brief">${f.brief}
      <p class="srcline">Source: Airbus Safety First${f.issue?` ${esc(f.issue)}`:""}, <a href="${f.url}" target="_blank" rel="noopener">read the full article ↗</a>. Summarised for study; the FCOM, QRH and Jet2 SOPs remain the authority.</p>
    </article>
    <div class="card-f startbar">
      <span class="fmeta">${s.n} questions · ${s.k} known</span>
      <button class="reveal" id="startQ">Start questions ▶</button>
    </div>
    ${stopNav(f)}
  </div>`;
  document.getElementById("startQ").onclick=()=>{ui.stage="quiz";ui.idx=0;ui.shown=false;renderSection(sec);window.scrollTo(0,0);};
  mountWidgets(app);
}

function renderSection(sec){
  let file = null;
  if(sec.key==="sf"){
    if(!ui.file) return renderSafetyIndex(sec);
    file = FILES_BY_ID[ui.file];
    if(ui.stage!=="quiz") return renderBrief(sec,file);
    ui.topic = file.id;
  }
  buildDeck(sec);
  const topics = ["All",...new Set(Q.filter(q=>q.s===sec.key).map(q=>q.t))];
  const st = file ? statsOf(Q.filter(q=>q.t===file.id)) : stats(sec.key);
  let body;
  if(!ui.deck.length){
    body = `<div class="card"><div class="empty">${ui.onlyDue?"Everything in this filter is marked known. Untick “Unknown only” to see all questions.":"No questions in this topic yet."}</div></div>`;
  } else if(ui.mode==="drill"){
    const q = ui.deck[ui.idx];
    body = `<article class="card" aria-live="polite">
      <div class="card-h"><span class="topic">${esc(topicLabel(q.t))}</span><span>${ui.idx+1} / ${ui.deck.length} ${stateTag(q.id)}</span></div>
      <div class="q">${esc(q.q)}</div>
      ${ui.shown ? answerBlock(q) : ""}
      <div class="card-f">
        ${ui.shown
          ? `<div class="row"><button class="btn mark-r" id="mR">Review again</button><button class="btn mark-k" id="mK">Knew it</button></div>`
          : `<button class="reveal" id="reveal">Show answer</button>`}
        <div class="row"><button class="btn ghost" id="prev" aria-label="Previous question">◀ Prev</button><button class="btn ghost" id="next" aria-label="Next question">Next ▶</button></div>
      </div>
    </article>
    <div class="kbd">Keys: Space = show answer · 1 = review · 2 = knew it · ← → = move</div>`;
  } else {
    body = `<div class="list">${ui.deck.map((q,i)=>`
      <details data-id="${q.id}">
        <summary><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${esc(q.q)}</span><span class="meta">${esc(topicLabel(q.t))} ·${mark(q.id)==="new"?"not seen":mark(q.id)}</span></summary>
        <div class="body">${answerBlock(q)}
          <div class="row"><button class="btn mark-r" data-m="review" data-id="${q.id}">Review again</button><button class="btn mark-k" data-m="known" data-id="${q.id}">Knew it</button></div>
        </div>
      </details>`).join("")}</div>`;
  }

  app.innerHTML = `
  <div class="view ${sec.cls}" style="display:flex;flex-direction:column;gap:20px">
    ${file
      ? `<div class="row"><a class="back" href="#safety">◀ Flight plan</a><button class="back linkbtn" id="toBrief">◀ Re-read briefing</button></div>`
      : `<a class="back" href="#home">◀ All sections</a>`}
    <header class="shead">
      <div class="eyebrow">${file?`Stop ${pad2(file.n)} of ${FLIGHT.length} · ${esc(file.phase)} · `:""}${st.n} questions · ${st.k} known · ${st.r} review</div>
      <h2>${file?esc(file.title):sec.title}</h2>
      ${bar(st)}
    </header>
    ${file ? "" : `<div class="chips" role="group" aria-label="Topic">
      ${topics.map(t=>`<button class="chip" aria-pressed="${t===ui.topic}" data-topic="${esc(t)}">${esc(t)}</button>`).join("")}
    </div>`}
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Mode">
        <button id="mDrill" aria-pressed="${ui.mode==="drill"}">Drill</button>
        <button id="mList" aria-pressed="${ui.mode==="list"}">List</button>
      </div>
      <label class="chk" for="onlyDue"><input type="checkbox" id="onlyDue" ${ui.onlyDue?"checked":""}> Unknown only</label>
    </div>
    ${file && stopDone(file) ? (()=>{const n=nextStop(file); return `
    <div class="complete">
      <div><span class="c-g">STOP ${pad2(file.n)} COMPLETE.</span> ${st.r?`${st.r} marked for review.`:"All known."}</div>
      ${n?`<a class="reveal" href="#safety-${n.id}">Next stop ${pad2(n.n)}: ${esc(n.phase)} ▶</a>`:`<a class="reveal" href="#safety">On stand: flight complete ▶</a>`}
    </div>`})() : ""}
    ${body}
  </div>`;

  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ui.topic=b.dataset.topic;ui.idx=0;ui.shown=false;renderSection(sec);});
  const tb=document.getElementById("toBrief"); if(tb) tb.onclick=()=>{ui.stage="brief";renderSection(sec);window.scrollTo(0,0);};
  document.getElementById("mDrill").onclick=()=>{ui.mode="drill";ui.idx=0;ui.shown=false;renderSection(sec);};
  document.getElementById("mList").onclick=()=>{ui.mode="list";renderSection(sec);};
  document.getElementById("onlyDue").onchange=e=>{ui.onlyDue=e.target.checked;ui.idx=0;ui.shown=false;renderSection(sec);};
  const r=document.getElementById("reveal"); if(r){r.onclick=()=>{ui.shown=true;renderSectionFixed(sec,ui.deck);}; }
  const mk=(m)=>{const q=ui.deck[ui.idx]; store.marks[q.id]=m; save(); step(sec,1);};
  const mR=document.getElementById("mR"); if(mR) mR.onclick=()=>mk("review");
  const mK=document.getElementById("mK"); if(mK) mK.onclick=()=>mk("known");
  const p=document.getElementById("prev"); if(p) p.onclick=()=>step(sec,-1);
  const n=document.getElementById("next"); if(n) n.onclick=()=>step(sec,1);
  app.querySelectorAll(".list [data-m]").forEach(b=>b.onclick=()=>{
    store.marks[b.dataset.id]=b.dataset.m; save();
    const open=[...app.querySelectorAll(".list details[open]")].map(d=>d.dataset.id);
    renderSection(sec);
    open.forEach(id=>{const d=app.querySelector(`.list details[data-id="${id}"]`); if(d) d.open=true;});
  });
  mountWidgets(app);
}

function step(sec,dir){
  // in drill, keep the deck order fixed while stepping so marking doesn't reshuffle under you
  const keep = ui.deck.slice();
  ui.idx = (ui.idx + dir + keep.length) % keep.length;
  ui.shown = false;
  renderSectionFixed(sec, keep);
}
function renderSectionFixed(sec, deck){
  const orig = buildDeck;
  buildDeck = ()=>{ ui.deck = deck; };
  renderSection(sec);
  buildDeck = orig;
}

function secFromHash(){
  const h = location.hash.slice(1);
  return h.startsWith("safety-") ? SECTIONS.sf : BY_HASH[h];
}

document.addEventListener("keydown",e=>{
  const sec = secFromHash();
  if(!sec || ui.mode!=="drill" || !ui.deck.length) return;
  if(sec.key==="sf" && ui.stage!=="quiz") return;
  if(e.target.closest("input,textarea")) return;
  if(e.key===" " && !ui.shown){e.preventDefault();ui.shown=true;renderSectionFixed(sec,ui.deck);}
  else if(e.key==="1" && ui.shown){document.getElementById("mR")?.click();}
  else if(e.key==="2" && ui.shown){document.getElementById("mK")?.click();}
  else if(e.key==="ArrowRight"){step(sec,1);}
  else if(e.key==="ArrowLeft"){step(sec,-1);}
});

function route(){
  const h = location.hash.slice(1);
  const sec = secFromHash();
  ui.topic="All"; ui.idx=0; ui.shown=false; ui.confirmReset=false;
  ui.file = h.startsWith("safety-") && FILES_BY_ID[h.slice(7)] ? h.slice(7) : null;
  ui.stage = "brief";
  if(sec) renderSection(sec); else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
// Android Back in the ECAM Trainer app calls this: step back through the bank, then return to the trainer.
window.appBack = function(){
  const h = location.hash.slice(1);
  if(h.startsWith("safety-") && ui.stage==="quiz"){ ui.stage="brief"; renderSection(SECTIONS.sf); return true; }
  if(h.startsWith("safety-")){ location.hash="safety"; return true; }
  if(BY_HASH[h]){ location.hash="home"; return true; }
  location.href="index.html"; return true;
};
route();
</script>
