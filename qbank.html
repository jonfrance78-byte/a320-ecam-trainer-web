<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A320 Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: glass-cockpit panel. Home = three section "displays"; section = one question card at a time (drill) or full list. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#080b10; --panel:#10161e; --panel-2:#161e28; --rule:#243040; --rule-2:#33435a;
  --fg:#e8edf3; --muted:#8c9aab;
  --cyan:#3fc8f0; --green:#3ee08a; --amber:#ffb326; --red:#ff5a52; --magenta:#e36bdc;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
a{color:var(--cyan)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,7vw,52px);line-height:1;text-transform:uppercase}
h2{font-size:30px;line-height:1.05;text-transform:uppercase}

/* header */
.top{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:20px}
.top p{margin:0;color:var(--muted);max-width:62ch}
.fma{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule-2);width:fit-content;max-width:100%;font:600 12px/1 var(--f-mono);letter-spacing:.06em}
.fma span{padding:7px 12px;border-right:1px solid var(--rule-2)}
.fma span:last-child{border-right:0}
.c-g{color:var(--green)} .c-c{color:var(--cyan)} .c-a{color:var(--amber)} .c-m{color:var(--magenta)} .c-w{color:var(--fg)}

/* home sections */
.sections{display:grid;gap:14px}
.sec{--acc:var(--cyan);display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--acc);padding:18px 20px;text-decoration:none;color:var(--fg);transition:background .15s,border-color .15s}
.sec:hover{background:var(--panel-2);border-color:var(--rule-2);border-left-color:var(--acc)}
.sec h2{color:var(--acc);font-size:28px}
.sec .desc{grid-column:1/2;color:var(--muted);font-size:14px;margin:0;min-width:0}
.sec .count{grid-row:1/3;grid-column:2;text-align:right;font:600 28px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.sec .count small{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.sec .bar{grid-column:1/-1;margin-top:8px}
.sec.proc{--acc:var(--cyan)} .sec.abn{--acc:var(--amber)} .sec.tech{--acc:var(--green)}
.bar{display:flex;height:6px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%}
.bar .k{background:var(--green)} .bar .r{background:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:500 12px/1 var(--f-mono);color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

.foot{border-top:1px solid var(--rule);padding-top:18px;display:flex;flex-direction:column;gap:12px;color:var(--muted);font-size:13px}
.foot p{margin:0;max-width:70ch}
.btn{background:var(--panel-2);border:1px solid var(--rule-2);padding:9px 14px;cursor:pointer;font:600 13px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--muted)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--red);color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* section view */
.back{font:600 13px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--fg)}
.shead{display:flex;flex-direction:column;gap:10px}
.shead h2{color:var(--acc);font-size:clamp(30px,6vw,42px)}
.view{--acc:var(--cyan)}
.view.abn{--acc:var(--amber)} .view.tech{--acc:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1px solid var(--rule-2);padding:6px 11px;cursor:pointer;font:500 13px/1 var(--f-body);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--rule-2)}
.seg button{background:transparent;border:0;padding:8px 14px;cursor:pointer;font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
label.chk input{accent-color:var(--amber)}

.card{background:var(--panel);border:1px solid var(--rule);display:flex;flex-direction:column}
.card-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--rule);font:600 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-h .topic{color:var(--acc)}
.state{padding:2px 7px;border:1px solid currentColor;font-size:11px}
.state.known{color:var(--green)} .state.review{color:var(--amber)} .state.new{color:var(--muted)}
.q{padding:20px 18px 6px;font:500 19px/1.45 var(--f-body);text-wrap:pretty;min-width:0}
.ans{margin:14px 18px 4px;padding:14px 16px;background:var(--bg);border:1px solid var(--rule);min-width:0}
.ans p,.ans ul,.ans ol{margin:0 0 10px}
.ans ul,.ans ol{padding-left:22px}
.ans li{margin-bottom:4px}
.ans :last-child{margin-bottom:0}
.ans .mono,.mono{font-family:var(--f-mono);font-size:.9em}
.src{margin:10px 18px 0;font:500 12px/1.5 var(--f-mono);color:var(--muted)}
.src b{color:var(--cyan);font-weight:600}
.card-f{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:16px 18px;margin-top:12px;border-top:1px solid var(--rule)}
.reveal{background:var(--acc);color:#05080c;border:0;padding:12px 20px;font:700 14px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.mark-k{border-color:var(--green);color:var(--green)}
.mark-r{border-color:var(--amber);color:var(--amber)}
.kbd{font:500 11px/1 var(--f-mono);color:var(--muted)}
.empty{padding:28px 18px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:10px}
.list details{background:var(--panel);border:1px solid var(--rule)}
.list summary{cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;list-style:none}
.list summary::-webkit-details-marker{display:none}
.list summary .n{font:600 13px/1.6 var(--f-mono);color:var(--acc);font-variant-numeric:tabular-nums}
.list summary .t{font-weight:500;min-width:0}
.list summary .meta{grid-column:2;font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list details[open] summary{border-bottom:1px solid var(--rule)}
.list .body{padding-bottom:16px}
.list .body .row{padding:12px 18px 0}

.view.sf{--acc:var(--magenta)} .sec.sf{--acc:var(--magenta)}
.lede{margin:0;color:var(--muted);max-width:62ch}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.file{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--acc);padding:16px 18px;text-decoration:none;color:var(--fg);transition:background .15s,border-color .15s}
.file:hover{background:var(--panel-2);border-color:var(--rule-2);border-top-color:var(--acc)}
.file h3{font-size:22px;line-height:1.1;color:var(--fg);text-transform:none}
.file p{margin:0;color:var(--muted);font-size:14px;flex:1}
.tag{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.fmeta{font:500 12px/1.4 var(--f-mono);color:var(--muted)}
.brief{background:var(--panel);border:1px solid var(--rule);padding:6px 22px 20px;max-width:100%;min-width:0}
.brief h4{font:700 15px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.brief p,.brief ul,.brief ol{margin:0 0 10px;max-width:72ch}
.brief ul,.brief ol{padding-left:22px}
.brief li{margin-bottom:6px}
.brief li ul,.brief li ol{margin:6px 0 0}
.brief b{color:var(--fg);font-weight:600}
.brief .take{border-left:3px solid var(--green);padding:8px 12px;background:var(--bg);color:var(--green);font-style:italic}
.brief .srcline{margin-top:18px;font:500 12px/1.5 var(--f-mono);color:var(--muted)}
.startbar{background:var(--panel);border:1px solid var(--rule);margin-top:0}
.linkbtn{background:none;border:0;padding:0;cursor:pointer}
a.reveal{display:inline-block;text-decoration:none}
/* gate-to-gate route: a vertical track with one dot per stop */
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.route::before{content:"";position:absolute;left:21px;top:8px;bottom:8px;width:2px;background:var(--rule-2)}
.route .phase{padding:14px 0 8px 52px;font:700 13px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);position:relative}
.route .phase::before{content:"";position:absolute;left:14px;top:12px;width:16px;height:2px;background:var(--acc)}
.route .stop{padding-bottom:8px;position:relative}
.route .stop a{display:grid;grid-template-columns:44px 1fr;gap:8px;text-decoration:none;color:var(--fg)}
.route .num{position:relative;z-index:1;width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border:2px solid var(--rule-2);border-radius:50%;font:600 14px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.route .stop.done .num{border-color:var(--green);color:var(--green)}
.route .stop.done.has-r .num{border-color:var(--amber);color:var(--amber)}
.route .body{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--rule);padding:10px 14px;min-width:0;transition:background .15s,border-color .15s}
.route .stop a:hover .body{background:var(--panel-2);border-color:var(--rule-2)}
.route h3{font-size:19px;line-height:1.15;text-transform:none}
.route p{margin:0;color:var(--muted);font-size:14px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;background:var(--panel-2)}
.progress i.past{background:var(--muted)}
.progress i.here{background:var(--acc)}
.stopnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stopnav a{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--panel);border:1px solid var(--rule);text-decoration:none;color:var(--fg);font-size:14px;min-width:0}
.stopnav a:hover{border-color:var(--rule-2)}
.stopnav a small{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stopnav a.nx{text-align:right;border-color:var(--acc)}
.stopnav a.nx small{color:var(--acc)}
.complete{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--panel);border:1px solid var(--green);font:500 13px/1.4 var(--f-mono)}
.confirm{background:var(--panel);border:1px solid var(--red);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.sec{grid-template-columns:1fr}.sec .count{grid-row:auto;grid-column:1;text-align:left}.q{font-size:17px}}
/* Drawn figures and replays (Safety First, drawn in our own style from the article data) */
.fig{margin:16px 0;padding:12px 12px 10px;background:var(--bg);border:1px solid var(--rule);max-width:100%}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{margin-top:8px;font:500 12px/1.45 var(--f-mono);color:var(--muted)}
.fig text{font-family:var(--f-mono)}
.fig-steps{list-style:none;counter-reset:fs;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fig-steps li{counter-increment:fs;margin:0;font-size:13px;line-height:1.4;min-width:0}
.fig-steps b{display:block;font:700 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.fig-steps b::before{content:counter(fs) " "}
.brief .fig-steps b.c-c{color:var(--cyan)} .brief .fig-steps b.c-a{color:var(--amber)}
@media (max-width:600px){.fig-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.replay .rp-read,.fig .rp-read{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:1px;margin-top:8px;background:var(--rule);border:1px solid var(--rule)}
.replay .rp-read div,.fig .rp-read div{background:var(--panel);padding:6px 8px;font:600 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.replay .rp-read small,.fig .rp-read small{display:block;font:600 10px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.replay .rp-note,.fig .rp-note{margin:10px 0 0;max-width:72ch}
.replay .rp-ctl,.cards .rp-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.replay .rp-ctl button,.cards .rp-ctl button{background:var(--panel-2);border:1px solid var(--rule-2);padding:9px 14px;font:700 13px/1 var(--f-mono);letter-spacing:.06em;cursor:pointer}
.replay .rp-ctl button:disabled,.cards .rp-ctl button:disabled{opacity:.4;cursor:default}
.replay .rp-ctl .rp-n{font:600 12px var(--f-mono);color:var(--muted);margin-left:auto}
.replay .rp-ask{margin-top:12px;padding:12px;border:1px solid var(--amber);background:rgba(255,179,38,.06)}
.replay .rp-ask p{margin:0 0 8px;font-weight:600}
.replay .rp-ask button{display:block;width:100%;text-align:left;margin-top:6px;background:var(--panel);border:1px solid var(--rule-2);padding:10px 12px;cursor:pointer;font:inherit}
.replay .rp-ask button.ok{border-color:var(--green);color:var(--green)}
.replay .rp-ask button.no{border-color:var(--red);color:var(--red)}
.replay .rp-fb{margin:8px 0 0}
.rp-scene{display:grid;gap:8px}
.rp-scene.two{grid-template-columns:minmax(0,2.6fr) minmax(0,1fr);align-items:center}
.rp-scene svg{display:block;width:100%;height:auto}
.rp-pfd svg{border:1px solid var(--rule-2);border-radius:4px}
@media (max-width:600px){.rp-scene.two{grid-template-columns:minmax(0,1fr)}.rp-pfd{max-width:240px;justify-self:center;width:100%}}
.replay .ac{transition:transform .8s ease}
.cards .cd-q{margin:4px 0 8px;font-weight:600;max-width:72ch}
.cards .cd-o{display:block;width:100%;text-align:left;margin-top:6px;background:var(--panel);border:1px solid var(--rule-2);padding:10px 12px;cursor:pointer;font:inherit}
.cards .cd-o.ok{border-color:var(--green);color:var(--green)} .cards .cd-o.no{border-color:var(--red);color:var(--red)}
.sl-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:10px;font:600 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sl-row input{width:100%;accent-color:var(--cyan)} .sl-row output{color:var(--fg);min-width:7ch;text-align:right}
@media (max-width:520px){.sl-row{grid-template-columns:minmax(0,1fr) auto}.sl-row span{grid-column:1/-1}}
.fig .hs{cursor:pointer} .fig .hs:focus{outline:none} .fig .hs:focus circle{stroke:#fff}
.hs-info{margin-top:8px;min-height:2.6em} .hs-info p{margin:0;max-width:72ch}
.tblw{overflow-x:auto;margin:10px 0;border:1px solid var(--rule)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule)}
.tbl thead th{font:600 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.tbl tbody tr:last-child td{border-bottom:0}
@media (prefers-reduced-motion:reduce){.replay .ac{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ---------- QUESTION DATA ----------
   s: section (proc | abn | tech), t: topic, q: question, a: answer (HTML), src: reference */
const Q = [
/* ================= PROCEDURES (NORMAL) ================= */
{id:"p01",s:"proc",t:"Takeoff",q:"State the three limits on TFLEX (flexible takeoff temperature). What happens if TFLEX is at or below the actual OAT?",
a:`<ul><li>TFLEX must not exceed TMAXFLEX (the maximum flexible temperature, i.e. the maximum certified thrust reduction).</li><li>TFLEX must not be below TREF (the flat-rating reference temperature). Below TREF the engine already delivers full rated thrust, so FLEX gives no reduction.</li><li>TFLEX must be above the actual OAT (Outside Air Temperature).</li></ul><p>If TFLEX ≤ OAT, the FADEC (Full Authority Digital Engine Control) applies the MCT (Maximum Continuous Thrust) rating in the FLX/MCT detent. The fix is to recompute performance, or select TOGA (Takeoff/Go-Around). FLEX is not permitted on a contaminated runway.</p>`,
src:"FCOM LIM-ENG Reduced Thrust Takeoff; DSC-70 Flexible Takeoff"},
{id:"p02",s:"proc",t:"Takeoff",q:"During the takeoff roll in FLX, the PM notices the FLEX temperature on PERF TAKEOFF is wrong and corrects it. What is the effect on thrust?",
a:`<p>None. A FLEX temperature change during the takeoff has no effect on thrust. The only way to increase thrust during a flexible takeoff is to set the thrust levers to TOGA (Takeoff/Go-Around), which is available at any time.</p>`,
src:"FCOM DSC-70 Flexible Takeoff"},
{id:"p03",s:"proc",t:"Takeoff",q:"Read the FMA for a FLEX takeoff with a LOC available and NAV armed, at thrust set.",
a:`<p class="mono"><span class="c-w">MAN FLX +xx</span> | <span class="c-g">SRS</span> | <span class="c-g">RWY</span> / <span class="c-c">NAV</span> | 1FD2 | <span class="c-c">A/THR</span></p><ul><li>Column 1: MAN FLX with the FLEX temperature. A/THR (Autothrust) is armed (blue) but not active.</li><li>SRS (Speed Reference System) vertical, RWY lateral with NAV (Navigation) armed.</li><li>A/THR becomes active (white) when the levers come back to CL at thrust reduction altitude, triggered by LVR CLB flashing.</li></ul>`,
src:"FCOM DSC-22_30 FMA; PRO-NOR-SOP Takeoff"},
{id:"p04",s:"proc",t:"Takeoff",q:"What speed does SRS target with all engines operating, and after an engine failure? What pitch limit applies?",
a:`<ul><li>All engines operating: V2 + 10 kt.</li><li>Engine failure: the speed at which the failure occurred, limited between V2 and V2 + 15 kt.</li><li>SRS (Speed Reference System) pitch is limited to 18°, or 22.5° when windshear is detected.</li></ul>`,
src:"FCOM DSC-22_30 SRS mode; FCTM PR-AEP-ENG"},
{id:"p05",s:"proc",t:"Takeoff",q:"Describe the FCTM crosswind takeoff technique, and why large lateral sidestick inputs must be avoided.",
a:`<p>Apply half forward sidestick at the start of the roll and reduce it progressively to neutral by about 100 kt. Use rudder to keep the centreline and apply into-wind lateral stick only as needed to keep the wings level.</p><p>A large lateral sidestick input deploys roll spoilers on one wing. That reduces lift on that side, reduces tail clearance and increases tail-strike risk at rotation.</p>`,
src:"FCTM PR-NP-SOP Takeoff, Crosswind Takeoff"},
{id:"p06",s:"proc",t:"Climb & Cruise",q:"Define Cost Index. What do CI 0 and the maximum CI give you?",
a:`<p>CI (Cost Index) is the ratio of time-related cost to fuel cost. The FMS (Flight Management System) uses it to compute ECON (economic) speeds and Mach.</p><ul><li>CI 0: minimum fuel consumption (maximum range).</li><li>Maximum CI (999): minimum time.</li></ul><p>The tropopause entry on the INIT page also needs to be correct for accurate FMS predictions.</p>`,
src:"FCTM PR-NP-SP FMGS Initialization; FCOM DSC-22_20"},
{id:"p07",s:"proc",t:"Climb & Cruise",q:"What does green dot speed represent, and when is it used operationally?",
a:`<p>Green dot is the best lift-to-drag ratio speed in clean configuration. It gives the best climb gradient. It is the engine-out operating speed in clean configuration, and the recommended holding speed when no other speed is required.</p>`,
src:"FCOM DSC-22_30 Speeds; FCTM PR-AEP-ENG"},
{id:"p08",s:"proc",t:"Descent & Approach",q:"How is the approach phase activated, and what happens to managed speed if it is not?",
a:`<p>It activates automatically when the aircraft passes the DECEL (deceleration) pseudo-waypoint in NAV (Navigation) mode. You can also activate it manually with ACTIVATE APPR PHASE on the MCDU (Multipurpose Control and Display Unit) PERF page.</p><p>If it is not activated, managed speed keeps the descent target (for example 250 kt) and the aircraft does not decelerate towards green dot, S, F and VAPP.</p>`,
src:"FCOM DSC-22_20 Flight Phases; FCTM PR-NP-SOP Approach"},
{id:"p09",s:"proc",t:"Descent & Approach",q:"How does the FMGS compute VAPP?",
a:`<p>VAPP = VLS (Lowest Selectable Speed) + wind correction. The wind correction is one third of the tower headwind component entered on PERF APPR, with a minimum of 5 kt and a maximum of 15 kt. The crew may add further increments (for example ice accretion) by overwriting VAPP. VAPP must not be below VLS + 5 kt with A/THR (Autothrust) on, for autoland, with ice accretion, or with a gusty crosswind above 20 kt.</p>`,
src:"FCOM DSC-22_20 PERF APPR; FCTM PR-NP-SOP Approach"},
{id:"p10",s:"proc",t:"Descent & Approach",q:"Explain ground speed mini. Why does the speed target rise in a gust?",
a:`<p>In managed speed, the FMGS (Flight Management and Guidance System) raises the IAS (Indicated Airspeed) target above VAPP by a fraction of the difference between the current headwind and the tower headwind. The target never goes below VAPP.</p><ul><li><b>A320ceo:</b> factor 1, the full difference. This is equivalent to holding GS mini = VAPP − tower headwind.</li><li><b>A320neo family (including the A321neo):</b> factor 0.33, because of its lower deceleration capability. This limits excess speed at the flare when the headwind drops near the ground.</li></ul><p>If the headwind increases (a gust or a stronger wind aloft), the target rises. This keeps aircraft energy for the shear that follows. The target is shown as a magenta triangle. The tower wind must be entered on PERF APPR even when it is too light to change VAPP.</p>`,
src:"FCOM DSC-22_30 Ground Speed Mini; Safety First: Control your Speed — Descent, Approach and Landing"},
{id:"p11",s:"proc",t:"Descent & Approach",q:"List the flight parameter deviation callouts on approach and their thresholds.",
a:`<ul><li><b>SPEED</b>: speed above VAPP + 10 kt or below VAPP − 5 kt.</li><li><b>SINK RATE</b>: V/S (Vertical Speed) greater than 1 000 ft/min.</li><li><b>BANK</b>: bank angle above 7°.</li><li><b>PITCH</b>: pitch above +10° or below −2.5°.</li><li><b>LOC</b> / <b>GLIDE SLOPE</b>: more than ½ dot.</li><li><b>COURSE</b>: more than ½ dot (VOR) or 5° (NDB).</li></ul>`,
src:"FCOM PRO-NOR-SOP Flight Parameters / Callouts"},
{id:"p12",s:"proc",t:"Descent & Approach",q:"What does the FCTM define as a stabilised approach, and at what heights?",
a:`<p>The aircraft is on the correct lateral and vertical flight path, in the desired landing configuration, with thrust stabilised (usually above idle) and no excessive flight parameter deviation.</p><p>FCTM gate: stabilised by 1 000 ft AAL (Above Aerodrome Level) in IMC (Instrument Meteorological Conditions) and 500 ft AAL in VMC (Visual Meteorological Conditions). Otherwise, go around. Jet2 SOP gates are expressed as ARTE (Above Runway Threshold Elevation), and the operator gate applies.</p>`,
src:"FCTM PR-NP-SOP Stabilized Approach"},
{id:"p13",s:"proc",t:"Landing",q:"What is the RETARD callout logic for manual landings and autoland?",
a:`<p>Manual landing: the RETARD auto-callout sounds at 20 ft RA (Radio Altitude) as a reminder to bring the thrust levers to IDLE. Autoland: it sounds at 10 ft RA. RETARD is a reminder, not an order, but the levers must be at IDLE by touchdown at the latest so the ground spoilers extend. The flare starts at about 30 ft RA on the A318/A319/A320 and about <b>40 ft RA on the A321</b>.</p>`,
src:"FCOM DSC-31 Auto Callouts; FCTM PR-NP-SOP Landing"},
{id:"p14",s:"proc",t:"Landing",q:"When must REV MAX be selected immediately after touchdown?",
a:`<ul><li>An emergency.</li><li>Deceleration not as expected.</li><li>A failure affecting landing performance.</li><li>A long flare or long touchdown.</li><li>An unexpected tailwind.</li></ul><p>Once reverse is selected, a full-stop landing is mandatory.</p>`,
src:"FCOM PRO-NOR-SOP-19 Landing"},
{id:"p15",s:"proc",t:"Landing",q:"State the 70 kt, 20 kt and taxi-speed actions during rollout, including the snow-covered runway case.",
a:`<ul><li>70 kt: PM calls "SEVENTY KNOTS", PF selects REV IDLE. Maximum reverse should not be used below 70 kt (except in an emergency) because re-ingestion can cause engine stall and EGT (Exhaust Gas Temperature) exceedance. Idle reverse is permitted to a stop.</li><li>Before 20 kt: disengage the autobrake with the brake pedals to avoid jerky braking at low speed.</li><li>Taxi speed: stow the reversers before vacating. On snow-covered ground, stow at 25 kt to prevent snow re-ingestion (flameout or rollback).</li></ul>`,
src:"FCOM LIM-ENG Reverse Thrust; PRO-NOR-SOP-19"},
{id:"p16",s:"proc",t:"Go-Around",q:"Give the go-around actions, callouts and FMA.",
a:`<ol><li>PF: thrust levers TOGA (Takeoff/Go-Around) and rotate to SRS (Speed Reference System) pitch. Calls "GO AROUND – FLAPS".</li><li>PM: retracts flaps one step and checks the FMA.</li><li>Positive climb: "GEAR UP".</li></ol><p class="mono"><span class="c-w">MAN TOGA</span> | <span class="c-g">SRS</span> | <span class="c-g">GA TRK</span> | AP1 | 1FD2 | <span class="c-c">A/THR</span></p><p>A/THR (Autothrust) is armed (blue). It becomes active when the levers are returned to CL at thrust reduction altitude.</p>`,
src:"FCOM PRO-NOR-SOP Go-Around; FCTM PR-NP-SOP Go-Around"},
{id:"p17",s:"proc",t:"Go-Around",q:"A failure occurs at 1 200 ft RA on a CAT II/III approach. What is the rule?",
a:`<p>All ECAM (Electronic Centralized Aircraft Monitoring) actions, and any DH (Decision Height) amendment, must be complete before 1 000 ft RA (Radio Altitude). If not, go around. This protects task sharing for the final part of the approach.</p>`,
src:"FCTM PR-NP-SOP Go-Around Strategy (CAT II/III)"},

/* ================= ABNORMAL PROCEDURES ================= */
{id:"a01",s:"abn",t:"Memory Items",q:"List the A320 memory items.",
a:`<ul><li>LOSS OF BRAKING</li><li>EMERGENCY DESCENT (initial actions)</li><li>UNRELIABLE SPEED INDICATION (initial actions)</li><li>WINDSHEAR (reactive) and WINDSHEAR AHEAD (predictive)</li><li>EGPWS (Enhanced Ground Proximity Warning System) / GPWS alerts</li><li>TCAS (Traffic Collision Avoidance System) warnings</li><li>STALL RECOVERY</li><li>STALL WARNING AT LIFT-OFF</li></ul><p>Check the current Jet2 QRH (Quick Reference Handbook) for the exact list on your fleet standard.</p>`,
src:"FCOM PRO-ABN Memory Items; QRH"},
{id:"a02",s:"abn",t:"Memory Items",q:"UNRELIABLE SPEED INDICATION: state the memory items and the pitch/thrust targets.",
a:`<p>AP (Autopilot) OFF, A/THR (Autothrust) OFF, FD (Flight Director) OFF, then:</p><ul><li>Below THR RED ALT (thrust reduction altitude): TOGA / 15°.</li><li>Above THR RED ALT, below FL100: CLB / 10°.</li><li>Above FL100: CLB / 5°.</li></ul><p>Flaps: if CONF 0, keep CONF 0. Otherwise keep the current configuration. Speedbrakes retracted. Landing gear up (if safe).</p><p>When the flight path is safe and stable, use the QRH pitch/thrust tables.</p>`,
src:"FCOM PRO-ABN-34 Unreliable Speed Indication; FCTM PR-AEP-NAV"},
{id:"a03",s:"abn",t:"Memory Items",q:"LOSS OF BRAKING: give the memory items in order.",
a:`<ol><li>REV: MAX.</li><li>BRAKE PEDALS: RELEASE.</li><li>A/SKID &amp; N/W STRG (Anti-Skid and Nosewheel Steering): OFF.</li><li>BRAKE PEDALS: PRESS. Limit brake pressure to about 1 000 PSI.</li><li>If still no braking: PARKING BRAKE with short, successive applications.</li></ol><p>Releasing the pedals before switching A/SKID off avoids a sudden full-pressure application on the alternate system.</p>`,
src:"FCOM PRO-ABN-32 Loss of Braking; QRH"},
{id:"a04",s:"abn",t:"Memory Items",q:"EMERGENCY DESCENT: what are the memory items?",
a:`<ol><li>CREW OXY MASKS: USE.</li><li>SIGNS: ON.</li><li>EMERGENCY DESCENT: INITIATE.</li></ol><p>Initiate means: select a lower altitude and pull, HDG (Heading) as required, SPD/MACH as appropriate (MMO/VMO if structural integrity is not in doubt), THR IDLE if A/THR (Autothrust) is not engaged, then SPD BRK FULL. The ECAM procedure follows once established.</p>`,
src:"FCOM PRO-ABN-80 Emergency Descent; FCTM PR-AEP-MISC"},
{id:"a05",s:"abn",t:"Memory Items",q:"Reactive WINDSHEAR warning during approach. Actions? What if the FD is not available?",
a:`<ul><li>Thrust levers to TOGA (Takeoff/Go-Around). Follow SRS (Speed Reference System) orders, which may require full backstick.</li><li>If the FD (Flight Director) is not available: set an initial pitch attitude of up to 17.5°, increasing if necessary.</li><li>Do not change configuration (slats/flaps, gear) until out of the windshear.</li><li>Closely monitor flight path and speed. Rely on the flight envelope protections.</li></ul>`,
src:"FCOM PRO-ABN-34 Windshear; FCTM PR-AEP-SURV Windshear"},
{id:"a06",s:"abn",t:"Memory Items",q:"STALL RECOVERY: state the memory items.",
a:`<ol><li>NOSE DOWN PITCH CONTROL: APPLY, to reduce AOA (Angle of Attack).</li><li>BANK: WINGS LEVEL.</li><li>When out of stall (no more stall indications): THRUST INCREASE SMOOTHLY as needed, SPEEDBRAKES CHECK RETRACTED, FLIGHT PATH RECOVER SMOOTHLY.</li><li>If in clean configuration below FL200 and no risk of ground contact: FLAP 1 SELECT.</li></ol><p>Thrust is not the first action. On underwing engines, thrust produces a nose-up moment that can delay recovery.</p>`,
src:"FCOM PRO-ABN-27 Stall Recovery; FCTM PR-AEP-SURV"},
{id:"a07",s:"abn",t:"RTO & Engine Failure",q:"Describe the low-speed and high-speed RTO regimes and the reject criteria above 100 kt.",
a:`<p>The dividing line is 100 kt. Below 100 kt: reject at the Captain's discretion, and seriously consider stopping for any ECAM (Electronic Centralized Aircraft Monitoring) warning or caution.</p><p>Above 100 kt and below V1, be go-minded. Reject only for:</p><ul><li>Fire warning or severe damage.</li><li>Sudden loss of engine thrust.</li><li>A malfunction or condition with an unambiguous indication that the aircraft will not fly safely.</li><li>Any red ECAM warning.</li><li>Any amber ECAM caution listed in the FCTM.</li></ul><p>EGT (Exhaust Gas Temperature) red line exceedance or nose gear vibration should not cause a reject above 100 kt. The ECAM inhibits most warnings from 80 kt to 1 500 ft, so any alert that appears in this window is significant.</p>`,
src:"FCTM PR-AEP-MISC Rejected Takeoff"},
{id:"a08",s:"abn",t:"RTO & Engine Failure",q:"During an RTO, when must the Captain brake manually, and what does the DECEL light tell you?",
a:`<p>Manual maximum braking (pedals fully pressed to a stop) is needed if the autobrake is inoperative, or if the reject is below 72 kt. Below 72 kt the ground spoilers do not deploy and A/BRK MAX does not activate. With A/BRK MAX working, avoid pressing the pedals.</p><p>DECEL means actual deceleration has reached about 80% of the selected rate. It does not confirm the autobrake is working. On a contaminated runway it may never come on even though antiskid is working correctly. Confirm deceleration by feel and by the PFD (Primary Flight Display) speed trend.</p>`,
src:"FCTM PR-AEP-MISC RTO Technique; FCOM DSC-32"},
{id:"a09",s:"abn",t:"RTO & Engine Failure",q:"Engine failure after V1: rotation technique, pitch target and use of the beta target.",
a:`<p>At VR, rotate at about 3°/s towards an initial pitch of 12.5°, then follow SRS (Speed Reference System) orders.</p><p>The blue beta target replaces the yellow sideslip index. The lateral normal law commands some rudder to minimise sideslip, but not the full amount, so the pilot adds rudder pedal to centre the beta target. Control heading with bank. If the beta target cannot be centred with full rudder, accelerate. Trim out pedal force with rudder trim, then engage the AP (Autopilot).</p><p>Aircraft handling comes first. Stabilise pitch, speed and flight path before starting ECAM actions.</p>`,
src:"FCTM PR-AEP-ENG Engine Failure After V1; FCOM DSC-27"},
{id:"a10",s:"abn",t:"RTO & Engine Failure",q:"How do you tell a flameout without damage from an engine failure with damage?",
a:`<p>Flameout without damage: rapid decrease in N1, N2, EGT (Exhaust Gas Temperature) and FF (Fuel Flow).</p><p>Suspect damage if two or more of the following occur:</p><ul><li>Rapid EGT increase above the red line.</li><li>Significant rotor speed mismatch, or no rotation.</li><li>Significant vibration and/or buffeting.</li><li>Abnormal oil pressure or temperature.</li><li>Hydraulic system loss.</li><li>Repeated or uncontrollable engine stalls.</li></ul><p>The answer decides the ECAM path: ENG SHUT DOWN with relight consideration, or ENG FAIL with damage (no relight).</p>`,
src:"FCTM PR-AEP-ENG Engine Failure — General"},
{id:"a11",s:"abn",t:"ECAM & Systems",q:"Dual hydraulic failure: give the flight control law for each combination, and the common consequences.",
a:`<ul><li>G + B: Alternate law.</li><li>G + Y: Alternate law. The stabiliser is lost, so autotrim is done through the elevators.</li><li>B + Y: Normal law.</li></ul><p>In every case: red LAND ASAP (declare MAYDAY), AP (Autopilot) lost while FD (Flight Director) and A/THR (Autothrust) remain, landing gear gravity extension, and a complex procedure. After the ECAM, refer to the QRH (Quick Reference Handbook) summary. Manoeuvre gently to limit demand on the remaining system.</p>`,
src:"FCTM PR-AEP-HYD Dual Hydraulic Failures"},
{id:"a12",s:"abn",t:"ECAM & Systems",q:"HYD G+Y SYS LO PR: why must you be stabilised at VAPP before gear extension? Which PFD message do you disregard?",
a:`<p>The stabiliser is lost, so in Alternate law autotrim is done by the elevators. Gear extension reverts pitch to Direct law. At that moment the mean elevator position is memorised as the neutral (centred-sidestick) reference. If the gear goes down before you are stabilised at VAPP, that reference is wrong, and flare and go-around pitch control become difficult.</p><p>Disregard USE MAN PITCH TRIM after gear extension, because the stabiliser is unavailable.</p>`,
src:"FCTM PR-AEP-HYD Dual Hydraulic Failures — G+Y"},
{id:"a13",s:"abn",t:"ECAM & Systems",q:"For which failures must the PTU be switched off without delay, and why?",
a:`<p>When the ECAM asks for it in:</p><ul><li>HYD G(Y) RSVR LO LVL.</li><li>HYD G(Y) RSVR LO AIR PR (only if pressure fluctuates).</li><li>HYD G(Y) RSVR OVHT.</li></ul><p>Reason: a PTU (Power Transfer Unit) overheat can follow about 2 minutes later and lead to loss of the second (healthy) hydraulic system.</p>`,
src:"FCTM PR-AEP-HYD Use of PTU in Case of Failure"},
{id:"a14",s:"abn",t:"ECAM & Systems",q:"Slats or flaps jam during configuration on approach with A/THR active. Immediate actions and key limits?",
a:`<ul><li>Pull the speed knob for selected speed. This stops the deceleration.</li><li>Delay the approach (hold or extend) and complete the ECAM. Then use QRH LANDING WITH FLAPS OR SLATS JAMMED.</li><li>Configure using SPD SEL VFE NEXT − 5 kt. Speed may go below manoeuvring speed for the current configuration but must stay above VLS (Lowest Selectable Speed). Change configuration preferably with wings level.</li><li>The AP (Autopilot) may be used down to 500 ft AGL (Above Ground Level), but monitor it.</li><li>For a diversion with slats/flaps extended, the maximum altitude is 20 000 ft.</li></ul>`,
src:"FCTM PR-AEP-F_CTL Slats/Flaps; FCOM LIM-F_CTL; QRH"},
{id:"a15",s:"abn",t:"ECAM & Systems",q:"Overweight landing: which hard-landing threshold applies, and what is different for a normal-weight landing?",
a:`<p>The 360 ft/min vertical speed threshold at touchdown applies to <b>overweight</b> landings. Exceeding it requires a hard/overweight landing inspection.</p><p>For a normal-weight landing there is no single V/S (Vertical Speed) figure for the crew to apply. Hard-landing determination relies on the LOAD &lt;15&gt; report and the AMM (Aircraft Maintenance Manual) 05-51-11 assessment. The crew still reports a suspected hard landing in the tech log.</p>`,
src:"FCOM PRO-ABN Overweight Landing; AMM 05-51-11; Safety First #26/#27"},
{id:"a16",s:"abn",t:"Emergencies",q:"Describe the [QRH] EMER EVAC task sharing, and the purpose of CABIN CREW AT STATIONS.",
a:`<p>The Captain builds the evacuation decision. The F/O (First Officer) runs the QRH EMER EVAC items up to the decision point (aircraft stopped, parking brake, ATC (Air Traffic Control) notified, Delta P check if applicable, engines and APU (Auxiliary Power Unit) masters off, fire pushbuttons, agents as required). The evacuation can be deferred or cancelled until it is ordered. Once ordered, it cannot be reversed.</p><p>"CABIN CREW AT STATIONS" (PA, Public Address) alerts the cabin crew to a possible evacuation and confirms the flight crew is in control. This prevents an unnecessary evacuation started by the cabin.</p>`,
src:"FCTM PR-AEP-MISC Evacuation; QRH EMER EVAC"},
{id:"a17",s:"abn",t:"Emergencies",q:"When is the Delta P check relevant in EMER EVAC, and why is it not needed after an RTO?",
a:`<p>After CAB PR SYS 1+2 FAULT in flight, the crew controls the outflow valve manually (MAN V/S CTL FULL UP on final). Residual cabin pressure is possible, and the door residual-pressure indicator is inhibited with slides armed, so the QRH asks for a Delta P check.</p><p>After an RTO (Rejected Takeoff), at least one automatic pressure controller is operating, so there is no residual pressure.</p>`,
src:"FCTM PR-AEP-MISC Evacuation"},
{id:"a18",s:"abn",t:"Emergencies",q:"TCAS RA: what are the crew actions?",
a:`<p>On aircraft with AP/FD TCAS mode (AP: Autopilot, FD: Flight Director): keep the AP engaged and monitor it flying the vertical speed green zone, or follow the FD orders if the AP is off. A/THR (Autothrust) stays engaged.</p><p>Without AP/FD TCAS: AP OFF, both FDs OFF, and fly the V/S (Vertical Speed) to the green sector on the PFD (Primary Flight Display) with smooth, firm inputs. Never fly against the RA (Resolution Advisory). Stall, windshear and GPWS (Ground Proximity Warning System) warnings take priority over TCAS. Notify ATC (Air Traffic Control), then return to the clearance when "CLEAR OF CONFLICT" sounds.</p>`,
src:"FCOM PRO-ABN-34 TCAS; FCTM PR-AEP-SURV"},

/* ================= A320 TECHNICAL KNOWLEDGE ================= */
{id:"t01",s:"tech",t:"Hydraulics",q:"Describe the hydraulic architecture: systems, pressure and pump sources.",
a:`<p>Three independent systems, Green, Blue and Yellow, each at 3 000 PSI.</p><ul><li><b>Green</b>: engine 1 driven pump.</li><li><b>Blue</b>: electric pump. The RAT (Ram Air Turbine) is the emergency source.</li><li><b>Yellow</b>: engine 2 driven pump, plus an electric pump and a hand pump (the hand pump is used for cargo door operation).</li></ul><p>The PTU (Power Transfer Unit) links Green and Yellow. There is no fluid transfer between systems.</p>`,
src:"FCOM DSC-29 Hydraulic — Description"},
{id:"t02",s:"tech",t:"Hydraulics",q:"How does the PTU operate, and when is it inhibited?",
a:`<p>The PTU (Power Transfer Unit) runs automatically, in either direction, when the pressure differential between Green and Yellow exceeds 500 PSI. It transfers hydraulic power, not fluid.</p><p>It is inhibited during cargo door operation, when the Yellow electric pump runs from the door control, so that Green is not pressurised. There are further ground inhibition conditions linked to engine start and the parking brake: check FCOM DSC-29 for the exact logic on your standard. The PTU pushbutton can switch it off manually.</p>`,
src:"FCOM DSC-29 PTU"},
{id:"t03",s:"tech",t:"Hydraulics",q:"When does the RAT deploy automatically, and what does it power?",
a:`<p>It deploys automatically when AC BUS 1 and AC BUS 2 are both lost (with speed above 100 kt). It can also be deployed manually (RAT MAN ON).</p><p>It pressurises the Blue system, which drives the CSM/G (Constant Speed Motor/Generator, the emergency generator) and provides Blue hydraulic power for flight controls.</p>`,
src:"FCOM DSC-29 RAT; DSC-24 Emergency Generation"},
{id:"t04",s:"tech",t:"Electrics",q:"List the AC and DC generation sources and their ratings.",
a:`<ul><li>2 IDGs (Integrated Drive Generators), one per engine, 90 kVA each, 115 V / 400 Hz.</li><li>APU GEN (Auxiliary Power Unit generator), 90 kVA.</li><li>Emergency generator (CSM/G), driven by the Blue system, 5 kVA.</li><li>External power (GPU, Ground Power Unit).</li><li>2 batteries, plus a static inverter that supplies AC STAT INV from battery power.</li><li>DC from TR (Transformer Rectifier) 1, TR 2 and the ESS TR.</li></ul>`,
src:"FCOM DSC-24 Electrical — General"},
{id:"t05",s:"tech",t:"Electrics",q:"What does the AC ESS FEED pushbutton do?",
a:`<p>The AC ESS bus is normally supplied from AC BUS 1. If AC BUS 1 is lost, AC ESS is transferred to AC BUS 2. On older standards this is done manually with the AC ESS FEED pushbutton (ALTN). On later standards the transfer is automatic and the pushbutton is the backup. AC ESS BUS FAULT is the associated ECAM alert.</p>`,
src:"FCOM DSC-24 AC ESS Bus"},
{id:"t06",s:"tech",t:"Flight Controls",q:"Name the flight control computers and their primary roles.",
a:`<ul><li>2 ELACs (Elevator Aileron Computers): normal elevator and stabiliser control, and aileron control. They compute normal law.</li><li>3 SECs (Spoiler Elevator Computers): spoiler control, plus standby elevator and stabiliser control.</li><li>2 FACs (Flight Augmentation Computers): yaw damper, rudder trim, rudder travel limit, and flight envelope/speed computation.</li><li>The rudder keeps a mechanical backup from the pedals. Pitch has mechanical backup through the trim wheel.</li></ul>`,
src:"FCOM DSC-27 Flight Controls — Architecture"},
{id:"t07",s:"tech",t:"Flight Controls",q:"State the normal law protections and their limits.",
a:`<ul><li>Load factor: +2.5 g / −1 g clean. +2 g / 0 g with slats extended.</li><li>Pitch attitude: +30° nose up (reducing progressively to 25° at low speed). −15° nose down.</li><li>Bank angle: 67° maximum with full stick. Spiral stability returns the aircraft to 33° when the stick is released.</li><li>High AOA (Angle of Attack): α prot, α floor (A/THR (Autothrust) TOGA LK), α max.</li><li>High speed: VMO/MMO protection with nose-up demand. Bank is limited to 45° above VMO/MMO.</li></ul>`,
src:"FCOM DSC-27 Flight Control Laws — Protections"},
{id:"t08",s:"tech",t:"Flight Controls",q:"In Alternate law, what happens when the landing gear is extended, and why does it matter?",
a:`<p>Pitch reverts from Alternate to Direct law. Autotrim stops and "USE MAN PITCH TRIM" appears on the PFD (Primary Flight Display). Pitch trim must then be managed manually with the trim wheel. Stabilise at VAPP before gear extension so the aircraft is in trim at the reversion (see the G+Y dual hydraulic case).</p>`,
src:"FCOM DSC-27 Control Laws — Reconfiguration"},
{id:"t09",s:"tech",t:"Flight Controls",q:"How many spoilers per wing, and which functions do they perform?",
a:`<p>Five per wing.</p><ul><li>Ground spoilers: all five.</li><li>Roll spoilers: 2 to 5.</li><li>Speedbrakes: 2 to 4.</li></ul><p>Each spoiler is controlled by a SEC (Spoiler Elevator Computer) and powered by one hydraulic system. Speedbrake extension is inhibited in CONF FULL, when alpha protection or alpha floor is active, with thrust levers above MCT (Maximum Continuous Thrust), and with certain SEC or elevator faults. If inhibited while extended, the speedbrakes retract automatically and stay retracted until the lever is reset. Check FCOM DSC-27 for the exact list on your standard.</p>`,
src:"FCOM DSC-27 Spoilers and Speedbrakes"},
{id:"t10",s:"tech",t:"Landing Gear & Brakes",q:"Describe the normal, alternate and accumulator braking modes.",
a:`<ul><li><b>Normal</b>: Green hydraulics, controlled by the BSCU (Brake and Steering Control Unit), with antiskid and autobrake available.</li><li><b>Alternate</b>: Yellow hydraulics through the ALTN brake control. Antiskid is available if the BSCU is serviceable. No autobrake.</li><li><b>Alternate without antiskid</b>: limit brake pressure to about 1 000 PSI.</li><li><b>Accumulator</b>: with no Yellow pressure, the brake accumulator gives at least 7 full brake applications (also used for the parking brake).</li></ul>`,
src:"FCOM DSC-32 Brakes and Antiskid"},
{id:"t11",s:"tech",t:"Landing Gear & Brakes",q:"What drives nosewheel steering, and what are the tiller and pedal authority limits?",
a:`<p>Yellow hydraulic pressure, controlled by the BSCU (Brake and Steering Control Unit). Tiller authority is up to ±75°. Rudder pedal authority is about ±6°, reducing with ground speed. Steering is lost with A/SKID &amp; N/W STRG OFF.</p>`,
src:"FCOM DSC-32 Nose Wheel Steering"},
{id:"t12",s:"tech",t:"Landing Gear & Brakes",q:"How is landing gear gravity extension performed, and what happens to hydraulic supply?",
a:`<p>Turn the crank handle clockwise three turns. This isolates the landing gear hydraulics from Green, unlocks the doors and gear, and lets them free-fall, helped by aerodynamic forces. Gear indications come from LGCIU (Landing Gear Control and Interface Unit) 1 if it is electrically supplied. The doors stay open after gravity extension.</p>`,
src:"FCOM DSC-32 Landing Gear — Gravity Extension"},
{id:"t13",s:"tech",t:"Fuel",q:"Why is centre tank fuel used before wing fuel, and how is the wing tank LO LVL warning triggered?",
a:`<p>Wing fuel is kept as long as possible for wing bending relief, which reduces structural loads in flight. Centre tank fuel is therefore used (or transferred) first.</p><p>LO LVL (low level) comes on when the fuel in a wing tank falls below about 750 kg, sensed independently of the FQI (Fuel Quantity Indication). The FLSCU (Fuel Level Sensing Control Unit) handles the level-sensing logic.</p>`,
src:"FCOM DSC-28 Fuel — Description, Indications"},
{id:"t14",s:"tech",t:"Fuel",q:"What is gravity feeding, and what limits apply?",
a:`<p>If the wing tank pumps fail, the engines can draw fuel from the wing tanks by suction (gravity feed). Centre tank fuel is unusable in this case. The gravity-feed ceiling depends on how long the fuel has been in the tanks (fuel deaeration) and on fuel temperature. Apply the FCOM gravity-feed ceiling table: descend to that level if required and avoid negative g.</p>`,
src:"FCOM DSC-28 Fuel Feed; PRO-ABN-28 FUEL L(R) WING TK PUMP 1+2 LO PR"},
{id:"t15",s:"tech",t:"Pneumatics & APU",q:"What are the APU bleed and engine-start altitude limits?",
a:`<ul><li>APU (Auxiliary Power Unit) bleed for air conditioning/pressurisation: up to 22 500 ft.</li><li>APU bleed for engine start: up to 20 000 ft.</li><li>APU generator: up to the aircraft's maximum operating altitude.</li></ul><p>Confirm the figures against FCOM LIM-49 for your MSN (Manufacturer Serial Number), because they vary by APU model and standard.</p>`,
src:"FCOM LIM-APU"},
{id:"t16",s:"tech",t:"Ice Protection",q:"Which surfaces does wing anti-ice protect, and how does it behave on the ground?",
a:`<p>Hot engine bleed air heats the three outboard slats (slats 3, 4 and 5) on each wing. On the ground, selecting WING anti-ice ON opens the valves for a 30-second test sequence and then closes them. WING A.ICE is not used on the ground (with a few test exceptions).</p>`,
src:"FCOM DSC-30 Wing Anti Ice"},
{id:"t17",s:"tech",t:"Ice Protection",q:"When is probe and window heating active automatically?",
a:`<p>Automatically when at least one engine is running, or in flight. On the ground, pitot heating is at low power. The PROBE/WINDOW HEAT pushbutton (ON) forces heating with engines stopped. Windshields are at low power on the ground and normal power in flight.</p>`,
src:"FCOM DSC-30 Probes and Window Heat"},
{id:"t18",s:"tech",t:"Engines (LEAP-1A)",q:"On the LEAP-1A, what is the actuation medium for the fuel-driven actuators (via the SVA), and why is this significant?",
a:`<p>Engine fuel, pressurised by the engine fuel pump, is the "fueldraulic" working fluid. The SVA (Servo Valve Assembly), commanded by the FADEC (Full Authority Digital Engine Control) through the SCU (Split Control Unit), positions the variable geometry actuators.</p><p>These actuators do not use aircraft Green or Yellow hydraulics. Engine variable geometry is therefore unaffected by an aircraft hydraulic failure.</p>`,
src:"FCOM DSC-70 Engine — Control (LEAP-1A)"},
{id:"t19",s:"tech",t:"Navigation",q:"Describe the ADIRS architecture and IR alignment.",
a:`<p>Three ADIRUs (Air Data and Inertial Reference Units). Each has an ADR (Air Data Reference) part and an IR (Inertial Reference) part. ADIRU 3 is the standby, and can replace 1 or 2 through the AIR DATA and ATT HDG switching selectors.</p><p>A normal IR alignment takes about 10 minutes (longer at high latitude). Do not move the aircraft during alignment. In ATT mode (attitude only), heading must be entered manually and drifts over time.</p>`,
src:"FCOM DSC-34 ADIRS"},
];
